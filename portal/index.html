}

function setQuizConfig(key, value) {
  quizConfig[key] = value;
  if (key === 'level') quizConfig.weeks = [];   // reset week scope when level changes
  renderQuizSetup(currentView.ref);
}

function toggleQuizWeek(w) {
  const arr = Array.isArray(quizConfig.weeks) ? quizConfig.weeks.slice() : [];
  const i = arr.indexOf(w);
  if (i >= 0) arr.splice(i, 1); else arr.push(w);
  quizConfig.weeks = arr.sort((a, b) => a - b);
  renderQuizSetup(currentView.ref);
}

function clearQuizWeeks() {
  quizConfig.weeks = [];
  renderQuizSetup(currentView.ref);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  const pool = filterPool(quizConfig.scope);
  if (pool.length < 4) return;
  const items = shuffle(pool).slice(0, Math.min(quizConfig.length, pool.length));
  quizState = { pool, items, idx: 0, score: 0, answered: false };
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const { items, idx, score, pool } = quizState;
  const total = items.length;
  const item = items[idx];
  const meaningKey = quizConfig.direction; // 'tr' or 'en'

  // Build distractors: 3 random different entries with a meaning value
  const others = shuffle(pool.filter(e => e.ar !== item.ar && e[meaningKey] && e[meaningKey] !== item[meaningKey])).slice(0, 3);
  const choices = shuffle([item, ...others]);

  const ref = currentView.ref;
  const main = document.getElementById('main');
  const pct = Math.round((idx / total) * 100);

  main.innerHTML = `
    <div class="topic-header">
      <h2>${ref.title[lang]}</h2>
      <p>${t('question')} ${idx + 1} ${t('of')} ${total} · ${t('quizScore')}: ${score}</p>
    </div>
    <div class="section">
      <div class="quiz-card">
        <div class="q-progress-bar"><div class="q-progress-fill" style="width:${pct}%"></div></div>
        <div class="quiz-arabic">${escapeHtml(item.ar)}</div>
        <div class="quiz-choices" id="quiz-choices">
          ${choices.map((c, i) => `<button class="quiz-choice" data-correct="${c.ar === item.ar}" onclick="answerQuiz(this, ${i})">${escapeHtml(c[meaningKey] || '—')}</button>`).join('')}
        </div>
        <div id="quiz-feedback"></div>
      </div>
    </div>`;
  quizState.answered = false;
  quizState.currentItem = item;
}

function answerQuiz(btn, choiceIdx) {
  if (quizState.answered) return;
  quizState.answered = true;
  const isCorrect = btn.dataset.correct === 'true';
  const item = quizState.currentItem;
  if (isCorrect) quizState.score++;

  document.querySelectorAll('#quiz-choices .quiz-choice').forEach(b => {
    b.disabled = true;
    if (b.dataset.correct === 'true') b.classList.add('correct');
    else if (b === btn) b.classList.add('wrong');
  });

  const meaningKey = quizConfig.direction;
  const otherKey = meaningKey === 'tr' ? 'en' : 'tr';
  const fb = document.getElementById('quiz-feedback');
  fb.innerHTML = `
    <div class="quiz-source">
      <strong>${escapeHtml(item.ar)}</strong> — ${escapeHtml(item[meaningKey] || '')}
      ${item[otherKey] ? ` <span style="opacity:0.7">· ${escapeHtml(item[otherKey])}</span>` : ''}
      <br><span style="opacity:0.7">${t('quizSource')}: ${escapeHtml(item.source || '—')}</span>
    </div>
    <div class="q-actions" style="margin-top:14px">
      <span class="spacer"></span>
      <button class="btn-primary" onclick="nextQuiz()">${quizState.idx === quizState.items.length - 1 ? t('finishPractice') : t('nextQuestion')}</button>
    </div>`;
}

function nextQuiz() {
  quizState.idx++;
  if (quizState.idx >= quizState.items.length) {
    showQuizScore();
  } else {
    renderQuizQuestion();
    document.getElementById('main').scrollTop = 0;
  }
}

function showQuizScore() {
  const { score, items } = quizState;
  const ref = currentView.ref;
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="topic-header">
      <h2>${ref.title[lang]}</h2>
    </div>
    <div class="section">
      <div class="score-card">
        <div class="score-num">${score} / ${items.length}</div>
        <div class="score-label">${t('quizCorrect')}</div>
        <p style="color:var(--muted);margin-bottom:24px;font-size:0.9rem">${t('practiceComplete')}</p>
        <div class="score-actions">
          <button class="btn-secondary" onclick="renderQuizSetup(currentView.ref)">${t('backToTopic')}</button>
          <button class="btn-primary" onclick="startQuiz()">${t('tryAgain')}</button>
        </div>
      </div>
    </div>`;
}

// ─── Flashcards ─────────────────────────────────────────────────────────────
// Same word pool as the Vocabulary Quiz (filterPool), presented as flip cards.
let flashState = null;  // { refId, deck, idx, flipped }

function flashcardFaces(e) {
  // Meaning text in the viewer's language. EN can be missing → fall back to TR.
  const meaning = (lang === 'en' || lang === 'ar') ? (e.en || e.tr) : (e.tr || e.en);
  // Default (TR/EN UI): Arabic on the front, meaning revealed on flip.
  // Arabic UI: reverse it — meaning on the front, Arabic revealed on flip.
  if (lang === 'ar') {
    return { front: meaning, frontArabic: false, back: e.ar, backArabic: true };
  }
  return { front: e.ar, frontArabic: true, back: meaning, backArabic: false };
}

// Build a fresh shuffled deck for the given source/level/week, limited to
// `count` cards. Same access-gated vocabulary pool as the quiz (filterPool).
function buildFlashDeck(scope, count, level, weeks) {
  const pool = shuffle(filterPool(scope, { level, weeks, scope }));
  return pool.slice(0, count);
}

function renderFlashcards(ref) {
  const main = document.getElementById('main');

  if (!VOCAB_POOL) {
    main.innerHTML = `
      <div class="topic-header"><h2>${ref.title[lang]}</h2><p>${ref.desc[lang]}</p></div>
      <div class="section"><div class="practice-start" style="text-align:left">
        <p style="color:var(--mid);line-height:1.7">${escapeHtml(t('quizNotReady'))}</p>
      </div></div>`;
    return;
  }

  // Initialise (or re-init when switching to this module). Default: All / 10.
  // Position/scope/count persist across re-renders (e.g. language toggle).
  if (!flashState || flashState.refId !== ref.id) {
    flashState = { refId: ref.id, scope: 'all', count: 10, level: 'all', weeks: [], deck: buildFlashDeck('all', 10, 'all', []), idx: 0, flipped: false };
  }
  const { deck, idx } = flashState;

  // Source / level / week / count selectors, mirroring the Vocabulary Quiz.
  const scopes = [
    ['all', t('quizScopeAll')],
    ['answerkeys', t('quizScopeAnswerKeys')],
    ['surah', t('quizScopeSurah')],
  ];
  const scopePills = scopes.map(([id, label]) =>
    `<button class="quiz-pill ${flashState.scope === id ? 'active' : ''}" onclick="setFlashScope('${id}')">${escapeHtml(label)}</button>`
  ).join('');
  const countPills = [5, 10, 20].map(n =>
    `<button class="quiz-pill ${flashState.count === n ? 'active' : ''}" onclick="setFlashCount(${n})">${n}</button>`
  ).join('');

  // Level pills: only levels the user has unlocked (admin-panel access).
  const allowedLevels = userUnlockedLevelSet();
  const levelOptions = [{ id: 'all', label: t('quizAll') }].concat(
    [1, 2, 3].filter(L => allowedLevels.has(L)).map(L => ({ id: L, label: String(L) }))
  );
  const levelPills = levelOptions.map(it =>
    `<button class="quiz-pill ${flashState.level === it.id ? 'active' : ''}" onclick="setFlashLevel(${typeof it.id === 'string' ? `'${it.id}'` : it.id})">${escapeHtml(it.label)}</button>`
  ).join('');

  // Week pills: only weeks unlocked for the chosen level.
  const selectedWeeks = Array.isArray(flashState.weeks) ? flashState.weeks : [];
  let weekPills;
  if (flashState.level === 'all') {
    weekPills = `<span style="font-size:0.78rem;color:var(--muted);font-style:italic">${t('quizPickLevelFirst')}</span>`;
  } else {
    const allowedWeeks = [...userUnlockedWeeksOfLevel(flashState.level)].sort((a, b) => a - b);
    if (allowedWeeks.length === 0) {
      weekPills = `<span style="font-size:0.78rem;color:var(--muted);font-style:italic">—</span>`;
    } else {
      weekPills =
        `<button class="quiz-pill ${selectedWeeks.length === 0 ? 'active' : ''}" onclick="clearFlashWeeks()">${escapeHtml(t('quizAll'))}</button>` +
        allowedWeeks.map(w =>
          `<button class="quiz-pill ${selectedWeeks.includes(w) ? 'active' : ''}" onclick="toggleFlashWeek(${w})">${w}</button>`
        ).join('');
    }
  }

  const setupRow = `
    <div class="quiz-options" style="margin-bottom:20px">
      <div class="quiz-option-group">
        <span class="quiz-option-label">${t('quizScope')}</span>
        <div class="quiz-pills">${scopePills}</div>
      </div>
      <div class="quiz-option-group">
        <span class="quiz-option-label">${t('quizLevel')}</span>
        <div class="quiz-pills">${levelPills}</div>
      </div>
      <div class="quiz-option-group">
        <span class="quiz-option-label">${t('quizWeek')}</span>
        <div class="quiz-pills">${weekPills}</div>
      </div>
      <div class="quiz-option-group">
        <span class="quiz-option-label">${t('flashCount')}</span>
        <div class="quiz-pills">${countPills}</div>
      </div>
    </div>`;

  let cardArea;
  if (deck.length === 0) {
    cardArea = `<div class="practice-start" style="text-align:left"><p style="color:var(--mid)">${escapeHtml(t('flashEmpty'))}</p></div>`;
  } else {
    const f = flashcardFaces(deck[idx]);
    const hint = flashState.flipped ? t('flashShowFront') : t('flashTapReveal');
    cardArea = `
      <div class="flashcard-wrap">
        <div class="flashcard ${flashState.flipped ? 'flipped' : ''}" id="flashcard" onclick="flipFlashcard()">
          <div class="flashcard-face flashcard-front ${f.frontArabic ? 'flash-arabic' : ''}">${escapeHtml(f.front || '—')}</div>
          <div class="flashcard-face flashcard-back ${f.backArabic ? 'flash-arabic' : ''}">${escapeHtml(f.back || '—')}</div>
        </div>
        <div class="flashcard-hint">${escapeHtml(hint)}</div>
        <div class="flashcard-controls">
          <button class="btn-secondary" onclick="prevFlashcard()" ${idx === 0 ? 'disabled' : ''}>${t('flashPrev')}</button>
          <button class="btn-primary" onclick="flipFlashcard()">${t('flashFlip')}</button>
          <button class="btn-secondary" onclick="nextFlashcard()" ${idx >= deck.length - 1 ? 'disabled' : ''}>${t('flashNext')}</button>
          <button class="btn-secondary" onclick="shuffleFlashcards()">${t('flashShuffle')}</button>
        </div>
      </div>`;
  }

  main.innerHTML = `
    <div class="topic-header">
      <h2>${ref.title[lang]}</h2>
      <p>${deck.length ? t('flashProgress')(idx + 1, deck.length) : ref.desc[lang]}</p>
    </div>
    <div class="section">
      ${setupRow}
      ${cardArea}
    </div>`;
}

function rebuildFlashDeck() {
  flashState.deck = buildFlashDeck(flashState.scope, flashState.count, flashState.level, flashState.weeks);
  flashState.idx = 0; flashState.flipped = false;
  renderFlashcards(currentView.ref);
}

function setFlashScope(scope) {
  if (!flashState) return;
  flashState.scope = scope;
  rebuildFlashDeck();
}

function setFlashCount(n) {
  if (!flashState) return;
  flashState.count = n;
  rebuildFlashDeck();
}

function setFlashLevel(level) {
  if (!flashState) return;
  flashState.level = level;
  flashState.weeks = [];   // reset week scope when the level changes
  rebuildFlashDeck();
}

function toggleFlashWeek(w) {
  if (!flashState) return;
  const arr = Array.isArray(flashState.weeks) ? flashState.weeks.slice() : [];
  const i = arr.indexOf(w);
  if (i >= 0) arr.splice(i, 1); else arr.push(w);
  flashState.weeks = arr.sort((a, b) => a - b);
  rebuildFlashDeck();
}

function clearFlashWeeks() {
  if (!flashState) return;
  flashState.weeks = [];
  rebuildFlashDeck();
}

function flipFlashcard() {
  if (!flashState) return;
  flashState.flipped = !flashState.flipped;
  const el = document.getElementById('flashcard');
  if (el) el.classList.toggle('flipped', flashState.flipped);
  const hintEl = document.querySelector('.flashcard-hint');
  if (hintEl) hintEl.textContent = flashState.flipped ? t('flashShowFront') : t('flashTapReveal');
}

function nextFlashcard() {
  if (!flashState || flashState.idx >= flashState.deck.length - 1) return;
  flashState.idx++; flashState.flipped = false;
  renderFlashcards(currentView.ref);
}

function prevFlashcard() {
  if (!flashState || flashState.idx === 0) return;
  flashState.idx--; flashState.flipped = false;
  renderFlashcards(currentView.ref);
}

function shuffleFlashcards() {
  if (!flashState) return;
  // Draw a fresh random sample from the current source/level/week selection.
  rebuildFlashDeck();
}

// ─── Learn Deep ───────────────────────────────────────────────────────────────

let lessonsIndexCache = null;
let ldState = { level: '', week: '', conceptIdx: '' };
let ldLastResult = null;

async function loadLessonsIndex() {
  if (lessonsIndexCache) return lessonsIndexCache;
  const res = await fetch('/lessons_index.json');
  if (!res.ok) throw new Error('lessons_index.json not available');
  lessonsIndexCache = await res.json();
  return lessonsIndexCache;
}

function renderLearnDeep(ref) {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="topic-header">
      <h2>${ref.title[lang]}</h2>
      <p>${ref.desc[lang]}</p>
    </div>
    <div class="section">
      <div class="ld-picker">
        <div class="ld-picker-field">
          <label>${t('ldLevel')}</label>
          <select id="ld-level" onchange="onLdLevelChange()">
            <option value="">—</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>
        <div class="ld-picker-field" style="flex: 2;">
          <label>${t('ldLesson')}</label>
          <select id="ld-week" onchange="onLdWeekChange()" disabled><option value="">—</option></select>
        </div>
        <div class="ld-picker-field" style="flex: 2;">
          <label>${t('ldConcept')}</label>
          <select id="ld-concept" onchange="onLdConceptChange()" disabled><option value="">—</option></select>
        </div>
        <div class="ld-picker-field" style="flex: 0; min-width: 110px;">
          <label>&nbsp;</label>
          <button class="btn-primary" id="ld-go" onclick="exploreConcept()" disabled style="padding:9px 18px;">${t('ldExplore')}</button>
        </div>
      </div>
      <div id="ld-result-container">
        ${ldLastResult ? renderLdResult(ldLastResult) : `<div class="ld-empty">${t('ldPickFirst')}</div>`}
      </div>
    </div>`;

  // Re-apply previous selections if returning to this view
  loadLessonsIndex().then(() => {
    if (ldState.level) {
      document.getElementById('ld-level').value = ldState.level;
      onLdLevelChange();
      if (ldState.week) {
        document.getElementById('ld-week').value = ldState.week;
        onLdWeekChange();
        if (ldState.conceptIdx !== '') {
          document.getElementById('ld-concept').value = ldState.conceptIdx;
          onLdConceptChange();
        }
      }
    }
  }).catch(err => {
    document.getElementById('ld-result-container').innerHTML =
      `<div class="feedback-box error">Failed to load lessons index: ${escapeHtml(err.message)}</div>`;
  });
}

function onLdLevelChange() {
  const lvl = document.getElementById('ld-level').value;
  ldState.level = lvl;
  ldState.week = '';
  ldState.conceptIdx = '';
  const weekSel = document.getElementById('ld-week');
  const conceptSel = document.getElementById('ld-concept');
  conceptSel.disabled = true;
  conceptSel.innerHTML = '<option value="">—</option>';
  document.getElementById('ld-go').disabled = true;
  if (!lvl || !lessonsIndexCache) {
    weekSel.disabled = true;
    weekSel.innerHTML = '<option value="">—</option>';
    return;
  }
  const opts = ['<option value="">—</option>'];
  for (const [key, lesson] of Object.entries(lessonsIndexCache)) {
    if (String(lesson.level) === String(lvl)) {
      const title = lesson.verified_title?.[lang] || lesson.verified_title?.en || key;
      opts.push(`<option value="${lesson.week}">W${lesson.week} — ${escapeHtml(title)}</option>`);
    }
  }
  weekSel.innerHTML = opts.join('');
  weekSel.disabled = false;
}

function onLdWeekChange() {
  const lvl = ldState.level;
  const week = document.getElementById('ld-week').value;
  ldState.week = week;
  ldState.conceptIdx = '';
  const conceptSel = document.getElementById('ld-concept');
  document.getElementById('ld-go').disabled = true;
  if (!week || !lessonsIndexCache) {
    conceptSel.disabled = true;
    conceptSel.innerHTML = '<option value="">—</option>';
    return;
  }
  const lesson = lessonsIndexCache[`L${lvl}W${week}`];
  if (!lesson) {
    conceptSel.disabled = true;
    return;
  }
  const opts = ['<option value="">—</option>'];
  (lesson.concepts || []).forEach((c, i) => {
    const name = c.name?.[lang] || c.name?.en || `Concept ${i + 1}`;
    opts.push(`<option value="${i}">${escapeHtml(name)}</option>`);
  });
  conceptSel.innerHTML = opts.join('');
  conceptSel.disabled = false;
}

function onLdConceptChange() {
  ldState.conceptIdx = document.getElementById('ld-concept').value;
  document.getElementById('ld-go').disabled = ldState.conceptIdx === '';
}

async function exploreConcept() {
  const { level, week, conceptIdx } = ldState;
  if (level === '' || week === '' || conceptIdx === '') return;

  const btn = document.getElementById('ld-go');
  const container = document.getElementById('ld-result-container');
  btn.disabled = true;
  const origLabel = btn.textContent;
  btn.textContent = t('ldLoading');
  container.innerHTML = `<div class="ld-empty">${t('ldLoading')} <span class="spinner"></span></div>`;

  try {
    const res = await fetch('/api/learn-deep', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        level: parseInt(level),
        week: parseInt(week),
        concept_index: parseInt(conceptIdx),
        language: lang,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    ldLastResult = data;
    container.innerHTML = renderLdResult(data);
  } catch (err) {
    container.innerHTML = `<div class="feedback-box error" style="white-space:pre-wrap">${linkify(escapeHtml(err.message))}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = origLabel;
  }
}

function renderLdResult(data) {
  const pdfLink = data.pdf_path
    ? `<a href="/pdfs/${encodeURI(data.pdf_path)}" target="_blank" rel="noopener">📄 ${t('ldOpenLessonPdf')}</a>`
    : '';
  const lessonTag = data.lesson_id
    ? `<div class="ld-lesson-tag">${escapeHtml(data.lesson_id)} — ${escapeHtml(data.lesson_title || '')} ${pdfLink ? '· ' + pdfLink : ''}</div>`
    : '';

  const rules = (data.rules || []).map(r => `<li>${escapeHtml(r)}</li>`).join('');
  const examples = (data.examples || []).map(ex => `
    <div class="ld-example">
      <div class="ld-example-arabic" dir="rtl">${escapeHtml(ex.arabic || '')}</div>
      <div class="ld-example-trans">${t('ldTranslation')}: ${escapeHtml(ex.translation || '')}</div>
      <div class="ld-example-walk"><strong>${t('ldWalkthrough')}:</strong> ${escapeHtml(ex.walkthrough || '')}</div>
    </div>`).join('');
  const mistakes = (data.common_mistakes || []).map(m => `<li>${escapeHtml(m)}</li>`).join('');

  return `
    <div class="ld-result">
      <div class="ld-title-row">
        <h2>${escapeHtml(data.title || '')}</h2>
        ${data.arabic_name ? `<span class="ld-arabic">${escapeHtml(data.arabic_name)}</span>` : ''}
      </div>
      ${lessonTag}
      ${data.overview ? `<div class="ld-section"><h3>${t('ldOverview')}</h3><div class="ld-overview">${escapeHtml(data.overview)}</div></div>` : ''}
      ${rules ? `<div class="ld-section"><h3>${t('ldRules')}</h3><ul class="ld-rules">${rules}</ul></div>` : ''}
      ${examples ? `<div class="ld-section"><h3>${t('ldExamples')}</h3>${examples}</div>` : ''}
      ${mistakes ? `<div class="ld-section"><h3>${t('ldCommonMistakes')}</h3><ul class="ld-mistakes">${mistakes}</ul></div>` : ''}

}

let cmgrState = { level: 1, week: 1 };

async function renderContentManager(ref) {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="topic-header">
      <h2>${ref.title[lang]}</h2>
      <p>${ref.desc[lang]}</p>

function _allLevelsForPicker() {
  return [
    { level_num: 1, name: 'Level 1', week_count: 14, built_in: true },
    { level_num: 2, name: 'Level 2', week_count: 14, built_in: true },
    { level_num: 3, name: 'Level 3', week_count: 14, built_in: true },
  ].concat(EXTRA_LEVELS || []);
}

function renderCmgrLevelTabs() {
  return _allLevelsForPicker().map(l => {
    const active = cmgrState.level === l.level_num;
    const icon = l.built_in ? ['', '🟢', '🔵', '🟣'][l.level_num] : '🎓';
    const label = l.built_in
      ? `L${l.level_num}`
      : `L${l.level_num} — ${escapeHtml(l.name)}`;
    return `<button class="cmgr-tab ${active ? 'active' : ''}" onclick="cmgrSetLevel(${l.level_num})">
      <span class="cmgr-tab-icon">${icon}</span>
      <span class="cmgr-tab-label">${label}</span>
    </button>`;
  }).join('');
}

function renderCmgrWeekPills() {
  const lvl = _allLevelsForPicker().find(l => l.level_num === cmgrState.level);
  const wc = lvl ? lvl.week_count : 14;
  return Array.from({ length: wc }, (_, i) => i + 1).map(w => {
    const active = cmgrState.week === w;
    return `<button class="cmgr-week-pill ${active ? 'active' : ''}" onclick="cmgrSetWeek(${w})">${t('cmgrWeekShort') || 'W'}${w}</button>`;
  }).join('');
}

function cmgrSetLevel(v) {
  cmgrState.level = parseInt(v);
  cmgrState.week = 1;
  const lvlEl = document.getElementById('cmgr-level-tabs');
  const wkEl = document.getElementById('cmgr-week-pills');
  if (lvlEl) lvlEl.innerHTML = renderCmgrLevelTabs();
  if (wkEl) wkEl.innerHTML = renderCmgrWeekPills();
  cmgrReloadList();
  cmgrRefreshUploadHidden();
}

function cmgrSetWeek(v) {
  cmgrState.week = parseInt(v);
  const wkEl = document.getElementById('cmgr-week-pills');
  if (wkEl) wkEl.innerHTML = renderCmgrWeekPills();
  cmgrReloadList();
  cmgrRefreshUploadHidden();
}
function cmgrRefreshUploadHidden() {
  const lv = document.querySelector('#cmgr-upload-form input[name="level"]');
  const wk = document.querySelector('#cmgr-upload-form input[name="week"]');
  if (lv) lv.value = cmgrState.level;
  if (wk) wk.value = cmgrState.week;
}

let _cmgrPollTimer = null;
async function cmgrReloadList(targetEl) {
  const el = targetEl || document.getElementById('cmgr-list');
  if (!el) return;
  try {
    const res = await fetch(`/api/resources?level=${cmgrState.level}&week=${cmgrState.week}`, { credentials: 'same-origin' });
    const data = await res.json();
    const builtinHtml = renderBuiltInSection(cmgrState.level, cmgrState.week);
    const adminHtml = renderResourceListHTML(data.resources || [], /*adminMode*/ true);
    el.innerHTML = `
      ${builtinHtml}
      <div class="cmgr-section-head">${t('cmgrAdminUploaded') || '➕ Admin-uploaded resources'}</div>
      ${adminHtml}`;
    // Auto-poll while any resource is still extracting
    const stillPending = (data.resources || []).some(r => r.extraction_status === 'pending');
    if (_cmgrPollTimer) { clearTimeout(_cmgrPollTimer); _cmgrPollTimer = null; }
    if (stillPending && currentView && currentView.ref && currentView.ref.contentMgr) {
      _cmgrPollTimer = setTimeout(() => cmgrReloadList(), 5000);
    }
  } catch (e) {
    el.innerHTML = `<div class="feedback-box error">${escapeHtml(e.message)}</div>`;
  }
}

// Renders the read-only "what's already in the curriculum" panel for L/W
// as a single tidy card with row entries (cleaner than separate cards).
function renderBuiltInSection(level, week) {
  if (level > 3) {
    return `<div class="cmgr-section-head">${t('cmgrBuiltIn') || '📚 Built-in curriculum'}</div>
            <div class="cmgr-empty">${t('cmgrNoBuiltIn') || 'This is a custom level — no built-in curriculum. Use the form below to add resources.'}</div>`;
  }
  const lvl = LEVELS[level - 1];
  if (!lvl) return '';
  const lesson = lvl.lessons.find(l => l.week === week);
  if (!lesson) return '';

  const rows = [];

  if (lesson.pdf) {
    const url = '/pdfs/' + lesson.pdf.split('/').map(encodeURIComponent).join('/');
    rows.push(`
      <div class="cmgr-bi-row">
        <span class="cmgr-bi-icon">📄</span>
        <div class="cmgr-bi-text">
          <div class="cmgr-bi-label">${t('cmgrLessonPdf') || 'Lesson PDF'}</div>
          <div class="cmgr-bi-meta">${escapeHtml(lesson.pdf.split('/').pop())}</div>
        </div>
        <a class="cmgr-bi-action" href="${url}" target="_blank" rel="noopener">${t('openPDF') || 'Open'}</a>
      </div>`);
  }

  const hasLecture = !!(lesson.lecture || (LECTURES_BUNDLE && LECTURES_BUNDLE[`L${level}W${week}`]));
  if (hasLecture) {
    rows.push(`
      <div class="cmgr-bi-row">
        <span class="cmgr-bi-icon">📖</span>
        <div class="cmgr-bi-text">
          <div class="cmgr-bi-label">${t('lecture') || 'Lecture'}</div>
          <div class="cmgr-bi-meta">${t('cmgrLectureExists') || 'Multilingual lecture (EN/TR/AR)'}</div>
        </div>
      </div>`);
  }

  const qcount = (lesson.questions || []).length;
  if (qcount) {
    rows.push(`
      <div class="cmgr-bi-row">
        <span class="cmgr-bi-icon">🎯</span>
        <div class="cmgr-bi-text">
          <div class="cmgr-bi-label">${t('practice') || 'Practice'}</div>
          <div class="cmgr-bi-meta">${qcount} ${t('cmgrQuestions') || 'practice questions'}</div>
        </div>
      </div>`);
  }

  if (!rows.length) {
    return `<div class="cmgr-section-head">${t('cmgrBuiltIn') || '📚 Built-in curriculum'}</div>
            <div class="cmgr-empty">${t('cmgrNoBuiltIn') || 'No built-in content for this lesson.'}</div>`;
  }

  return `
    <div class="cmgr-section-head">${t('cmgrBuiltIn') || '📚 Built-in curriculum'}</div>
    <div class="cmgr-builtin-card">
      <div class="cmgr-builtin-head">
        <span>${escapeHtml(lesson.title[lang] || lesson.title.en)}</span>
        <span class="cmgr-readonly">${t('cmgrReadOnly') || 'read-only'}</span>
      </div>
      ${rows.join('')}
    </div>`;
}

let cmgrCurrentKind = 'pdf';
function cmgrSubmitLabel() {
  // For file kinds that get AI-extracted, label the action as "Run by AI"
  if (cmgrCurrentKind === 'pdf' || cmgrCurrentKind === 'image') {
    return t('cmgrRunByAI') || '🤖 Run this by AI';
  }
  // Audio is stored but not AI-extracted (no vision model for audio yet)
  if (cmgrCurrentKind === 'audio') return t('cmgrAddAudio') || '+ Upload audio';
  return t('cmgrAddBasic') || '+ Add resource';
}
function cmgrSwitchKind(k) {
  cmgrCurrentKind = k;
  document.querySelectorAll('.cmgr-kind').forEach(b => b.classList.toggle('active', b.dataset.kind === k));
  document.getElementById('cmgr-row-file').style.display = (k === 'pdf' || k === 'image' || k === 'audio') ? '' : 'none';
  document.getElementById('cmgr-row-model').style.display = (k === 'pdf' || k === 'image') ? '' : 'none';
  document.getElementById('cmgr-row-url').style.display  = (k === 'link') ? '' : 'none';
  document.getElementById('cmgr-row-body').style.display = (k === 'note') ? '' : 'none';
  const fi = document.getElementById('cmgr-file');
  fi.accept = k === 'pdf' ? 'application/pdf' : k === 'image' ? 'image/*' : k === 'audio' ? 'audio/*' : '';
  cmgrClearFile();
  // Update the submit button label
  const btn = document.getElementById('cmgr-submit-btn');
  if (btn) btn.textContent = cmgrSubmitLabel();
}

function cmgrOnFileSelected(input) {
  const f = input.files && input.files[0];
  const info = document.getElementById('cmgr-file-info');
  const nameSpan = document.getElementById('cmgr-file-info-name');
  if (!f) { info.style.display = 'none'; return; }
  // Show filename + size
  const kb = Math.round(f.size / 1024);
  nameSpan.textContent = `${f.name} (${kb} KB)`;
  info.style.display = 'inline-flex';
  document.getElementById('cmgr-file-label').style.display = 'none';
  // Auto-fill the title with the filename (sans extension) if title is empty
  const titleField = document.getElementById('cmgr-title');
  if (!titleField.value.trim()) {
    titleField.value = f.name.replace(/\.[^.]+$/, '');
  }
}

function cmgrClearFile() {
  const fi = document.getElementById('cmgr-file');
  if (fi) fi.value = '';
  const info = document.getElementById('cmgr-file-info');
  if (info) info.style.display = 'none';
  const label = document.getElementById('cmgr-file-label');
  if (label) label.style.display = '';
}

function kindEmoji(k) { return {pdf:'📄', image:'🖼️', audio:'🔊', link:'🔗', note:'📝'}[k] || '•'; }
function kindLabel(k) {
  const labels = (lang === 'tr')
    ? {pdf:'PDF', image:'Görsel', audio:'Ses', link:'Bağlantı', note:'Not'}
    : (lang === 'ar')
    ? {pdf:'PDF', image:'صورة', audio:'صوت', link:'رابط', note:'ملاحظة'}
    : {pdf:'PDF', image:'Image', audio:'Audio', link:'Link', note:'Note'};
  return labels[k] || k;
}

async function cmgrSubmitUpload() {
  const status = document.getElementById('cmgr-status');
  const title = document.getElementById('cmgr-title').value.trim();
  if (!title) { status.textContent = t('cmgrErrTitle') || 'Title required'; return; }
  status.textContent = t('cmgrSaving') || 'Saving…';

  let res;
  try {
    if (cmgrCurrentKind === 'pdf' || cmgrCurrentKind === 'image' || cmgrCurrentKind === 'audio') {
      const file = document.getElementById('cmgr-file').files[0];
      if (!file) { status.textContent = t('cmgrErrFile') || 'File required'; return; }
      const fd = new FormData();
      fd.append('level', cmgrState.level);
      fd.append('week', cmgrState.week);
      fd.append('title', title);
      fd.append('kind', cmgrCurrentKind);
      fd.append('file', file);
      if (cmgrCurrentKind === 'pdf' || cmgrCurrentKind === 'image') {
        fd.append('model', document.getElementById('cmgr-model')?.value || 'gemini');
      }
      res = await fetch('/api/admin/resources', { method: 'POST', credentials: 'same-origin', body: fd });
    } else {
      const body = { level: cmgrState.level, week: cmgrState.week, title, kind: cmgrCurrentKind };
      if (cmgrCurrentKind === 'link') body.url = document.getElementById('cmgr-url').value.trim();
      else body.body = document.getElementById('cmgr-body').value.trim();
      res = await fetch('/api/admin/resources', {
        method: 'POST', credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    // Reset form + reload
    document.getElementById('cmgr-title').value = '';
    cmgrClearFile();
    if (document.getElementById('cmgr-url')) document.getElementById('cmgr-url').value = '';
    if (document.getElementById('cmgr-body')) document.getElementById('cmgr-body').value = '';
    // Different message for file uploads (AI will process) vs link/note (instant)
    if (cmgrCurrentKind === 'pdf' || cmgrCurrentKind === 'image') {
      status.innerHTML = `<span style="color:#78350f;background:#fef3c7;padding:4px 10px;border-radius:10px;font-weight:600;">⏳ ${t('cmgrSavedAIReading') || 'Saved — AI is reading the file in the background…'}</span>`;
    } else if (cmgrCurrentKind === 'audio') {
      status.innerHTML = `<span style="color:#14532d;background:#dcfce7;padding:4px 10px;border-radius:10px;font-weight:600;">✓ ${t('cmgrSaved') || 'Saved'}</span>`;
    } else {
      status.innerHTML = `<span style="color:#14532d;background:#dcfce7;padding:4px 10px;border-radius:10px;font-weight:600;">✓ ${t('cmgrSaved') || 'Saved'}</span>`;
    }
    setTimeout(() => { status.innerHTML = ''; }, 6000);
    await cmgrReloadList();
  } catch (e) {
    status.textContent = '✗ ' + e.message;
  }
}

async function cmgrReextract(rid) {
  const model = document.getElementById('cmgr-model')?.value || 'gemini';
  const res = await fetch(`/api/admin/resources/${rid}/reextract`, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model }),
  });
  if (res.ok) cmgrReloadList();
  else alert((t('admErrFailed') || 'Failed:') + ' ' + res.status);
}

async function cmgrDelete(rid) {
  if (!confirm(t('cmgrConfirmDelete') || 'Delete this resource?')) return;
  const res = await fetch(`/api/admin/resources/${rid}`, { method: 'DELETE', credentials: 'same-origin' });
  if (res.ok) cmgrReloadList();
}

async function cmgrRename(rid, currentTitle) {
  const newTitle = prompt(t('cmgrPromptRename') || 'New title:', currentTitle);
  if (!newTitle || newTitle.trim() === currentTitle) return;
  const res = await fetch(`/api/admin/resources/${rid}`, {
    method: 'PATCH', credentials: 'same-origin',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ title: newTitle.trim() }),
  });
  if (res.ok) cmgrReloadList();
}

function renderResourceListHTML(resources, adminMode) {
  if (!resources.length) {
    return `<div class="cmgr-empty">${t('cmgrEmpty') || 'No additional resources for this lesson yet.'}</div>`;
  }
  // Folder-style file list: vertical entries with icon + title + status + actions
  return `<div class="cmgr-folder">${resources.map(r => renderResourceRow(r, adminMode)).join('')}</div>`;
}

function _statusBadge(status) {
  if (status === 'done')    return `<span class="cmgr-st done" title="${t('cmgrStatusDoneTooltip') || 'AI read this file — used as Deep Learn context'}">${t('cmgrStatusDone') || '✓ AI read'}</span>`;
  if (status === 'pending') return `<span class="cmgr-st pending" title="${t('cmgrStatusPendingTooltip') || 'AI is reading this file…'}">${t('cmgrStatusPending') || '⏳ Processing…'}</span>`;
  if (status === 'failed')  return `<span class="cmgr-st failed" title="${t('cmgrStatusFailedTooltip') || 'AI could not read this file'}">${t('cmgrStatusFailed') || '✗ Extraction failed'}</span>`;
  return ''; // skip / link / note — no badge
}

function renderResourceRow(r, adminMode) {
  const isFile = r.kind === 'pdf' || r.kind === 'image' || r.kind === 'audio';
  const url = isFile ? `/uploads/${r.file_path}` : (r.kind === 'link' ? r.url : null);
  const size = r.size ? ` · ${Math.round(r.size / 1024)} KB` : '';
  const subline = r.kind === 'note'
    ? escapeHtml((r.body || '').slice(0, 120)) + ((r.body || '').length > 120 ? '…' : '')
    : (isFile ? escapeHtml(r.file_path.split('/').pop()) + size
              : (r.kind === 'link' ? escapeHtml(r.url || '') : ''));

  const statusHtml = adminMode ? _statusBadge(r.extraction_status) : '';
  const openLink = url
    ? `<a class="cmgr-row-open" href="${escapeHtml(url)}" target="_blank" rel="noopener">${t('openPDF') || 'Open'}</a>`
    : '';
  const canReextract = adminMode && (r.kind === 'pdf' || r.kind === 'image');
  const adminBtns = adminMode
    ? `
      ${canReextract ? `<button class="cmgr-icon-btn" title="${t('cmgrReextract') || 'Re-run AI'}" onclick="cmgrReextract(${r.id})">🤖</button>` : ''}
      <button class="cmgr-icon-btn" title="${t('admRename')}" onclick="cmgrRename(${r.id}, '${(r.title || '').replace(/'/g, "&#39;")}')">✏️</button>
      <button class="cmgr-icon-btn" title="${t('admDelete')}" onclick="cmgrDelete(${r.id})">🗑️</button>`
    : '';

  // For note kinds (no URL to open), show body expanded
  const expandedBody = r.kind === 'note' && (r.body || '').length > 0
    ? `<div class="cmgr-row-note">${escapeHtml(r.body).replace(/\n/g, '<br>')}</div>` : '';

  // For images, show small thumbnail
  const thumb = (r.kind === 'image' && url)
    ? `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" class="cmgr-row-thumb"/></a>` : '';

  // For audio, embed inline
  const audio = (r.kind === 'audio' && url)
    ? `<audio controls src="${url}" class="cmgr-row-audio"></audio>` : '';

  return `
    <div class="cmgr-row">
      <span class="cmgr-row-icon">${kindEmoji(r.kind)}</span>
      <div class="cmgr-row-main">
        <div class="cmgr-row-title">${escapeHtml(r.title)}</div>
        <div class="cmgr-row-meta">${subline}</div>
        ${expandedBody}
        ${thumb}
        ${audio}
      </div>
      <div class="cmgr-row-tail">
        ${statusHtml}
        ${openLink}
        ${adminBtns}
      </div>
    </div>`;
}

// Used by renderLesson to inject the Additional Resources block.
async function loadLessonResources(level, week, containerId) {
  try {
    const res = await fetch(`/api/resources?level=${level}&week=${week}`, { credentials: 'same-origin' });
    const data = await res.json();
    const el = document.getElementById(containerId);
    if (!el) return;
    const items = data.resources || [];
    if (!items.length) { el.innerHTML = ''; return; }

    // Split into (a) AI-generated lectures from uploaded files and (b) the
    // plain file list. Lecture panels render in the SAME format as built-in
    // course lectures for visual consistency.
    const lectureItems = items.filter(r => {
      try { return r.lecture_data && JSON.parse(r.lecture_data).sections?.length; }
      catch { return false; }
    });

    let html = '';
    for (const r of lectureItems) {
      try {
        const lec = JSON.parse(r.lecture_data);
        html += `
          <div class="section">
            <div class="section-title">${t('lecture') || 'Lecture'} — ${escapeHtml(r.title)}
              <span style="font-size:0.7rem;color:#1e3a8a;background:#dbeafe;padding:2px 8px;border-radius:10px;margin-left:8px;font-weight:600">${t('lessonAiGenerated') || 'AI generated'}</span>
            </div>
            ${renderLecture(lec)}

    }

        ${renderResourceListHTML(items, /*adminMode*/ false)}
      </div>`;

    el.innerHTML = html;
  } catch {}
}

async function scPopulateSurahDropdown() {
  const sel = document.getElementById('sc-surah');
  if (!sel) return;
  try {
    const chapters = await fetchChapters();
    const opts = ['<option value="">—</option>'];
    for (const c of chapters) {
      const tname = c.translated_name && c.translated_name.name ? ` — ${c.translated_name.name}` : '';
      opts.push(`<option value="${c.id}" data-verses="${c.verses_count}">${c.id}. ${escapeHtml(c.name_simple)}${escapeHtml(tname)}</option>`);
    }
    sel.innerHTML = opts.join('');
    sel.disabled = false;
    if (scState.surah) {
      sel.value = scState.surah;
      onScSurahChange();
      if (scState.ayah) {
        document.getElementById('sc-ayah').value = scState.ayah;
        document.getElementById('sc-load').disabled = false;
        scRefreshStepButtons();
      }
    }
  } catch (e) {
    sel.innerHTML = `<option value="">Failed to load: ${escapeHtml(e.message)}</option>`;
  }
}

function onScSurahChange() {
  const sSel = document.getElementById('sc-surah');
  const aSel = document.getElementById('sc-ayah');
  const loadBtn = document.getElementById('sc-load');
  scState.surah = sSel.value;
  scState.ayah = '';
  scRefreshStepButtons();
  if (!sSel.value) {
    aSel.disabled = true;
    aSel.innerHTML = '<option value="">—</option>';
    loadBtn.disabled = true;
    return;
  }
  const opt = sSel.options[sSel.selectedIndex];
  const versesCount = parseInt(opt.dataset.verses) || 0;
  const opts = ['<option value="">—</option>'];
  for (let i = 1; i <= versesCount; i++) opts.push(`<option value="${i}">${i}</option>`);
  aSel.innerHTML = opts.join('');
  aSel.disabled = false;
  aSel.onchange = () => {
    scState.ayah = aSel.value;
    loadBtn.disabled = !aSel.value;
    scRefreshStepButtons();
  };
}

function scRefreshStepButtons() {
  const prev = document.getElementById('sc-prev');
  const next = document.getElementById('sc-next');
  if (!prev || !next) return;
  const s = parseInt(scState.surah);
  const a = parseInt(scState.ayah);
  const has = !!(s && a);
  let dPrev = !has, dNext = !has;
  if (has) {
    if (s === 1 && a === 1) dPrev = true;
    if (quranChapters && s === quranChapters.length) {
      const last = quranChapters[quranChapters.length - 1];
      if (a >= (last.verses_count || 0)) dNext = true;
    }
  }
  prev.disabled = dPrev;
  next.disabled = dNext;
}

async function scLoadVerse() {
  const sSel = document.getElementById('sc-surah');
  const aSel = document.getElementById('sc-ayah');
  const loadBtn = document.getElementById('sc-load');
  if (!sSel.value || !aSel.value) return;
  loadBtn.disabled = true;
  loadBtn.textContent = t('irabPickLoading');
  try {
    const res = await fetch(`https://api.quran.com/api/v4/verses/by_key/${sSel.value}:${aSel.value}?fields=text_uthmani,text_imlaei`);
    const data = await res.json();
    const verseText = (data.verse && (data.verse.text_uthmani || data.verse.text_imlaei)) || '';
    if (!verseText) throw new Error('No verse text returned');
    document.getElementById('sc-input').value = verseText;
    document.getElementById('sc-fill-area').innerHTML = '';
    document.getElementById('sc-result-area').innerHTML = '';
    document.getElementById('sc-go').disabled = true;
    scWords = [];
    scLastResult = null;
  } catch (e) {
    document.getElementById('sc-result-area').innerHTML =
      `<div class="feedback-box error">Failed: ${escapeHtml(e.message)}</div>`;
  } finally {
    loadBtn.disabled = false;
    loadBtn.textContent = t('irabPickLoad');
  }
}

async function scStepVerse(direction) {
  if (!quranChapters) return;
  let s = parseInt(scState.surah);
  let a = parseInt(scState.ayah);
  if (!s || !a) return;
  if (direction > 0) {
    const cur = quranChapters.find(c => c.id === s);
    if (a < cur.verses_count) a += 1;
    else if (s < quranChapters.length) { s += 1; a = 1; }
    else return;
  } else {
    if (a > 1) a -= 1;
    else if (s > 1) { s -= 1; a = quranChapters.find(c => c.id === s).verses_count; }
    else return;
  }
  const sSel = document.getElementById('sc-surah');
  const aSel = document.getElementById('sc-ayah');
  if (parseInt(sSel.value) !== s) {
    sSel.value = String(s);
    onScSurahChange();
  }
  aSel.value = String(a);
  scState.ayah = String(a);
  document.getElementById('sc-load').disabled = false;
  scRefreshStepButtons();
  await scLoadVerse();
}

function scClear() {
  document.getElementById('sc-input').value = '';
  document.getElementById('sc-fill-area').innerHTML = '';
  document.getElementById('sc-result-area').innerHTML = '';

function scSetComplexity(mode) {
  scComplexity = mode;
  localStorage.setItem('sc_complexity', mode);

  if (b) b.classList.toggle('active', mode === 'complex');
}

// Splits the verse on whitespace into "words" — same coarse split the user
// will fill out. Keeps Arabic punctuation attached. Treats the textarea as
// the source of truth so the user can edit the verse before splitting.
function scSplitVerse(verse) {
  // Strip Arabic verse-end markers and stray control chars
  const cleaned = verse.replace(/[​-‏⁠-⁯﻿]/g, '').trim();
  return cleaned.split(/\s+/).filter(w => w.length > 0);
}

function scSelfFill() {
  const verse = document.getElementById('sc-input').value.trim();
  if (!verse) {
    document.getElementById('sc-result-area').innerHTML =
      `<div class="feedback-box error">${t('scNeedVerse')}</div>`;
    return;
  }
  const tokens = scSplitVerse(verse);
  scWords = tokens.map(w => ({ arabic: w, meaning: '', role: '', notes: '' }));
  document.getElementById('sc-result-area').innerHTML = '';
  scLastResult = null;
  scRenderFillCards();
  document.getElementById('sc-go').disabled = false;
}

function scRenderFillCards() {
  const html = `
    <div class="sc-fill-grid">
      ${scWords.map((w, i) => `
        <div class="sc-fill-card">
          <div class="sc-fill-arabic">${escapeHtml(w.arabic)}</div>
          <div class="sc-fill-row">
            <label>${t('scYourMeaning')}</label>
            <input type="text" id="sc-meaning-${i}" value="${escapeHtml(w.meaning)}"
                   oninput="scWords[${i}].meaning = this.value" />
          </div>
          <div class="sc-fill-row">
            <label>${t('scYourRole')}</label>
            <input type="text" id="sc-role-${i}" value="${escapeHtml(w.role)}"
                   oninput="scWords[${i}].role = this.value" />
          </div>
          <div class="sc-fill-row">
            <label>${t('scYourNotes')}</label>
            <textarea id="sc-notes-${i}" rows="2"
                      oninput="scWords[${i}].notes = this.value">${escapeHtml(w.notes)}</textarea>
          </div>
        </div>
      `).join('')}
    </div>`;
  document.getElementById('sc-fill-area').innerHTML = html;
}

async function scAnalyze() {
  const verse = document.getElementById('sc-input').value.trim();
  if (!verse) {
    document.getElementById('sc-result-area').innerHTML =
      `<div class="feedback-box error">${t('scNeedVerse')}</div>`;
    return;
  }
  if (!scWords.length) {
    document.getElementById('sc-result-area').innerHTML =
      `<div class="feedback-box error">${t('scSelfFillFirst')}</div>`;
    return;
  }
  const btn = document.getElementById('sc-go');
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = t('scAnalyzing');
  document.getElementById('sc-result-area').innerHTML =
    `<div class="ld-empty">${t('scAnalyzing')} <span class="spinner"></span></div>`;

  try {
    const res = await fetch('/api/self-check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ verse, language: lang, user_answers: scWords, complexity: scComplexity }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    scLastResult = data;
    // Replace the editable fill cards in-place with the graded result cards
    // and put only the overall feedback in the result-area below.
    document.getElementById('sc-fill-area').innerHTML = renderScWordCards(data);
    document.getElementById('sc-result-area').innerHTML = renderScOverall(data);
  } catch (err) {
    document.getElementById('sc-result-area').innerHTML =
      `<div class="feedback-box error" style="white-space:pre-wrap">${linkify(escapeHtml(err.message))}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

function renderScWordCards(data) {
  const legend = `
    <div class="sc-legend">
      <span>${t('scLegendCorrect')}</span>
      <span>${t('scLegendPartial')}</span>
      <span>${t('scLegendIncorrect')}</span>
      <span>${t('scLegendMissing')}</span>
    </div>`;

  const cards = (data.words || []).map(w => {
    const overallBadge = scOverallBadge(w.scores || {});
    const fields = [
      ['scYourMeaning', 'meaning'],
      ['scYourRole', 'role'],
      ['scYourNotes', 'notes'],
    ].map(([labelKey, field]) => {
      const score = (w.scores || {})[field] || 'missing';
      const userVal = (w.user || {})[field] || '';
      const correctVal = (w.correct || {})[field] || '';
      return `
        <div class="sc-field-row">
          <div class="sc-field-label">${t(labelKey)}<br><span class="sc-badge ${score}">${scBadgeLabel(score)}</span></div>
          <div class="sc-your ${userVal ? '' : 'empty'}">
            <strong>${t('scYour')}:</strong> ${userVal ? escapeHtml(userVal) : '—'}
          </div>
          <div class="sc-correct"><strong>${t('scCorrect')}:</strong> ${escapeHtml(correctVal)}</div>
        </div>`;
    }).join('');

    return `
      <div class="sc-result-card">
        <div class="sc-result-head">
          <span class="sc-arabic" dir="rtl">${escapeHtml(w.arabic || '')}</span>
          ${overallBadge}
        </div>
        ${fields}
        ${w.feedback ? `<div class="sc-feedback">${escapeHtml(w.feedback)}</div>` : ''}
      </div>`;
  }).join('');

  return legend + cards;
}

function renderScOverall(data) {
  return data.overall_feedback
    ? `<div class="sc-overall"><strong>${t('scOverall')}:</strong> ${escapeHtml(data.overall_feedback)}</div>`
    : '';
}

function scBadgeLabel(score) {
  switch (score) {
    case 'correct':   return t('scLegendCorrect');
    case 'partial':   return t('scLegendPartial');
    case 'incorrect': return t('scLegendIncorrect');
    default:          return t('scLegendMissing');
  }
}

function scOverallBadge(scores) {
  const vals = Object.values(scores);
  if (!vals.length) return '';
  if (vals.every(v => v === 'correct')) return `<span class="sc-badge correct">${t('scLegendCorrect')}</span>`;
  if (vals.some(v => v === 'incorrect')) return `<span class="sc-badge incorrect">${t('scLegendIncorrect')}</span>`;
  if (vals.some(v => v === 'partial'))   return `<span class="sc-badge partial">${t('scLegendPartial')}</span>`;
  return `<span class="sc-badge missing">${t('scLegendMissing')}</span>`;
}

  if (!preserveAyah) icmpState.ayah = '';
  icmpRefreshStepButtons();
  if (!sSel.value) {
    aSel.disabled = true; aSel.innerHTML = '<option value="">—</option>'; loadBtn.disabled = true;
    return;
  }
  const versesCount = parseInt(sSel.options[sSel.selectedIndex].dataset.verses) || 0;
  const opts = ['<option value="">—</option>'];
  for (let i = 1; i <= versesCount; i++) opts.push(`<option value="${i}">${i}</option>`);
  aSel.innerHTML = opts.join('');
  aSel.disabled = false;
  aSel.onchange = () => { icmpState.ayah = aSel.value; loadBtn.disabled = !aSel.value; icmpRefreshStepButtons(); };
  if (preserveAyah && icmpState.ayah) {
    aSel.value = icmpState.ayah;
    loadBtn.disabled = !icmpState.ayah;
    icmpRefreshStepButtons();
  }
}

function icmpRefreshStepButtons() {
  const prev = document.getElementById('icmp-prev');
  const next = document.getElementById('icmp-next');
  if (!prev || !next) return;
  const s = parseInt(icmpState.surah), a = parseInt(icmpState.ayah);
  const has = !!(s && a);
  prev.disabled = !has || (s === 1 && a === 1);
  next.disabled = !has || (quranChapters && s === quranChapters.length && a >= (quranChapters[quranChapters.length - 1].verses_count || 0));
}

async function icmpLoadVerse() {
  const sSel = document.getElementById('icmp-surah');
  const aSel = document.getElementById('icmp-ayah');
  const loadBtn = document.getElementById('icmp-load');
  if (!sSel.value || !aSel.value) return;
  loadBtn.disabled = true;
  loadBtn.textContent = t('irabPickLoading');
  try {
    const res = await fetch(`https://api.quran.com/api/v4/verses/by_key/${sSel.value}:${aSel.value}?fields=text_uthmani,text_imlaei`);
    const data = await res.json();
    const verseText = (data.verse && (data.verse.text_uthmani || data.verse.text_imlaei)) || '';
    if (!verseText) throw new Error('No verse text returned');
    document.getElementById('icmp-input').value = verseText;
    icmpState.verse = verseText;
    document.getElementById('icmp-input').focus();
  } catch (e) {
    document.getElementById('icmp-results').innerHTML = `<div class="feedback-box error">Failed: ${escapeHtml(e.message)}</div>`;
  } finally {
    loadBtn.disabled = false;
    loadBtn.textContent = t('irabPickLoad');
  }
}

async function icmpStepVerse(direction) {
  if (!quranChapters) return;
  let s = parseInt(icmpState.surah), a = parseInt(icmpState.ayah);
  if (!s || !a) return;
  if (direction > 0) {
    const cur = quranChapters.find(c => c.id === s);
    if (a < cur.verses_count) a += 1;
    else if (s < quranChapters.length) { s += 1; a = 1; } else return;
  } else {
    if (a > 1) a -= 1;
    else if (s > 1) { s -= 1; a = quranChapters.find(c => c.id === s).verses_count; } else return;
  }
  const sSel = document.getElementById('icmp-surah');
  const aSel = document.getElementById('icmp-ayah');
  if (parseInt(sSel.value) !== s) { sSel.value = String(s); onIcmpSurahChange(); }
  aSel.value = String(a);
  icmpState.ayah = String(a);
  document.getElementById('icmp-load').disabled = false;
  icmpRefreshStepButtons();
  await icmpLoadVerse();
}

function icmpClear() {
  document.getElementById('icmp-input').value = '';
  document.getElementById('icmp-results').innerHTML = '';
  icmpLastResult = null;
  icmpState.verse = '';
}

async function icmpRun() {
  const verse = document.getElementById('icmp-input').value.trim();
  if (!verse) return;
  // Grounded mode is determined by which module the user opened
  const grounded = !!(currentView && currentView.ref && currentView.ref.irabCompareGrounded);
  let models;
  if (grounded) {
    // Curriculum-Limited module is Gemini-only (the only model whose source
    // can be truly restricted, via the context cache).
    models = ['gemini'];
  } else {
    models = [];
    if (document.getElementById('icmp-model-gemini').checked) models.push('gemini');
    if (document.getElementById('icmp-model-claude').checked) models.push('claude');
    if (document.getElementById('icmp-model-openai').checked) models.push('openai');
    if (!models.length) { alert(t('icmpPickAtLeastOne') || 'Pick at least one model'); return; }
  }
  icmpState.models = models;
  // Grounded module: user-selected Gemini model (defaults to Flash-Lite).
  let geminiModel = '';
  if (grounded) {
    const mSel = document.getElementById('icmp-gemini-model');
    geminiModel = (mSel && mSel.value) || 'gemini-2.5-flash-lite';
    icmpState.geminiModel = geminiModel;
  }
  const btn = document.getElementById('icmp-go');
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = t('icmpRunning') || 'Running…';
  const results = document.getElementById('icmp-results');
  results.innerHTML = `<div class="ld-empty">${t('icmpRunning') || 'Running…'} <span class="spinner"></span></div>`;
  try {
    const res = await fetch('/api/irab-compare', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ verse, language: lang, models, grounded, gemini_model: geminiModel }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    icmpLastResult = data;
    results.innerHTML = renderIcmpResults(data);
  } catch (err) {
    results.innerHTML = `<div class="feedback-box error" style="white-space:pre-wrap">${linkify(escapeHtml(err.message))}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

function renderIcmpResults(data) {
  const r = data.results || {};
  const cols = Object.keys(r);
  if (!cols.length) return `<div class="feedback-box error">${t('icmpNoResults') || 'No results.'}</div>`;

  // Single model (Curriculum-Limited module) → render exactly like the Ayah
  // I'rab page: translation banner + word cards flowing left-to-right.
  if (cols.length === 1) {
    const result = r[cols[0]];
    if (result.error) {
      return `<div class="feedback-box error" style="white-space:pre-wrap">${escapeHtml(result.error)}</div>`;
    }
    return `
      <div class="icmp-single-head">${escapeHtml(result.model_label || cols[0])}</div>
      ${renderIrabResult(result)}`;
  }

  // Multiple models → side-by-side columns
  return `
    <div class="icmp-grid" style="grid-template-columns: repeat(${cols.length}, minmax(0, 1fr));">
      ${cols.map(name => renderIcmpColumn(name, r[name])).join('')}
    </div>`;
}

function renderIcmpColumn(name, result) {
  const header = result.model_label || name;
  if (result.error) {
    return `
      <div class="icmp-col">
        <div class="icmp-col-head">${escapeHtml(header)}</div>
        <div class="feedback-box error" style="margin:10px">${escapeHtml(result.error)}</div>
      </div>`;
  }
  const words = result.words || [];
  const wordsHtml = words.map(w => {
    const rows = [];
    if (w.transliteration) rows.push(`<dt>${t('irabTranslit') || 'Transliteration'}</dt><dd>${escapeHtml(w.transliteration)}</dd>`);
    if (w.meaning) rows.push(`<dt>${t('irabMeaning') || 'Meaning'}</dt><dd>${escapeHtml(w.meaning)}</dd>`);
    if (w.type) rows.push(`<dt>${t('irabType') || 'Type'}</dt><dd>${escapeHtml(w.type)}</dd>`);
    if (w.root) rows.push(`<dt>${t('irabRoot') || 'Root'}</dt><dd>${escapeHtml(w.root)}</dd>`);
    if (w.form) rows.push(`<dt>${t('irabForm') || 'Form'}</dt><dd>${escapeHtml(w.form)}</dd>`);
    if (w.case_mood) rows.push(`<dt>${t('irabCase') || 'Case/Mood'}</dt><dd>${escapeHtml(w.case_mood)}</dd>`);
    if (w.role) rows.push(`<dt>${t('irabRole') || 'Role'}</dt><dd>${escapeHtml(w.role)}</dd>`);
    const notes = w.notes ? `<div class="irab-word-notes"><strong>${t('irabNotes') || 'Notes'}:</strong> ${escapeHtml(w.notes)}</div>` : '';
    return `
      <div class="irab-word" style="margin-bottom:10px;">
        <div class="irab-word-ar">${escapeHtml(w.word || w.ar || '')}</div>
        <dl class="irab-word-grammar">${rows.join('')}</dl>
        ${notes}
      </div>`;
  }).join('');
  return `
    <div class="icmp-col">
      <div class="icmp-col-head">${escapeHtml(header)}</div>
      ${result.translation ? `<div class="irab-translation"><strong>${t('irabTranslation') || 'Translation'}:</strong> ${escapeHtml(result.translation)}</div>` : ''}
      <div class="irab-words" style="display:block;">${wordsHtml}</div>
    </div>`;
}


// ─── Verse Analysis (I'rab) ───────────────────────────────────────────────────

let lastIrabResult = null;
let quranChapters = null; // cached array of {id, name_simple, name_arabic, translated_name, verses_count}
let pickerState = { surah: '', ayah: '' };

async function fetchChapters() {
  const apiLang = lang === 'tr' ? 'tr' : (lang === 'ar' ? 'ar' : 'en');
  const cacheKey = `quran_chapters_v1_${apiLang}`;
  if (quranChapters && quranChapters.__lang === apiLang) return quranChapters;
  const cached = localStorage.getItem(cacheKey);
  if (cached) {
    try {
      quranChapters = JSON.parse(cached);
      quranChapters.__lang = apiLang;
      return quranChapters;
    } catch (e) {}
  }
  const res = await fetch(`https://api.quran.com/api/v4/chapters?language=${apiLang}`);
  const data = await res.json();
  quranChapters = data.chapters || [];
  quranChapters.__lang = apiLang;
  localStorage.setItem(cacheKey, JSON.stringify(quranChapters));
  return quranChapters;
}

function renderIrab(ref) {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="topic-header">
      <h2>${ref.title[lang]}</h2>
      <p>${ref.desc[lang]}</p>
    </div>
    <div class="section">
      <div class="irab-picker">
        <div class="irab-picker-field">
          <label>${t('irabPickSurah')}</label>
          <select id="picker-surah" onchange="onSurahChange()" disabled>
            <option value="">${t('irabPickLoading')}</option>
          </select>
        </div>
        <div class="irab-picker-field" style="max-width: 130px">
          <label>${t('irabPickAyah')}</label>
          <select id="picker-ayah" disabled><option value="">—</option></select>
        </div>
        <div class="irab-picker-field" style="flex: 0; min-width: 130px">
          <label>&nbsp;</label>
          <button class="btn-primary" id="picker-load" onclick="loadVerse()" disabled style="padding:9px 18px">${t('irabPickLoad')}</button>
        </div>
        <div class="irab-picker-field" style="flex: 0; min-width: 100px">
          <label>&nbsp;</label>
          <div style="display:flex; gap:6px;">
            <button class="btn-secondary" id="picker-prev" onclick="stepVerse(-1)" disabled
                    title="${t('irabPickPrev')}" style="padding:9px 12px; font-weight:700;">◀</button>
            <button class="btn-secondary" id="picker-next" onclick="stepVerse(1)" disabled
                    title="${t('irabPickNext')}" style="padding:9px 12px; font-weight:700;">▶</button>
          </div>
        </div>
      </div>
      <div class="irab-input">
        <div style="font-size:0.78rem; color:var(--muted); margin-bottom:6px;">${t('irabOrPaste')}</div>
        <textarea class="irab-textarea" id="irab-input"
          placeholder="${escapeHtml(t('irabPlaceholder'))}"></textarea>
        <div class="irab-actions">
          <button class="btn-secondary" onclick="document.getElementById('irab-input').value=''; document.getElementById('irab-results').innerHTML=''; lastIrabResult=null">${t('irabClear')}</button>
          <span class="spacer"></span>
          <button class="btn-primary" id="irab-go" onclick="analyzeVerse()">${t('irabAnalyze')}</button>
        </div>
      </div>
      <div class="irab-results" id="irab-results">${lastIrabResult ? renderIrabResult(lastIrabResult) : ''}</div>
    </div>`;

  document.getElementById('irab-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) analyzeVerse();
  });

  populateSurahDropdown();
}

async function populateSurahDropdown() {
  const sel = document.getElementById('picker-surah');
  if (!sel) return;
  try {
    const chapters = await fetchChapters();
    const opts = ['<option value="">—</option>'];
    for (const c of chapters) {
      const tname = c.translated_name && c.translated_name.name ? ` — ${c.translated_name.name}` : '';
      opts.push(`<option value="${c.id}" data-verses="${c.verses_count}">${c.id}. ${escapeHtml(c.name_simple)}${escapeHtml(tname)}</option>`);
    }
    sel.innerHTML = opts.join('');
    sel.disabled = false;
    if (pickerState.surah) {
      sel.value = pickerState.surah;
      onSurahChange();
    }
  } catch (e) {
    sel.innerHTML = `<option value="">Failed to load: ${escapeHtml(e.message)}</option>`;
  }
}

function onSurahChange() {
  const sSel = document.getElementById('picker-surah');
  const aSel = document.getElementById('picker-ayah');
  const loadBtn = document.getElementById('picker-load');
  pickerState.surah = sSel.value;
  pickerState.ayah = '';
  refreshStepButtons();
  if (!sSel.value) {
    aSel.disabled = true;
    aSel.innerHTML = '<option value="">—</option>';
    loadBtn.disabled = true;
    return;
  }
  const opt = sSel.options[sSel.selectedIndex];
  const versesCount = parseInt(opt.dataset.verses) || 0;
  const opts = ['<option value="">—</option>'];
  for (let i = 1; i <= versesCount; i++) opts.push(`<option value="${i}">${i}</option>`);
  aSel.innerHTML = opts.join('');
  aSel.disabled = false;
  aSel.onchange = () => {
    pickerState.ayah = aSel.value;
    loadBtn.disabled = !aSel.value;
    refreshStepButtons();
  };
}

function refreshStepButtons() {
  const prev = document.getElementById('picker-prev');
  const next = document.getElementById('picker-next');
  if (!prev || !next) return;
  const s = parseInt(pickerState.surah);
  const a = parseInt(pickerState.ayah);
  const hasSelection = !!(s && a);
  // Disable Prev at 1:1 and Next at 114:last
  let disablePrev = !hasSelection;
  let disableNext = !hasSelection;
  if (hasSelection) {
    if (s === 1 && a === 1) disablePrev = true;
    if (quranChapters && s === quranChapters.length) {
      const lastSurah = quranChapters[quranChapters.length - 1];
      if (a >= (lastSurah.verses_count || 0)) disableNext = true;
    }
  }
  prev.disabled = disablePrev;
  next.disabled = disableNext;
}

async function stepVerse(direction) {
  if (!quranChapters) return;
  let s = parseInt(pickerState.surah);
  let a = parseInt(pickerState.ayah);
  if (!s || !a) return;

  if (direction > 0) {
    const cur = quranChapters.find(c => c.id === s);
    if (a < cur.verses_count) {
      a += 1;
    } else if (s < quranChapters.length) {
      s += 1;
      a = 1;
    } else {
      return; // already at 114:last
    }
  } else {
    if (a > 1) {
      a -= 1;
    } else if (s > 1) {
      s -= 1;
      a = quranChapters.find(c => c.id === s).verses_count;
    } else {
      return; // already at 1:1
    }
  }

  // Apply to dropdowns
  const sSel = document.getElementById('picker-surah');
  const aSel = document.getElementById('picker-ayah');
  if (parseInt(sSel.value) !== s) {
    sSel.value = String(s);
    onSurahChange();   // rebuilds the ayah dropdown
  }
  aSel.value = String(a);
  pickerState.ayah = String(a);
  document.getElementById('picker-load').disabled = false;
  refreshStepButtons();

  await loadVerse();
}

let irabLoadSeq = 0;          // monotonic token — newest load wins
let irabLoadPending = false;  // a verse fetch is currently in flight

async function loadVerse() {
  const sSel = document.getElementById('picker-surah');
  const aSel = document.getElementById('picker-ayah');
  const loadBtn = document.getElementById('picker-load');
  const goBtn = document.getElementById('irab-go');
  if (!sSel.value || !aSel.value) return;
  const verseKey = `${sSel.value}:${aSel.value}`;

  const mySeq = ++irabLoadSeq;   // claim this load; any older in-flight load is now stale
  irabLoadPending = true;
  loadBtn.disabled = true;
  loadBtn.textContent = t('irabPickLoading');
  if (goBtn) goBtn.disabled = true;   // block Analyze until the textarea is settled

  let verseText = '';
  let lastErr = null;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const res = await fetch(`https://api.quran.com/api/v4/verses/by_key/${verseKey}?fields=text_uthmani,text_imlaei`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      verseText = (data.verse && (data.verse.text_uthmani || data.verse.text_imlaei)) || '';
      if (verseText) break;
      throw new Error('No verse text returned');
    } catch (e) {
      lastErr = e;
      if (attempt < 3) await new Promise(r => setTimeout(r, 400 * attempt));
    }
  }

  // Discard if a newer load superseded this one — prevents a slow stale
  // fetch from overwriting the textarea with the wrong ayah.
  if (mySeq !== irabLoadSeq) return;
  irabLoadPending = false;

  try {
    if (!verseText) throw lastErr || new Error('No verse text returned');
    const ta = document.getElementById('irab-input');
    ta.value = verseText;
    ta.focus();
  } catch (e) {
    document.getElementById('irab-results').innerHTML =
      `<div class="feedback-box error">Failed to load verse ${verseKey}: ${escapeHtml(e.message)}</div>`;
  } finally {
    loadBtn.disabled = false;
    loadBtn.textContent = t('irabPickLoad');
    if (goBtn) goBtn.disabled = false;
  }
}

async function analyzeVerse() {
  if (irabLoadPending) return;   // a verse is still loading — ignore until settled
  const input = document.getElementById('irab-input');
  const verse = input.value.trim();
  if (!verse) { input.focus(); return; }

  const btn = document.getElementById('irab-go');
  const results = document.getElementById('irab-results');
  btn.disabled = true;
  btn.textContent = t('irabAnalyzing');
  results.innerHTML = `<div class="feedback-box loading"><span class="spinner"></span> ${t('irabAnalyzing')}</div>`;

  try {
    const res = await fetch('/api/irab', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ verse, language: lang }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    lastIrabResult = data;
    results.innerHTML = renderIrabResult(data);
  } catch (err) {
    results.innerHTML = `<div class="feedback-box error" style="white-space:pre-wrap">${linkify(escapeHtml(err.message))}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = t('irabAnalyze');
  }
}

function linkify(html) {
  // Convert https://... URLs (already escaped) to clickable anchors
  return html.replace(/(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">$1</a>');
}

function renderIrabResult(data) {
  const words = data.words || [];
  const wordsHtml = words.map(w => {
    // Schema supports both new ("word") and legacy ("ar") field names
    const arabic = w.word || w.ar || '';
    const refs = (w.lesson_refs || []).map(r => {
      const idx = LESSON_INDEX && LESSON_INDEX[r.lesson_id];
      const title = idx ? (idx.verified_title[lang] || idx.verified_title.en) : r.lesson_id;
      const tooltip = `${r.lesson_id} — ${title}\n${r.reason || ''}`;
      return `<button class="irab-ref-chip" title="${escapeHtml(tooltip)}" onclick="jumpToLesson('${r.lesson_id}')">${escapeHtml(r.lesson_id)} · ${escapeHtml((title || '').slice(0, 28))}${title && title.length > 28 ? '…' : ''}</button>`;
    }).join('');

    const grammarRows = [];
    if (w.type) grammarRows.push([t('irabType'), w.type]);
    if (w.root) grammarRows.push([t('irabRoot'), w.root]);
    if (w.form) grammarRows.push([t('irabForm'), w.form]);
    if (w.case_mood) grammarRows.push([t('irabCase'), w.case_mood]);
    if (w.role) grammarRows.push([t('irabRole'), w.role]);
    const grammarHtml = grammarRows.map(([k, v]) =>
      `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`).join('');

    const notesHtml = w.notes
      ? `<div class="irab-word-notes"><strong>${t('irabNotes')}:</strong> ${escapeHtml(w.notes)}</div>`
      : '';

    // Curriculum-grounded modules tag each word with `source`. "outside" =
    // the analysis used knowledge beyond the 42-week curriculum → flag it.
    const isOutside = w.source === 'outside';
    const sourceBadge = w.source
      ? (isOutside
          ? `<div class="irab-src-badge irab-src-outside">⚠ ${t('irabSrcOutside') || 'Outside the 42-week curriculum'}</div>`
          : `<div class="irab-src-badge irab-src-curriculum">✓ ${t('irabSrcCurriculum') || 'Grounded in the 42-week curriculum'}</div>`)
      : '';

    return `<div class="irab-word${isOutside ? ' irab-word-outside' : ''}">
      ${sourceBadge}
      <div class="irab-word-ar">${escapeHtml(arabic)}</div>
      ${w.transliteration ? `<div class="irab-word-translit">${escapeHtml(w.transliteration)}</div>` : ''}
      ${w.meaning ? `<div class="irab-word-meaning">${escapeHtml(w.meaning)}</div>` : ''}
      ${grammarHtml ? `<dl class="irab-word-grammar">${grammarHtml}</dl>` : ''}
      ${notesHtml}
      <div class="irab-refs">
        ${refs || `<span style="color:var(--muted);font-size:0.78rem">${t('irabNoLessons')}</span>`}
      </div>
    </div>`;
  }).join('');

  // Grounding summary banner — only present on curriculum-grounded results.
  let groundingBanner = '';
  if (data.grounding && data.grounding.total) {
    const g = data.grounding;
    const allGrounded = g.outside === 0;
    const tmpl = allGrounded
      ? (t('irabGroundAll') || 'All {total} analysis points are grounded in the 42-week curriculum.')
      : (t('irabGroundMixed') || '{curriculum} of {total} analysis points are curriculum-grounded; {outside} use outside knowledge (flagged in amber below).');
    const msg = tmpl.replace('{total}', g.total).replace('{curriculum}', g.curriculum).replace('{outside}', g.outside);
    groundingBanner = `<div class="irab-ground-banner ${allGrounded ? 'ok' : 'warn'}">${escapeHtml(msg)}</div>`;
  }

  return `
    ${groundingBanner}
    ${data.translation ? `<div class="irab-translation"><strong>${t('irabTranslation')}:</strong> ${escapeHtml(data.translation)}</div>` : ''}
    <div class="irab-words">${wordsHtml}</div>
    ${data.overall_notes ? `<div class="irab-notes">${escapeHtml(data.overall_notes)}</div>` : ''}
  `;
}

function jumpToLesson(lessonId) {
  // lessonId looks like "L1W4" → level=1, week=4 → idx=3
  const m = /^L(\d)W(\d+)$/.exec(lessonId);
  if (!m) return;
  const levelId = `level${m[1]}`;
  const weekIdx = parseInt(m[2]) - 1;
  if (getDisplayLevels().find(l => l.id === levelId)?.lessons[weekIdx]) {
    clickLesson(levelId, weekIdx);
  }
}
