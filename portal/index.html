<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quranic Arabic Learning Portal</title>
<style>
  :root {
    --green: #1a6b3c;
    --green-light: #2d8f55;
    --green-pale: #e8f5ee;
    --gold: #c9a84c;
    --gold-light: #f0d898;
    --dark: #1a1a1a;
    --mid: #444;
    --muted: #888;
    --bg: #f7f5f0;
    --card: #ffffff;
    --border: #e0dbd0;
    --radius: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--dark);
    height: 100vh; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  .site-footer {
    background: #f7f6ef;
    border-top: 1px solid var(--border);
    padding: 9px 24px; font-size: 0.78rem; line-height: 1.55;
    color: var(--muted); text-align: center; font-style: italic;
    flex-shrink: 0;
  }
  body.rtl .site-footer { font-family: 'Amiri', 'Scheherazade New', system-ui, serif; font-style: normal; font-size: 0.85rem; }
  body.rtl { direction: rtl; }

  /* Nav */
  nav {
    background: var(--green);
    color: white;
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .nav-title { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .nav-title .arabic-title { font-size: 1.2rem; color: var(--gold-light); }
  .lang-switcher { display: flex; gap: 6px; }
  .user-chip { display: flex; align-items: center; gap: 8px; margin-left: 12px; font-size: 0.82rem; color: rgba(255,255,255,0.85); }
  .user-chip .user-email { white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
  .user-chip button {
    background: transparent; color: rgba(255,255,255,0.9); border: 1px solid rgba(255,255,255,0.4);
    border-radius: 14px; padding: 4px 10px; font-size: 0.78rem; cursor: pointer; font-family: inherit;
  }
  .user-chip button:hover { background: rgba(255,255,255,0.15); border-color: #fff; }
  .user-chip .admin-link { color: #ffd980; font-weight: 600; }
  .lang-btn {
    padding: 5px 12px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.4);
    background: transparent; color: white; cursor: pointer; font-size: 0.85rem;
    transition: all 0.2s;
  }
  .lang-btn:hover { background: rgba(255,255,255,0.15); }
  .lang-btn.active { background: var(--gold); border-color: var(--gold); color: var(--dark); font-weight: 600; }

  /* Layout */
  .layout { display: flex; height: calc(100vh - 60px); overflow: hidden; }

  /* Sidebar */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--card);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 0;
  }
  .sidebar-section {
    padding: 10px 16px 4px;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Master search */
  .sidebar-search {
    position: sticky;
    top: 0;
    background: var(--card);
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    z-index: 5;
  }
  .sidebar-search-wrap { position: relative; }
  .sidebar-search input {
    width: 100%;
    padding: 8px 28px 8px 30px;
    border: 1.5px solid var(--border);
    border-radius: 18px;
    background: var(--bg);
    font-size: 0.82rem;
    font-family: inherit;
    outline: none;
    transition: all 0.15s;
  }
  .sidebar-search input:focus { border-color: var(--green); background: var(--card); }
  .sidebar-search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    font-size: 0.85rem; color: var(--muted); pointer-events: none;
  }
  .sidebar-search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    border: none; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 1rem; line-height: 1; padding: 2px 6px;
    border-radius: 50%;
  }
  .sidebar-search-clear:hover { background: var(--green-pale); color: var(--green); }

  /* Search results in main area */
  .search-results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
  }
  .search-result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .search-result-card:hover { border-color: var(--green); box-shadow: var(--shadow); transform: translateY(-1px); }
  .search-result-card .search-result-title { font-size: 0.95rem; color: var(--dark); font-weight: 600; line-height: 1.4; margin-top: 4px; }
  .search-result-card .search-result-snippet { font-size: 0.85rem; color: var(--mid); line-height: 1.5; margin-top: 4px; }

  mark.search-hit {
    background: var(--gold-light);
    color: var(--dark);
    padding: 0 2px;
    border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(201,168,76,0.5);
  }
  mark.search-hit.first {
    animation: searchPulse 1.6s ease-out;
  }
  @keyframes searchPulse {
    0%   { box-shadow: 0 0 0 0 rgba(201,168,76,0.9); }
    50%  { box-shadow: 0 0 0 8px rgba(201,168,76,0); }
    100% { box-shadow: 0 0 0 1px rgba(201,168,76,0.5); }
  }

  .search-filter-bar {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 16px 32px 0;
  }
  .search-filter-chip {
    padding: 6px 14px;
    border-radius: 16px;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--mid);
    cursor: pointer;
    font-size: 0.82rem;
    font-family: inherit;
    transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .search-filter-chip:hover { border-color: var(--green); color: var(--green); }
  .search-filter-chip.active {
    background: var(--green); color: white; border-color: var(--green);
  }
  .search-filter-chip .count {
    font-size: 0.72rem; opacity: 0.75;
    background: rgba(0,0,0,0.08); padding: 1px 7px; border-radius: 10px;
  }
  .search-filter-chip.active .count { background: rgba(255,255,255,0.25); }

  .search-result-kind {
    font-size: 0.62rem; font-weight: 700; color: var(--green);
    text-transform: uppercase; letter-spacing: 0.06em;
    background: var(--green-pale); border-radius: 4px;
    padding: 1px 6px; display: inline-block;
    border: 1px solid rgba(26,107,60,0.2);
  }
  .search-result-title { font-size: 0.82rem; color: var(--dark); margin-top: 4px; line-height: 1.35; font-weight: 500; }
  .search-result-snippet { font-size: 0.72rem; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .search-result-snippet mark { background: var(--gold-light); color: var(--dark); padding: 0 2px; border-radius: 2px; }
  .search-empty {
    padding: 24px 16px; text-align: center;
    color: var(--muted); font-size: 0.82rem;
  }

  /* Level header in sidebar */
  .level-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: all 0.15s;
    border-left: 3px solid transparent;
    user-select: none;
  }
  .level-header:hover { background: var(--green-pale); }
  .level-header.active { background: var(--green-pale); border-left-color: var(--green); }
  .level-icon {
    width: 32px; height: 32px; border-radius: 7px;
    background: var(--green-pale); display: flex; align-items: center; justify-content: center;
    font-size: 1rem; color: var(--green); flex-shrink: 0; font-weight: bold;
  }
  .level-header.active .level-icon { background: var(--green); color: white; }
  .level-header-text { flex: 1; }
  .level-name { font-size: 0.85rem; font-weight: 600; line-height: 1.3; }
  .level-sub { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
  .chevron {
    font-size: 0.65rem;
    color: var(--muted);
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .chevron.open { transform: rotate(90deg); }

  /* Week items in sidebar */
  .lesson-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 7px 16px 7px 28px;
    cursor: pointer;
    transition: background 0.12s;
    border-left: 3px solid transparent;
  }
  .lesson-item:hover { background: var(--green-pale); }
  .lesson-item.active { background: var(--green-pale); border-left-color: var(--green); }
  .lesson-week-badge {
    font-size: 0.65rem; font-weight: 700; color: var(--green);
    background: var(--green-pale); border-radius: 4px;
    padding: 1px 5px; flex-shrink: 0; margin-top: 1px;
    border: 1px solid rgba(26,107,60,0.2);
  }
  .lesson-item.active .lesson-week-badge { background: var(--green); color: white; }
  .lesson-item-title { font-size: 0.78rem; color: var(--mid); line-height: 1.4; }
  .lesson-item.active .lesson-item-title { color: var(--dark); font-weight: 500; }

  /* Reference items */
  .ref-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; cursor: pointer; transition: all 0.15s;
    border-left: 3px solid transparent;
  }
  .ref-item:hover { background: var(--green-pale); }
  .ref-item.active { background: var(--green-pale); border-left-color: var(--green); }
  .ref-icon {
    width: 32px; height: 32px; border-radius: 7px;
    background: #fef9ee; display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; color: var(--gold); flex-shrink: 0; font-weight: bold;
    border: 1px solid #f0dfa0;
  }
  .ref-item.active .ref-icon { background: var(--gold); color: white; border-color: var(--gold); }
  .ref-name { font-size: 0.85rem; font-weight: 500; }

  /* Main content */
  .main { flex: 1; overflow-y: auto; padding: 0; }

  /* Welcome screen */
  .welcome {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; padding: 40px; text-align: center;
  }
  .welcome-bismillah { font-size: 2rem; color: var(--green); margin-bottom: 16px; font-family: serif; }
  .welcome h1 { font-size: 1.6rem; color: var(--dark); margin-bottom: 12px; }
  .welcome p { color: var(--muted); max-width: 440px; line-height: 1.7; }

  /* Section header in main */
  .topic-header {
    background: linear-gradient(135deg, var(--green) 0%, var(--green-light) 100%);
    color: white; padding: 28px 32px;
  }
  .topic-header h2 { font-size: 1.4rem; margin-bottom: 6px; }
  .topic-header p { opacity: 0.85; font-size: 0.9rem; line-height: 1.6; }
  .topic-header .week-num {
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    opacity: 0.7; margin-bottom: 6px;
  }

  .section { padding: 24px 32px; }
  .section-title {
    font-size: 0.75rem; font-weight: 700; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Level overview — lesson cards grid */
  .lesson-cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .lesson-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .lesson-card:hover { border-color: var(--green); box-shadow: var(--shadow); transform: translateY(-1px); }
  .lesson-card-week {
    font-size: 0.68rem; font-weight: 700; color: var(--green);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .lesson-card-title { font-size: 0.88rem; font-weight: 600; line-height: 1.4; color: var(--dark); }
  .lesson-card-arrow { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

  /* PDF grid */
  .pdf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .pdf-card {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; background: var(--card);
    border: 1px solid var(--border); border-radius: var(--radius);
    text-decoration: none; color: var(--dark);
    transition: all 0.15s;
  }
  .pdf-card:hover { border-color: var(--green); box-shadow: var(--shadow); transform: translateY(-1px); }
  .pdf-icon { font-size: 1.4rem; flex-shrink: 0; }
  .pdf-name { font-size: 0.84rem; font-weight: 500; line-height: 1.3; }

  /* Practice section */
  .practice-start {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px; text-align: center;
    box-shadow: var(--shadow);
  }
  .practice-start h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--green); }
  .practice-start p { color: var(--muted); font-size: 0.88rem; margin-bottom: 20px; }
  .btn-primary {
    background: var(--green); color: white; border: none;
    padding: 12px 28px; border-radius: 24px; font-size: 0.95rem;
    font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .btn-primary:hover { background: var(--green-light); transform: translateY(-1px); }
  .btn-primary:disabled,
  .btn-primary[disabled] {
    background: #d1d5db; color: #6b7280; cursor: not-allowed;
    transform: none; box-shadow: none;
  }
  .btn-primary:disabled:hover { background: #d1d5db; transform: none; }
  .btn-secondary {
    background: transparent; color: var(--green); border: 1.5px solid var(--green);
    padding: 10px 22px; border-radius: 24px; font-size: 0.9rem;
    font-weight: 500; cursor: pointer; transition: all 0.2s;
  }
  .btn-secondary:hover { background: var(--green-pale); }
  .btn-secondary:disabled,
  .btn-secondary[disabled] {
    color: #9ca3af; border-color: #d1d5db; cursor: not-allowed; background: transparent;
  }
  .btn-secondary:disabled:hover { background: transparent; }

  /* Question card */
  .question-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow);
  }
  .q-progress { font-size: 0.8rem; color: var(--muted); margin-bottom: 16px; }
  .q-progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 20px; overflow: hidden; }
  .q-progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.4s ease; }
  .q-badge {
    display: inline-block; padding: 3px 10px; border-radius: 12px;
    font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 14px;
  }
  .badge-translation { background: #e8f0fe; color: #1a56db; }
  .badge-grammar { background: #fef3e2; color: #b45309; }
  .badge-vocabulary { background: #f0fdf4; color: #166534; }
  .badge-pronunciation { background: #fdf4ff; color: #7c3aed; }
  .badge-factual { background: #f1f5f9; color: #475569; }

  .q-text { font-size: 1.05rem; font-weight: 600; margin-bottom: 20px; line-height: 1.6; }
  .answer-area {
    width: 100%; min-height: 80px; padding: 12px 16px;
    border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 0.95rem; resize: vertical; font-family: inherit;
    line-height: 1.6; transition: border-color 0.2s;
  }
  .answer-area:focus { outline: none; border-color: var(--green); }
  .q-actions { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
  .q-actions .spacer { flex: 1; }

  /* Feedback */
  .feedback-box {
    margin-top: 20px; padding: 16px 18px;
    border-radius: 8px; border-left: 4px solid var(--green);
    background: var(--green-pale); font-size: 0.92rem; line-height: 1.7;
    white-space: pre-wrap;
  }
  .feedback-box.loading { color: var(--muted); font-style: italic; }
  .feedback-box.error { border-color: #dc2626; background: #fef2f2; color: #991b1b; }
  .feedback-arabic { font-size: 1.2rem; font-family: 'Noto Naskh Arabic', serif; direction: rtl; }

  /* Score card */
  .score-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 36px; text-align: center;
    box-shadow: var(--shadow);
  }
  .score-num { font-size: 3.5rem; font-weight: 800; color: var(--green); line-height: 1; margin-bottom: 8px; }
  .score-label { font-size: 1rem; color: var(--muted); margin-bottom: 24px; }
  .score-actions { display: flex; gap: 12px; justify-content: center; }

  /* Quiz */
  .quiz-setup {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow);
  }
  .quiz-setup h3 { font-size: 1.15rem; margin-bottom: 8px; color: var(--green); }
  .quiz-setup p { color: var(--mid); font-size: 0.9rem; margin-bottom: 18px; line-height: 1.6; }
  .quiz-options { display: flex; flex-wrap: wrap; gap: 18px; margin: 16px 0 22px; }
  .quiz-option-group { display: flex; flex-direction: column; gap: 6px; }
  .quiz-option-label { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .quiz-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .quiz-pill {
    padding: 6px 14px; border-radius: 16px; border: 1.5px solid var(--border);
    background: var(--card); cursor: pointer; font-size: 0.85rem; transition: all 0.15s;
  }
  .quiz-pill:hover { border-color: var(--green); }
  .quiz-pill.active { background: var(--green); color: white; border-color: var(--green); }

  .quiz-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow);
  }
  .quiz-arabic {
    font-size: 2.4rem; text-align: center; padding: 28px 16px;
    background: var(--green-pale); border-radius: 10px; margin: 12px 0 24px;
    color: var(--green); font-family: 'Noto Naskh Arabic', 'Traditional Arabic', serif;
    direction: rtl; line-height: 1.6;
  }
  .quiz-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 600px) { .quiz-choices { grid-template-columns: 1fr; } }
  .quiz-choice {
    padding: 14px 16px; background: var(--card);
    border: 1.5px solid var(--border); border-radius: 8px;
    cursor: pointer; font-size: 0.95rem; text-align: left;
    transition: all 0.15s; line-height: 1.4;
  }
  .quiz-choice:hover:not(:disabled) { border-color: var(--green); background: var(--green-pale); }
  .quiz-choice:disabled { cursor: default; }
  .quiz-choice.correct { border-color: var(--green); background: #d4f1de; color: #0e4f29; font-weight: 600; }
  .quiz-choice.wrong { border-color: #dc2626; background: #fef2f2; color: #991b1b; }
  .quiz-source {
    margin-top: 16px; padding: 10px 14px; background: var(--bg); border-radius: 6px;
    font-size: 0.78rem; color: var(--muted);
  }

  /* Learn Deep */
  .ld-picker {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px;
    box-shadow: var(--shadow); margin-bottom: 18px;
    display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;
  }
  .ld-picker-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
  .ld-picker-field label { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .ld-picker select {
    padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--card); font-size: 0.92rem; cursor: pointer;
    font-family: inherit; min-height: 40px;
  }
  .ld-picker select:focus { outline: none; border-color: var(--green); }
  .ld-picker select:disabled { opacity: 0.5; cursor: not-allowed; }

  .ld-result { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
  .ld-title-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  .ld-title-row h2 { font-size: 1.5rem; color: var(--green); }
  .ld-arabic { font-size: 1.6rem; color: #0e4f29; font-family: 'Amiri', 'Scheherazade New', serif; }
  .ld-lesson-tag { font-size: 0.78rem; color: var(--muted); margin-bottom: 14px; }
  .ld-lesson-tag a { color: var(--green); text-decoration: none; font-weight: 600; }
  .ld-lesson-tag a:hover { text-decoration: underline; }
  .ld-section { margin-top: 20px; }
  .ld-section h3 { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid var(--green-pale); }
  .ld-overview { font-size: 0.95rem; line-height: 1.65; }
  .ld-rules { padding-left: 22px; }
  .ld-rules li { margin-bottom: 8px; line-height: 1.55; }

  /* Self-Check Verse Analysis */

  .sc-fill-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow);
  }
  .sc-fill-arabic {
    font-size: 1.7rem; color: #0e4f29; font-family: 'Amiri', 'Scheherazade New', serif;
    margin-bottom: 10px; direction: rtl; text-align: right;
  }
  .sc-fill-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .sc-fill-row label { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .sc-fill-row input, .sc-fill-row textarea {
    padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 6px;
    font-size: 0.9rem; font-family: inherit;
  }
  .sc-fill-row input:focus, .sc-fill-row textarea:focus { outline: none; border-color: var(--green); }

  .sc-result-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px;
  }
  .sc-result-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }

  .sc-badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 0.74rem; font-weight: 700;
  }
  .sc-badge.correct    { background: #dcfce7; color: #14532d; }
  .sc-badge.partial    { background: #fef3c7; color: #78350f; }
  .sc-badge.incorrect  { background: #fee2e2; color: #7f1d1d; }
  .sc-badge.missing    { background: #f3f4f6; color: #4b5563; }
  .sc-field-row { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--border); }
  .sc-field-row:first-child { border-top: none; }
  .sc-field-label { font-size: 0.78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .sc-your { color: var(--text); }
  .sc-your.empty { color: var(--muted); font-style: italic; }
  .sc-correct { background: var(--green-pale); padding: 6px 8px; border-radius: 4px; font-size: 0.9rem; line-height: 1.5; }
  .sc-feedback { margin-top: 8px; padding: 8px 12px; background: #fffbeb; border-left: 3px solid #f59e0b; border-radius: 4px; font-size: 0.88rem; line-height: 1.5; }

  .sc-overall { background: var(--green-pale); border-left: 4px solid var(--green); border-radius: 6px; padding: 14px 18px; margin-top: 16px; font-size: 0.95rem; line-height: 1.65; }

    background: var(--card); border: 1px solid var(--border);

  .irab-input {

const t = key => I18N[lang][key];

// ─── State ────────────────────────────────────────────────────────────────────

let lang = 'tr';
let expandedLevel = null;
let currentView = null; // { type: 'level'|'lesson'|'reference', level, lesson, ref }
let practiceMode = false;
let questionIndex = 0;
let searchQuery = '';
let searchFilter = 'all';
let pendingHighlight = '';

// ─── Language ─────────────────────────────────────────────────────────────────

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${l}')"]`).classList.add('active');
  document.documentElement.lang = l;
  document.body.classList.toggle('rtl', l === 'ar');
  document.getElementById('nav-label').textContent = I18N[l].navLabel;
  renderUserChip();
  const footerEl = document.getElementById('site-footer');
  footerEl.textContent = I18N[l].footerCredit;
  // Publish actual footer height so the floating Feedback button clears it
  // regardless of text wrap / language / viewport width.
  requestAnimationFrame(() => {
    document.documentElement.style.setProperty('--footer-h', footerEl.offsetHeight + 'px');
  });
  refreshFeedbackLabel();
  renderSidebar();
  if (!currentView) {
    document.getElementById('welcome-h1').textContent = I18N[l].welcomeH1;
    document.getElementById('welcome-p').textContent = I18N[l].welcomeP;
  } else if (currentView.type === 'level') {
    renderLevelOverview(currentView.level);
  } else if (currentView.type === 'lesson') {
    if (practiceMode) renderPractice();
    else renderLesson(currentView.level, currentView.lesson);
  } else if (currentView.type === 'reference') {
    if (currentView.ref.quiz) renderQuizSetup(currentView.ref);
    else if (currentView.ref.irab) renderIrab(currentView.ref);
    else if (currentView.ref.selfCheck) renderSelfCheck(currentView.ref);
    else if (currentView.ref.learnDeep) renderLearnDeep(currentView.ref);
    else renderReference(currentView.ref);
  }
}

// ─── Sidebar ──────────────────────────────────────────────────────────────────

function renderSidebar() {
  const levelIcons = { level1: '١', level2: '٢', level3: '٣' };
  const escAttr = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const q = escAttr(searchQuery);
  const searchHtml = `
    <div class="sidebar-search">
      <div class="sidebar-search-wrap">
        <span class="sidebar-search-icon">🔍</span>
        <input type="text" id="sidebar-search-input"
               placeholder="${escAttr(t('searchPlaceholder'))}"
               value="${q}"
               oninput="onSearchInput(this.value)" />
        <button class="sidebar-search-clear" id="sidebar-search-clear" onclick="onSearchClear()" title="Clear" style="display:${searchQuery ? '' : 'none'}">✕</button>
      </div>
    </div>`;

  let html = searchHtml;
  if (searchQuery.trim()) {
    renderSearchResultsMain(searchQuery.trim());
  }

  const renderRefItem = ref => {
    const isActive = currentView && currentView.type === 'reference' && currentView.ref && currentView.ref.id === ref.id;
    return `
      <div class="ref-item ${isActive ? 'active' : ''}" onclick="clickReference('${ref.id}')">
        <div class="ref-icon">${ref.icon}</div>
        <div class="ref-name">${ref.title[lang]}</div>
      </div>`;
  };

  // Power Learning — pinned at the top
  const powerItems = REFERENCE_TOPICS.filter(r => r.group === 'power' && isModuleActive(r.id));
  if (powerItems.length) {
    html += `<div class="sidebar-section">${t('groupPower')}</div>`;
    for (const ref of powerItems) html += renderRefItem(ref);
  }

  html += `<div class="sidebar-section" style="margin-top:8px">${t('groupLessons')}</div>`;

  for (const level of LEVELS) {
    // Filter to only the lessons this user has unlocked
    const unlockedLessons = level.lessons
      .map((lesson, i) => ({ lesson, i }))
      .filter(({ lesson }) => isLessonUnlocked(level, lesson));
    if (unlockedLessons.length === 0) continue;   // hide the entire level if nothing unlocked

    const isExpanded = expandedLevel === level.id;
    const isActive = currentView && currentView.type === 'level' && currentView.level && currentView.level.id === level.id;
    html += `
      <div class="level-header ${isActive && !currentView.lesson ? 'active' : ''}" onclick="clickLevel('${level.id}')">
        <div class="level-icon">${levelIcons[level.id]}</div>
        <div class="level-header-text">
          <div class="level-name">${level.title[lang]}</div>
          <div class="level-sub">${unlockedLessons.length} ${t('lessons')}</div>
        </div>
        <div class="chevron ${isExpanded ? 'open' : ''}">▸</div>
      </div>`;

    if (isExpanded) {
      for (const { lesson, i } of unlockedLessons) {
        const isLessonActive = currentView && currentView.type === 'lesson' && currentView.lesson === lesson;
        html += `
          <div class="lesson-item ${isLessonActive ? 'active' : ''}" onclick="clickLesson('${level.id}', ${i})">
            <div class="lesson-week-badge">${t('week')} ${lesson.week}</div>
            <div class="lesson-item-title">${lesson.title[lang]}</div>
          </div>`;
      }
    }
  }

  const referenceItems = REFERENCE_TOPICS.filter(r => r.group !== 'power' && isModuleActive(r.id));
  if (referenceItems.length) {
    html += `<div class="sidebar-section" style="margin-top:8px">${t('groupReference')}</div>`;
    for (const ref of referenceItems) html += renderRefItem(ref);
  }

  document.getElementById('sidebar').innerHTML = html;
}

// ─── Master Search ────────────────────────────────────────────────────────────

function onSearchInput(val) {
  searchQuery = val;
  const clearBtn = document.getElementById('sidebar-search-clear');
  if (clearBtn) clearBtn.style.display = val ? '' : 'none';
  if (val.trim()) {
    renderSearchResultsMain(val.trim());
  } else {
    // Restore previous view
    if (!currentView) showWelcome();
    else if (currentView.type === 'level') renderLevelOverview(currentView.level);
    else if (currentView.type === 'lesson') {
      if (practiceMode) renderPractice();
      else renderLesson(currentView.level, currentView.lesson);
    } else if (currentView.type === 'reference') {
      const ref = currentView.ref;
      if (ref.quiz) renderQuizSetup(ref);
      else if (ref.irab) renderIrab(ref);
      else if (ref.selfCheck) renderSelfCheck(ref);
      else if (ref.learnDeep) renderLearnDeep(ref);
      else renderReference(ref);
    }
  }
}

function onSearchClear() {
  searchQuery = '';
  searchFilter = 'all';
  const input = document.getElementById('sidebar-search-input');
  if (input) input.value = '';
  onSearchInput('');
  if (input) input.focus();
}

function gotoSearchResult(kind, a, b) {
  pendingHighlight = searchQuery.trim();
  if (kind === 'level') clickLevel(a);
  else if (kind === 'lesson') clickLesson(a, b);
  else if (kind === 'reference') clickReference(a);
  onSearchClear();
  // Defer until DOM is laid out
  setTimeout(() => applyHighlight(pendingHighlight), 80);
}

function applyHighlight(query) {
  if (!query) return;
  const main = document.getElementById('main');
  if (!main) return;
  const q = query.trim();
  if (!q) return;
  // Walk text nodes and wrap matches
  const walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p = node.parentNode;
      if (!p) return NodeFilter.FILTER_REJECT;
      const tag = p.nodeName;
      if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'MARK') return NodeFilter.FILTER_REJECT;
      return node.nodeValue.toLowerCase().includes(q.toLowerCase())
        ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const targets = [];
  let n; while ((n = walker.nextNode())) targets.push(n);
  let firstMark = null;
  const lower = q.toLowerCase();
  for (const node of targets) {
    const text = node.nodeValue;
    const frag = document.createDocumentFragment();
    let i = 0;
    const lowerText = text.toLowerCase();
    while (i < text.length) {
      const idx = lowerText.indexOf(lower, i);
      if (idx < 0) {
        frag.appendChild(document.createTextNode(text.slice(i)));
        break;
      }
      if (idx > i) frag.appendChild(document.createTextNode(text.slice(i, idx)));
      const mark = document.createElement('mark');
      mark.className = 'search-hit';
      mark.textContent = text.slice(idx, idx + q.length);
      frag.appendChild(mark);
      if (!firstMark) firstMark = mark;
      i = idx + q.length;
    }
    node.parentNode.replaceChild(frag, node);
  }
  if (firstMark) {
    firstMark.classList.add('first');
    firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function setSearchFilter(key) {
  searchFilter = key;
  if (searchQuery.trim()) renderSearchResultsMain(searchQuery.trim());
}

function renderSearchResultsMain(rawQuery) {
  const results = runSearch(rawQuery);
  const main = document.getElementById('main');
  const groupOrder = ['searchKindLevel', 'searchKindLesson', 'searchKindQuestion', 'searchKindReference', 'searchKindPdf'];
  const groupLabels = {
    searchKindLevel: t('groupLessons'),
    searchKindLesson: t('searchKindLesson') + 's',
    searchKindQuestion: t('searchKindQuestion') + 's',
    searchKindReference: t('groupReference'),
    searchKindPdf: 'PDFs',
  };
  const groups = {};
  for (const r of results) {
    (groups[r.kindKey] = groups[r.kindKey] || []).push(r);
  }
  // Reset filter if its bucket has no hits
  if (searchFilter !== 'all' && !(groups[searchFilter] && groups[searchFilter].length)) {
    searchFilter = 'all';
  }
  let chips = `<button class="search-filter-chip ${searchFilter === 'all' ? 'active' : ''}" onclick="setSearchFilter('all')">All <span class="count">${results.length}</span></button>`;
  for (const key of groupOrder) {
    const group = groups[key];
    if (!group || !group.length) continue;
    chips += `<button class="search-filter-chip ${searchFilter === key ? 'active' : ''}" onclick="setSearchFilter('${key}')">${escapeHtml(groupLabels[key])} <span class="count">${group.length}</span></button>`;
  }
  const header = `
    <div class="topic-header">
      <div class="week-num">🔍 ${escapeHtml(rawQuery)}</div>
      <h2>${results.length} ${results.length === 1 ? 'result' : 'results'}</h2>
    </div>
    <div class="search-filter-bar">${chips}</div>`;
  if (!results.length) {
    main.innerHTML = header + `<div class="section"><div class="search-empty">${t('searchNoResults')}</div></div>`;
    return;
  }
  let body = '';
  for (const key of groupOrder) {
    const group = groups[key];
    if (!group || !group.length) continue;
    if (searchFilter !== 'all' && searchFilter !== key) continue;
    let cards = '';
    for (const r of group) {
      cards += `
        <div class="search-result-card" onclick="${r.action}">
          <span class="search-result-kind">${t(r.kindKey)}</span>
          <div class="search-result-title">${r.title}</div>
          ${r.snippet ? `<div class="search-result-snippet">${r.snippet}</div>` : ''}
        </div>`;
    }
    body += `
      <div class="section">
        <div class="section-title">${escapeHtml(groupLabels[key])} <span style="color:var(--muted);font-weight:500;margin-left:6px">${group.length}</span></div>
        <div class="search-results-grid">${cards}</div>
      </div>`;
  }
  main.innerHTML = header + body;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function highlightSnippet(text, query) {
  if (!text) return '';
  const t = String(text);
  const idx = t.toLowerCase().indexOf(query.toLowerCase());
  if (idx < 0) return escapeHtml(t.slice(0, 110)) + (t.length > 110 ? '…' : '');
  const start = Math.max(0, idx - 30);
  const end = Math.min(t.length, idx + query.length + 70);
  const before = (start > 0 ? '…' : '') + escapeHtml(t.slice(start, idx));
  const match = '<mark>' + escapeHtml(t.slice(idx, idx + query.length)) + '</mark>';
  const after = escapeHtml(t.slice(idx + query.length, end)) + (end < t.length ? '…' : '');
  return before + match + after;
}

function _hit(text, q) {
  return text && String(text).toLowerCase().includes(q);
}

function runSearch(rawQuery) {
  const q = rawQuery.toLowerCase();
  const results = [];
  const langs = ['en', 'tr', 'ar'];

  // Levels
  for (const level of LEVELS) {
    const titleStr = level.title[lang] || level.title.en;
    if (langs.some(l => _hit(level.title[l], q)) || _hit(level.desc && level.desc[lang], q)) {
      results.push({
        kindKey: 'searchKindLevel',
        title: escapeHtml(titleStr),
        snippet: level.desc ? highlightSnippet(level.desc[lang] || '', rawQuery) : '',
        action: `gotoSearchResult('level', '${level.id}')`,
      });
    }
    // Lessons
    for (let i = 0; i < level.lessons.length; i++) {
      const lesson = level.lessons[i];
      const lessonTitle = lesson.title[lang] || lesson.title.en;
      const titleHit = langs.some(l => _hit(lesson.title[l], q));
      if (titleHit) {
        results.push({
          kindKey: 'searchKindLesson',
          title: `${t('week')} ${lesson.week} — ${highlightSnippet(lessonTitle, rawQuery)}`,
          snippet: escapeHtml(level.title[lang] || ''),
          action: `gotoSearchResult('lesson', '${level.id}', ${i})`,
        });
      }
      // Lecture sections — both hand-authored and auto-generated bundle
      const levelNum = LEVELS.indexOf(level) + 1;
      const lectureKey = `L${levelNum}W${lesson.week}`;
      const lectureSources = [];
      if (lesson.lecture && Array.isArray(lesson.lecture.sections)) lectureSources.push(lesson.lecture);
      if (LECTURES_BUNDLE && LECTURES_BUNDLE[lectureKey]) lectureSources.push(LECTURES_BUNDLE[lectureKey]);
      let lectureHit = false;
      for (const lec of lectureSources) {
        for (const sec of (lec.sections || [])) {
          let matched = null;
          for (const l of langs) {
            if (_hit(sec.title && sec.title[l], q)) { matched = sec.title[l]; break; }
            if (_hit(sec.body && sec.body[l], q)) { matched = sec.body[l]; break; }
          }
          if (!matched && Array.isArray(sec.examples)) {
            for (const ex of sec.examples) {
              if (_hit(ex.ar, q)) { matched = ex.ar + (ex.gloss ? ' — ' + (ex.gloss[lang] || ex.gloss.en || '') : ''); break; }
              if (ex.gloss) {
                for (const l of langs) {
                  if (_hit(ex.gloss[l], q)) { matched = (ex.ar ? ex.ar + ' — ' : '') + ex.gloss[l]; break; }
                }
                if (matched) break;
              }
            }
          }
          if (matched) {
            results.push({
              kindKey: 'searchKindLesson',
              title: escapeHtml(lessonTitle),
              snippet: highlightSnippet(matched, rawQuery),
              action: `gotoSearchResult('lesson', '${level.id}', ${i})`,
            });
            lectureHit = true;
            break;
          }
        }
        if (lectureHit) break;
      }
      // PDF concept index (summary + concept names/keywords/examples extracted from lesson PDFs)
      if (!lectureHit && window.LESSON_INDEX && LESSON_INDEX[lectureKey]) {
        const idx = LESSON_INDEX[lectureKey];
        let matched = null;
        if (idx.summary && _hit(idx.summary, q)) matched = idx.summary;
        if (!matched && Array.isArray(idx.concepts)) {
          for (const c of idx.concepts) {
            if (langs.some(l => _hit(c.name && c.name[l], q))) { matched = (c.name[lang] || c.name.en); break; }
            if (Array.isArray(c.keywords) && c.keywords.some(k => _hit(k, q))) { matched = c.keywords.join(', '); break; }
            if (Array.isArray(c.examples) && c.examples.some(e => _hit(e, q))) { matched = c.examples.join(' · '); break; }
          }
        }
        if (matched) {
          results.push({
            kindKey: 'searchKindLesson',
            title: escapeHtml(lessonTitle),
            snippet: highlightSnippet(matched, rawQuery),
            action: `gotoSearchResult('lesson', '${level.id}', ${i})`,
          });
        }
      }
    }
  }

  // Reference topics
  for (const ref of REFERENCE_TOPICS) {
    if (!isModuleActive(ref.id)) continue;   // skip deactivated modules
    const refTitle = ref.title[lang] || ref.title.en;
    const titleHit = langs.some(l => _hit(ref.title[l], q));
    const descHit = langs.some(l => _hit(ref.desc && ref.desc[l], q));
    if (titleHit || descHit) {
      results.push({
        kindKey: 'searchKindReference',
        title: highlightSnippet(refTitle, rawQuery),
        snippet: ref.desc ? highlightSnippet(ref.desc[lang] || '', rawQuery) : '',
        action: `gotoSearchResult('reference', '${ref.id}')`,
      });
    }
    // PDFs inside reference
    if (ref.pdfs) {
      for (const pdf of ref.pdfs) {
        if (langs.some(l => _hit(pdf.name && pdf.name[l], q)) || _hit(pdf.path, q)) {
          const pdfName = (pdf.name && (pdf.name[lang] || pdf.name.en)) || pdf.path;
          results.push({
            kindKey: 'searchKindPdf',
            title: highlightSnippet(pdfName, rawQuery),
            snippet: escapeHtml(refTitle),
            action: `gotoSearchResult('reference', '${ref.id}')`,
          });
        }
      }
    }
  }

  return results.slice(0, 60);
}

// ─── Navigation ───────────────────────────────────────────────────────────────

function clickLevel(levelId) {
  const level = LEVELS.find(l => l.id === levelId);
  if (expandedLevel === levelId) {
    expandedLevel = null;
    currentView = null;
    renderSidebar();
    showWelcome();
  } else {
    expandedLevel = levelId;
    currentView = { type: 'level', level };
    practiceMode = false;
    renderSidebar();
    renderLevelOverview(level);
  }
}

function clickLesson(levelId, index) {
  const level = LEVELS.find(l => l.id === levelId);
  const lesson = level.lessons[index];
  if (!isLessonUnlocked(level, lesson)) return;   // belt-and-suspenders: should already be hidden
  expandedLevel = levelId;
  currentView = { type: 'lesson', level, lesson };
  practiceMode = false;
  questionIndex = 0;
  renderSidebar();
  renderLesson(level, lesson);
}

function clickReference(refId) {
  const ref = REFERENCE_TOPICS.find(r => r.id === refId);
  if (!ref || !isModuleActive(refId)) return;   // deactivated module — not openable
  expandedLevel = null;
  currentView = { type: 'reference', ref };
  practiceMode = false;
  renderSidebar();
  if (ref.quiz) renderQuizSetup(ref);
  else if (ref.irab) renderIrab(ref);
  else if (ref.selfCheck) renderSelfCheck(ref);
  else if (ref.learnDeep) renderLearnDeep(ref);
  else renderReference(ref);
}

// ─── Views ────────────────────────────────────────────────────────────────────

function showWelcome() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="welcome">
      <div class="welcome-bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
      <h1>${I18N[lang].welcomeH1}</h1>
      <p>${I18N[lang].welcomeP}</p>
    </div>`;
}

function renderLevelOverview(level) {
  const main = document.getElementById('main');
  const levelIndex = LEVELS.indexOf(level);
  const startWeek = levelIndex * 14 + 1;

  const cardsHtml = level.lessons
    .map((lesson, i) => ({ lesson, i }))
    .filter(({ lesson }) => isLessonUnlocked(level, lesson))
    .map(({ lesson, i }) => `
    <div class="lesson-card" onclick="clickLesson('${level.id}', ${i})">
      <div class="lesson-card-week">${t('week')} ${lesson.week}</div>
      <div class="lesson-card-title">${lesson.title[lang]}</div>
      <div class="lesson-card-arrow">→ ${t('openPDF')} &amp; ${t('practice')}</div>
    </div>`).join('');

  main.innerHTML = `
    <div class="topic-header">
      <h2>${level.title[lang]}</h2>
      <p>${level.desc[lang]}</p>
    </div>
    <div class="section">
      <div class="section-title">${t('levelOverview')}</div>
      <div class="lesson-cards-grid">${cardsHtml}</div>
    </div>`;
}

// Lazy-load the auto-generated lecture bundle on first lesson render.
let LECTURES_BUNDLE = null;
async function ensureLecturesLoaded() {
  if (LECTURES_BUNDLE !== null) return LECTURES_BUNDLE;
  try {
    const res = await fetch('/lectures.json');
    LECTURES_BUNDLE = res.ok ? await res.json() : {};
  } catch {
    LECTURES_BUNDLE = {};
  }
  return LECTURES_BUNDLE;
}

function lookupLecture(level, lesson) {
  // 1. Hand-authored on the lesson object wins
  if (lesson.lecture) return lesson.lecture;
  // 2. Otherwise look up in the auto-generated bundle by L<level>W<week>
  if (!LECTURES_BUNDLE) return null;
  const levelNum = LEVELS.indexOf(level) + 1;
  return LECTURES_BUNDLE[`L${levelNum}W${lesson.week}`] || null;
}

  const main = document.getElementById('main');

    <div class="section">
      <div class="section-title">${t('materials')}</div>

    </div>
    <div class="section">

  // If the lecture wasn't ready synchronously, fetch the bundle and rehydrate
  // the placeholder once it arrives.
  if (!lecture) {
    ensureLecturesLoaded().then(() => {
      // Bail if the user has navigated away
      if (!currentView || currentView.type !== 'lesson' || currentView.lesson !== lesson) return;

      } else if (!fetched && placeholder) {
        // No lecture available — drop the empty placeholder section
        placeholder.closest('.section')?.remove();
      }
    });
  }
}

// Insert whitespace between any Arabic↔Latin/digit boundary so the two scripts
// don't visually collide when the source string lacks separation.
const ARABIC_BIDI_RE = /[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/;
function spaceBidi(s) {
  if (!s) return s;
  return s
    .replace(/([؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿])([A-Za-z0-9])/g, '$1 $2')
    .replace(/([A-Za-z0-9])([؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿])/g, '$1 $2');
}

// Lightweight markdown renderer: handles **bold**, *italic*, bullet lists,
// numbered lists, GFM tables, and paragraphs split on blank lines.
function renderLectureMarkdown(text) {
  if (!text) return '';
  text = spaceBidi(text);
  const escape = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function formatInline(s) {
    return s
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  }

  function renderTable(lines) {
    const split = row => row.replace(/^\s*\|?|\|?\s*$/g, '').split('|').map(c => c.trim());
    const header = split(lines[0]);
    const body = lines.slice(2).map(split);
    const th = header.map(c => `<th>${formatInline(escape(c))}</th>`).join('');
    const trs = body.map(r => `<tr>${r.map(c => `<td>${formatInline(escape(c))}</td>`).join('')}</tr>`).join('');
    return `<div class="lecture-table-wrap"><table class="lecture-table"><thead><tr>${th}</tr></thead><tbody>${trs}</tbody></table></div>`;
  }

  // Walk lines within a block, flushing runs when the line type changes.
  function renderBlock(lines) {
    if (!lines.length) return '';
    // Whole-block table (header + --- + body rows)
    if (lines.length >= 2 && lines[0].includes('|') && /^\s*\|?\s*:?-{2,}/.test(lines[1])) {
      return renderTable(lines);
    }

    const out = [];
    let mode = null;       // 'p' | 'ul' | 'ol'
    let buf = [];

    const flush = () => {
      if (!buf.length) return;
      if (mode === 'ul') out.push(`<ul>${buf.map(l => `<li>${formatInline(escape(l.slice(2)))}</li>`).join('')}</ul>`);
      else if (mode === 'ol') out.push(`<ol>${buf.map(l => `<li>${formatInline(escape(l.replace(/^\d+\.\s+/, '')))}</li>`).join('')}</ol>`);
      else out.push(`<p>${formatInline(escape(buf.join(' ')))}</p>`);
      buf = [];
    };

    for (const line of lines) {
      let kind;
      if (/^- /.test(line)) kind = 'ul';
      else if (/^\d+\.\s/.test(line)) kind = 'ol';
      else kind = 'p';

      if (kind !== mode) { flush(); mode = kind; }
      buf.push(line);
    }
    flush();
    return out.join('');
  }

  return text.split(/\n\s*\n/).map(block => {
    const lines = block.split('\n').map(l => l.trimEnd()).filter(l => l.length > 0);
    return renderBlock(lines);
  }).join('');
}

function renderLecture(lecture) {
  if (!lecture || !lecture.sections) return '';
  return `<div class="lecture-card">${
    lecture.sections.map(sec => {
      const title = sec.title?.[lang] || sec.title?.en || '';
      const body = sec.body?.[lang] || sec.body?.en || '';
      const examplesHtml = sec.examples?.length
        ? `<div class="lecture-examples">${
            sec.examples.map(ex => `
              <div class="lecture-example">
                <div class="lecture-example-ar">${escapeHtml(ex.ar || '')}</div>
                <div class="lecture-example-gloss">${escapeHtml(spaceBidi(ex.gloss?.[lang] || ex.gloss?.en || ''))}</div>
              </div>`).join('')
          }</div>`
        : '';
      return `
        <div class="lecture-section">
          <h3>${escapeHtml(title)}</h3>
          <div class="lecture-body">${renderLectureMarkdown(body)}</div>
          ${examplesHtml}
        </div>`;
    }).join('')
  }</div>`;
}

let quizConfig = { direction: 'tr', length: 10, scope: 'all', level: 'all', weeks: [] };  // weeks=[] means "All"
let quizState = null; // { pool, items, idx, score, answered }

// Derive {level, week} for an entry whose source is an Answer Key PDF.
// Answer Key N maps to lesson N: 1–14 = L1W1–L1W14, 15–28 = L2W1–L2W14, 29–42 = L3W1–L3W14.
function vocabLessonOf(entry) {
  const m = String(entry.source || '').match(/Answer\s*Key[-\s]*(\d+)/i);
  if (!m) return null;
  const n = parseInt(m[1]);
  if (n < 1 || n > 42) return null;
  return { level: Math.ceil(n / 14), week: ((n - 1) % 14) + 1, lessonNum: n };
}

// Returns the set of unlocked lesson ids for the current user (admin = all 42).
function userUnlockedLessons() {
  if (!CURRENT_USER) return new Set();
  if (CURRENT_USER.role === 'admin') {
    const s = new Set();
    for (let L = 1; L <= 3; L++) for (let W = 1; W <= 14; W++) s.add(`L${L}W${W}`);
    return s;
  }
  return new Set(CURRENT_USER.unlocks);
}

// Which levels have at least one unlocked week (for the Level pill row)?
function userUnlockedLevelSet() {
  const out = new Set();
  for (const lid of userUnlockedLessons()) {
    const m = lid.match(/^L(\d)W/);
    if (m) out.add(+m[1]);
  }
  return out;
}

// Which weeks of a given level are unlocked (for the Week pill row)?
function userUnlockedWeeksOfLevel(level) {
  const out = new Set();
  for (const lid of userUnlockedLessons()) {
    const m = lid.match(/^L(\d)W(\d+)$/);
    if (m && +m[1] === level) out.add(+m[2]);
  }
  return out;
}

function filterPool(scope) {
  if (!VOCAB_POOL) return [];
  let all = VOCAB_POOL.filter(e => e.ar && e.tr);
  if (scope === 'answerkeys') all = all.filter(e => /Answer Key|ANSWER KEY/i.test(e.source || ''));
  else if (scope === 'surah') all = all.filter(e => /Sûresi|Surah/i.test(e.source || '') && !/Answer Key/i.test(e.source || ''));

  const unlocked = userUnlockedLessons();   // Set of "L{N}W{M}"
  const weekFilter = Array.isArray(quizConfig.weeks) ? quizConfig.weeks : [];

  const isAdmin = CURRENT_USER && CURRENT_USER.role === 'admin';

  all = all.filter(e => {
    const meta = vocabLessonOf(e);
    if (meta) {
      // Lesson-tagged vocab: must be from an unlocked lesson
      const lid = `L${meta.level}W${meta.week}`;
      if (!unlocked.has(lid)) return false;
      if (quizConfig.level !== 'all' && meta.level !== quizConfig.level) return false;
      if (weekFilter.length > 0 && !weekFilter.includes(meta.week)) return false;
      return true;
    }
    // Non-lesson-tagged vocab (Surah, prayer):
    //   - admins: shown when no level/week narrowing is applied
    //   - non-admins: never shown (gated curriculum only)
    if (!isAdmin) return false;
    if (quizConfig.level !== 'all' || weekFilter.length > 0) return false;
    return true;
  });
  return all;
}

  if (!VOCAB_POOL) {

export ANTHROPIC_API_KEY=...
venv/bin/python build_vocab.py</code></pre>

    `<button class="quiz-pill ${quizConfig.length === n ? 'active' : ''}" onclick="setQuizConfig('length',${n})">${n}</button>`
  ).join('');

  // Level pills: only show levels with at least one unlocked week
  const allowedLevels = userUnlockedLevelSet();
  const levelOptions = [{id:'all', label:t('quizAll')}].concat(
    [1,2,3].filter(L => allowedLevels.has(L)).map(L => ({id:L, label:String(L)}))
  );
  const levelPills = levelOptions.map(it =>
    `<button class="quiz-pill ${quizConfig.level === it.id ? 'active' : ''}" onclick="setQuizConfig('level', ${typeof it.id === 'string' ? `'${it.id}'` : it.id})">${escapeHtml(it.label)}</button>`
  ).join('');

  // Week pills: only weeks the user has unlocked for the selected level
  const selected = Array.isArray(quizConfig.weeks) ? quizConfig.weeks : [];
  let weekPills;
  if (quizConfig.level === 'all') {
    weekPills = `<span style="font-size:0.78rem;color:var(--muted);font-style:italic">${t('quizPickLevelFirst')}</span>`;
  } else {
    const allowedWeeks = [...userUnlockedWeeksOfLevel(quizConfig.level)].sort((a,b) => a - b);
    if (allowedWeeks.length === 0) {
      weekPills = `<span style="font-size:0.78rem;color:var(--muted);font-style:italic">—</span>`;
    } else {
      weekPills =
        `<button class="quiz-pill ${selected.length === 0 ? 'active' : ''}" onclick="clearQuizWeeks()">${escapeHtml(t('quizAll'))}</button>` +
        allowedWeeks.map(w =>
          `<button class="quiz-pill ${selected.includes(w) ? 'active' : ''}" onclick="toggleQuizWeek(${w})">${w}</button>`
        ).join('');
    }
  }

  main.innerHTML = `
    <div class="topic-header">

        <h3>${ref.title[lang]}</h3>
        <p>${t('quizPoolSize')(pool.length)}</p>
        <div class="quiz-options">
          <div class="quiz-option-group">
            <span class="quiz-option-label">${t('quizDirection')}</span>
            <div class="quiz-pills">${pillsHtml(directions, quizConfig.direction, 'direction')}</div>
          </div>
          <div class="quiz-option-group">

            <div class="quiz-pills">${lengthPills}</div>
          </div>

            <span class="quiz-option-label">${t('quizScope')}</span>
            <div class="quiz-pills">${pillsHtml(scopes, quizConfig.scope, 'scope')}</div>
          </div>

            <span class="quiz-option-label">${t('quizLevel')}</span>
            <div class="quiz-pills">${levelPills}</div>
          </div>
          <div class="quiz-option-group">
            <span class="quiz-option-label">${t('quizWeek')}</span>
            <div class="quiz-pills">${weekPills}</div>
          </div>
        </div>
        <button class="btn-primary" onclick="startQuiz()" ${pool.length < 4 ? 'disabled' : ''}>${t('quizStart')}</button>
      </div>
    </div>`;
}

function setQuizConfig(key, value) {
  quizConfig[key] = value;
  if (key === 'level') quizConfig.weeks = [];   // reset week scope when level changes
  renderQuizSetup(currentView.ref);
}

function toggleQuizWeek(w) {
  const arr = Array.isArray(quizConfig.weeks) ? quizConfig.weeks.slice() : [];
  const i = arr.indexOf(w);
  if (i >= 0) arr.splice(i, 1); else arr.push(w);
  quizConfig.weeks = arr.sort((a, b) => a - b);
  renderQuizSetup(currentView.ref);
}

function clearQuizWeeks() {
  quizConfig.weeks = [];
  renderQuizSetup(currentView.ref);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  const pool = filterPool(quizConfig.scope);
  if (pool.length < 4) return;
  const items = shuffle(pool).slice(0, Math.min(quizConfig.length, pool.length));
  quizState = { pool, items, idx: 0, score: 0, answered: false };
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const { items, idx, score, pool } = quizState;
  const total = items.length;
  const item = items[idx];
  const meaningKey = quizConfig.direction; // 'tr' or 'en'

  // Build distractors: 3 random different entries with a meaning value
  const others = shuffle(pool.filter(e => e.ar !== item.ar && e[meaningKey] && e[meaningKey] !== item[meaningKey])).slice(0, 3);
  const choices = shuffle([item, ...others]);

  const ref = currentView.ref;
  const main = document.getElementById('main');
  const pct = Math.round((idx / total) * 100);

  main.innerHTML = `
    <div class="topic-header">
      <h2>${ref.title[lang]}</h2>
      <p>${t('question')} ${idx + 1} ${t('of')} ${total} · ${t('quizScore')}: ${score}</p>
    </div>
    <div class="section">
      <div class="quiz-card">
        <div class="q-progress-bar"><div class="q-progress-fill" style="width:${pct}%"></div></div>
        <div class="quiz-arabic">${escapeHtml(item.ar)}</div>
        <div class="quiz-choices" id="quiz-choices">
          ${choices.map((c, i) => `<button class="quiz-choice" data-correct="${c.ar === item.ar}" onclick="answerQuiz(this, ${i})">${escapeHtml(c[meaningKey] || '—')}</button>`).join('')}
        </div>
        <div id="quiz-feedback"></div>
      </div>
    </div>`;
  quizState.answered = false;
  quizState.currentItem = item;
}

function answerQuiz(btn, choiceIdx) {
  if (quizState.answered) return;
  quizState.answered = true;
  const isCorrect = btn.dataset.correct === 'true';
  const item = quizState.currentItem;
  if (isCorrect) quizState.score++;

  document.querySelectorAll('#quiz-choices .quiz-choice').forEach(b => {
    b.disabled = true;
    if (b.dataset.correct === 'true') b.classList.add('correct');
    else if (b === btn) b.classList.add('wrong');
  });

  const meaningKey = quizConfig.direction;
  const otherKey = meaningKey === 'tr' ? 'en' : 'tr';
  const fb = document.getElementById('quiz-feedback');
  fb.innerHTML = `
    <div class="quiz-source">
      <strong>${escapeHtml(item.ar)}</strong> — ${escapeHtml(item[meaningKey] || '')}
      ${item[otherKey] ? ` <span style="opacity:0.7">· ${escapeHtml(item[otherKey])}</span>` : ''}
      <br><span style="opacity:0.7">${t('quizSource')}: ${escapeHtml(item.source || '—')}</span>
    </div>
    <div class="q-actions" style="margin-top:14px">
      <span class="spacer"></span>
      <button class="btn-primary" onclick="nextQuiz()">${quizState.idx === quizState.items.length - 1 ? t('finishPractice') : t('nextQuestion')}</button>
    </div>`;
}

function nextQuiz() {
  quizState.idx++;
  if (quizState.idx >= quizState.items.length) {
    showQuizScore();
  } else {
    renderQuizQuestion();
    document.getElementById('main').scrollTop = 0;
  }
}

function showQuizScore() {
  const { score, items } = quizState;
  const ref = currentView.ref;
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="topic-header">
      <h2>${ref.title[lang]}</h2>
    </div>
    <div class="section">
      <div class="score-card">
        <div class="score-num">${score} / ${items.length}</div>
        <div class="score-label">${t('quizCorrect')}</div>
        <p style="color:var(--muted);margin-bottom:24px;font-size:0.9rem">${t('practiceComplete')}</p>
        <div class="score-actions">
          <button class="btn-secondary" onclick="renderQuizSetup(currentView.ref)">${t('backToTopic')}</button>
          <button class="btn-primary" onclick="startQuiz()">${t('tryAgain')}</button>
        </div>
      </div>
    </div>`;
}

// ─── Learn Deep ───────────────────────────────────────────────────────────────

let lessonsIndexCache = null;
let ldState = { level: '', week: '', conceptIdx: '' };
let ldLastResult = null;

async function loadLessonsIndex() {
  if (lessonsIndexCache) return lessonsIndexCache;
  const res = await fetch('/lessons_index.json');
  if (!res.ok) throw new Error('lessons_index.json not available');
  lessonsIndexCache = await res.json();
  return lessonsIndexCache;
}

function renderLearnDeep(ref) {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="topic-header">
      <h2>${ref.title[lang]}</h2>
      <p>${ref.desc[lang]}</p>
    </div>
    <div class="section">
      <div class="ld-picker">
        <div class="ld-picker-field">
          <label>${t('ldLevel')}</label>
          <select id="ld-level" onchange="onLdLevelChange()">
            <option value="">—</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>
        <div class="ld-picker-field" style="flex: 2;">
          <label>${t('ldLesson')}</label>
          <select id="ld-week" onchange="onLdWeekChange()" disabled><option value="">—</option></select>
        </div>
        <div class="ld-picker-field" style="flex: 2;">
          <label>${t('ldConcept')}</label>
          <select id="ld-concept" onchange="onLdConceptChange()" disabled><option value="">—</option></select>
        </div>
        <div class="ld-picker-field" style="flex: 0; min-width: 110px;">
          <label>&nbsp;</label>
          <button class="btn-primary" id="ld-go" onclick="exploreConcept()" disabled style="padding:9px 18px;">${t('ldExplore')}</button>
        </div>
      </div>
      <div id="ld-result-container">
        ${ldLastResult ? renderLdResult(ldLastResult) : `<div class="ld-empty">${t('ldPickFirst')}</div>`}
      </div>
    </div>`;

  // Re-apply previous selections if returning to this view
  loadLessonsIndex().then(() => {
    if (ldState.level) {
      document.getElementById('ld-level').value = ldState.level;
      onLdLevelChange();
      if (ldState.week) {
        document.getElementById('ld-week').value = ldState.week;
        onLdWeekChange();
        if (ldState.conceptIdx !== '') {
          document.getElementById('ld-concept').value = ldState.conceptIdx;
          onLdConceptChange();
        }
      }
    }
  }).catch(err => {
    document.getElementById('ld-result-container').innerHTML =
      `<div class="feedback-box error">Failed to load lessons index: ${escapeHtml(err.message)}</div>`;
  });
}

function onLdLevelChange() {
  const lvl = document.getElementById('ld-level').value;
  ldState.level = lvl;
  ldState.week = '';
  ldState.conceptIdx = '';
  const weekSel = document.getElementById('ld-week');
  const conceptSel = document.getElementById('ld-concept');
  conceptSel.disabled = true;
  conceptSel.innerHTML = '<option value="">—</option>';
  document.getElementById('ld-go').disabled = true;
  if (!lvl || !lessonsIndexCache) {
    weekSel.disabled = true;
    weekSel.innerHTML = '<option value="">—</option>';
    return;
  }
  const opts = ['<option value="">—</option>'];
  for (const [key, lesson] of Object.entries(lessonsIndexCache)) {
    if (String(lesson.level) === String(lvl)) {
      const title = lesson.verified_title?.[lang] || lesson.verified_title?.en || key;
      opts.push(`<option value="${lesson.week}">W${lesson.week} — ${escapeHtml(title)}</option>`);
    }
  }
  weekSel.innerHTML = opts.join('');
  weekSel.disabled = false;
}

function onLdWeekChange() {
  const lvl = ldState.level;
  const week = document.getElementById('ld-week').value;
  ldState.week = week;
  ldState.conceptIdx = '';
  const conceptSel = document.getElementById('ld-concept');
  document.getElementById('ld-go').disabled = true;
  if (!week || !lessonsIndexCache) {
    conceptSel.disabled = true;
    conceptSel.innerHTML = '<option value="">—</option>';
    return;
  }
  const lesson = lessonsIndexCache[`L${lvl}W${week}`];
  if (!lesson) {
    conceptSel.disabled = true;
    return;
  }
  const opts = ['<option value="">—</option>'];
  (lesson.concepts || []).forEach((c, i) => {
    const name = c.name?.[lang] || c.name?.en || `Concept ${i + 1}`;
    opts.push(`<option value="${i}">${escapeHtml(name)}</option>`);
  });
  conceptSel.innerHTML = opts.join('');
  conceptSel.disabled = false;
}

function onLdConceptChange() {
  ldState.conceptIdx = document.getElementById('ld-concept').value;
  document.getElementById('ld-go').disabled = ldState.conceptIdx === '';
}

async function exploreConcept() {
  const { level, week, conceptIdx } = ldState;
  if (level === '' || week === '' || conceptIdx === '') return;

  const btn = document.getElementById('ld-go');
  const container = document.getElementById('ld-result-container');
  btn.disabled = true;
  const origLabel = btn.textContent;
  btn.textContent = t('ldLoading');
  container.innerHTML = `<div class="ld-empty">${t('ldLoading')} <span class="spinner"></span></div>`;

  try {
    const res = await fetch('/api/learn-deep', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        level: parseInt(level),
        week: parseInt(week),
        concept_index: parseInt(conceptIdx),
        language: lang,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    ldLastResult = data;
    container.innerHTML = renderLdResult(data);
  } catch (err) {
    container.innerHTML = `<div class="feedback-box error" style="white-space:pre-wrap">${linkify(escapeHtml(err.message))}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = origLabel;
  }
}

function renderLdResult(data) {
  const pdfLink = data.pdf_path
    ? `<a href="/pdfs/${encodeURI(data.pdf_path)}" target="_blank" rel="noopener">📄 ${t('ldOpenLessonPdf')}</a>`
    : '';
  const lessonTag = data.lesson_id
    ? `<div class="ld-lesson-tag">${escapeHtml(data.lesson_id)} — ${escapeHtml(data.lesson_title || '')} ${pdfLink ? '· ' + pdfLink : ''}</div>`
    : '';

  const rules = (data.rules || []).map(r => `<li>${escapeHtml(r)}</li>`).join('');
  const examples = (data.examples || []).map(ex => `
    <div class="ld-example">
      <div class="ld-example-arabic" dir="rtl">${escapeHtml(ex.arabic || '')}</div>
      <div class="ld-example-trans">${t('ldTranslation')}: ${escapeHtml(ex.translation || '')}</div>
      <div class="ld-example-walk"><strong>${t('ldWalkthrough')}:</strong> ${escapeHtml(ex.walkthrough || '')}</div>
    </div>`).join('');
  const mistakes = (data.common_mistakes || []).map(m => `<li>${escapeHtml(m)}</li>`).join('');

  return `
    <div class="ld-result">
      <div class="ld-title-row">
        <h2>${escapeHtml(data.title || '')}</h2>
        ${data.arabic_name ? `<span class="ld-arabic">${escapeHtml(data.arabic_name)}</span>` : ''}
      </div>
      ${lessonTag}
      ${data.overview ? `<div class="ld-section"><h3>${t('ldOverview')}</h3><div class="ld-overview">${escapeHtml(data.overview)}</div></div>` : ''}
      ${rules ? `<div class="ld-section"><h3>${t('ldRules')}</h3><ul class="ld-rules">${rules}</ul></div>` : ''}
      ${examples ? `<div class="ld-section"><h3>${t('ldExamples')}</h3>${examples}</div>` : ''}
      ${mistakes ? `<div class="ld-section"><h3>${t('ldCommonMistakes')}</h3><ul class="ld-mistakes">${mistakes}</ul></div>` : ''}
    </div>`;
}

// ─── Self-Check Verse Analysis ────────────────────────────────────────────────

let scState = { surah: '', ayah: '' };
let scWords = [];          // [{arabic, meaning, role, notes}] — user's filled answers
let scLastResult = null;
let scComplexity = localStorage.getItem('sc_complexity') || 'simple';   // 'simple' | 'complex'

function renderSelfCheck(ref) {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="topic-header">
      <h2>${ref.title[lang]}</h2>
      <p>${ref.desc[lang]}</p>
    </div>
    <div class="section">
      <div class="irab-picker">
        <div class="irab-picker-field">
          <label>${t('irabPickSurah')}</label>
          <select id="sc-surah" onchange="onScSurahChange()" disabled>
            <option value="">${t('irabPickLoading')}</option>
          </select>
        </div>
        <div class="irab-picker-field" style="max-width: 130px">
          <label>${t('irabPickAyah')}</label>
          <select id="sc-ayah" disabled><option value="">—</option></select>

          <label>&nbsp;</label>
          <div style="display:flex; gap:6px;">

            <button class="btn-secondary" id="sc-next" onclick="scStepVerse(1)" disabled

        <div class="irab-actions" style="flex-wrap: wrap; gap: 10px;">
          <button class="btn-secondary" onclick="scClear()">${t('irabClear')}</button>
          <span class="spacer"></span>
