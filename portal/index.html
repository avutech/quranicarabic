let feedbackType = 'bug';
let feedbackScreenshot = null;  // data URL string or null

function openFeedbackModal() {
  feedbackType = 'bug';
  feedbackScreenshot = null;
  const root = document.getElementById('feedback-modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeFeedbackModal()">
      <div class="modal-card" id="fb-card">
        <h3>${t('fbTitle')}</h3>
        <p class="subtitle">${t('fbSubtitle')}</p>

        <div class="modal-field">
          <label>${t('fbType')}</label>
          <div class="modal-type-toggle">
            <button class="modal-type-btn active" id="fb-type-bug" onclick="setFeedbackType('bug')">${t('fbBug')}</button>
            <button class="modal-type-btn" id="fb-type-enh" onclick="setFeedbackType('enhancement')">${t('fbEnhancement')}</button>
          </div>
        </div>

        <div class="modal-field">
          <label>${t('fbTitleField')}</label>
          <input type="text" id="fb-title" placeholder="${t('fbTitleBugPlaceholder')}" />
        </div>

        <div class="modal-field">
          <label>${t('fbDescField')}</label>
          <textarea id="fb-desc" placeholder="${t('fbDescPlaceholder')}"></textarea>
        </div>

        <div class="modal-field">
          <label>${t('fbScreenshot')}</label>
          <div class="modal-dropzone" id="fb-dropzone" onclick="document.getElementById('fb-file').click()">
            ${t('fbScreenshotHint')}
          </div>
          <input type="file" id="fb-file" accept="image/*" style="display:none" onchange="onFeedbackFile(event.target.files[0])" />
          <div id="fb-thumb"></div>
        </div>

        <div id="fb-error" style="color:#991b1b;font-size:0.85rem;margin-top:6px"></div>

        <div class="modal-actions">
          <button class="btn-secondary" onclick="closeFeedbackModal()">${t('fbCancel')}</button>
          <button class="btn-primary" id="fb-submit-btn" onclick="submitFeedback()">${t('fbSubmit')}</button>
        </div>
      </div>
    </div>`;

  setTimeout(() => document.getElementById('fb-title')?.focus(), 50);
  setupFeedbackDnD();
}

function setupFeedbackDnD() {
  const dz = document.getElementById('fb-dropzone');
  if (!dz) return;
  ['dragenter', 'dragover'].forEach(evt =>
    dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.add('dragging'); }));
  ['dragleave', 'drop'].forEach(evt =>
    dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.remove('dragging'); }));
  dz.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) onFeedbackFile(file);
  });
  // Paste image from clipboard while modal is open
  document.addEventListener('paste', handleFeedbackPaste);
}

function handleFeedbackPaste(e) {
  if (!document.getElementById('fb-card')) {
    document.removeEventListener('paste', handleFeedbackPaste);
    return;
  }
  const items = (e.clipboardData || {}).items || [];
  for (const it of items) {
    if (it.type && it.type.startsWith('image/')) {
      const file = it.getAsFile();
      if (file) { onFeedbackFile(file); break; }
    }
  }
}

function onFeedbackFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  // Resize/compress if larger than ~1MB so the GitHub upload is reasonable
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1600;
      let { width, height } = img;
      if (width > MAX || height > MAX) {
        const scale = MAX / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      feedbackScreenshot = canvas.toDataURL('image/png');
      renderFeedbackThumb();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderFeedbackThumb() {
  const t_el = document.getElementById('fb-thumb');
  if (!t_el) return;
  if (!feedbackScreenshot) { t_el.innerHTML = ''; return; }
  t_el.innerHTML = `
    <div class="modal-thumb-wrap">
      <img class="modal-thumb" src="${feedbackScreenshot}" />
      <button class="modal-thumb-remove" onclick="removeFeedbackScreenshot()" title="${t('fbScreenshotRemove')}">×</button>
    </div>`;
}

function removeFeedbackScreenshot() {
  feedbackScreenshot = null;
  document.getElementById('fb-file').value = '';
  renderFeedbackThumb();
}

function closeFeedbackModal() {
  document.getElementById('feedback-modal-root').innerHTML = '';
  feedbackScreenshot = null;
  document.removeEventListener('paste', handleFeedbackPaste);
}

function setFeedbackType(type) {
  feedbackType = type;
  document.getElementById('fb-type-bug').classList.toggle('active', type === 'bug');
  document.getElementById('fb-type-enh').classList.toggle('active', type === 'enhancement');
  const titleInput = document.getElementById('fb-title');
  if (titleInput && !titleInput.value) {
    titleInput.placeholder = type === 'bug' ? t('fbTitleBugPlaceholder') : t('fbTitleEnhPlaceholder');
  }
}

async function submitFeedback() {
  const titleField = document.getElementById('fb-title');
  const descField = document.getElementById('fb-desc');
  const errEl = document.getElementById('fb-error');
  const submitBtn = document.getElementById('fb-submit-btn');
  const title = titleField.value.trim();
  const desc = descField.value.trim();
  if (!title) { titleField.focus(); return; }

  errEl.textContent = '';
  submitBtn.disabled = true;
  submitBtn.textContent = t('fbSubmitting');

  // Build context-rich body
  const ctx = [];
  if (currentView) {
    if (currentView.type === 'lesson' && currentView.lesson) {
      ctx.push(`- Page: Lesson "${currentView.level.title.en}" / Week ${currentView.lesson.week} — ${currentView.lesson.title.en}`);
    } else if (currentView.type === 'level' && currentView.level) {
      ctx.push(`- Page: Level overview — ${currentView.level.title.en}`);
    } else if (currentView.type === 'reference' && currentView.ref) {
      ctx.push(`- Page: Reference — ${currentView.ref.title.en}`);
    }
  } else {
    ctx.push('- Page: Welcome screen');
  }
  ctx.push(`- UI language: ${lang.toUpperCase()}`);
  ctx.push(`- Browser: ${navigator.userAgent.slice(0, 120)}`);
  ctx.push(`- Time: ${new Date().toISOString()}`);

  const body = (feedbackType === 'bug'
    ? `**What happened:**\n${desc || '(no description)'}\n\n**Context (auto-captured):**\n${ctx.join('\n')}`
    : `**What you'd like:**\n${desc || '(no description)'}\n\n**Context (auto-captured):**\n${ctx.join('\n')}`
  );

  try {
    const res = await fetch('/api/feedback-issue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: feedbackType,
        title,
        body,
        screenshot: feedbackScreenshot,
      }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);

    // Show success card inside the modal
    document.getElementById('fb-card').innerHTML = `
      <h3>${t('fbTitle')}</h3>
      <div class="modal-success">
        ${t('fbSuccess')} <strong>#${data.issue_number}</strong>.
      </div>
      <div class="modal-actions">
        <a href="${data.issue_url}" target="_blank" rel="noopener" class="btn-secondary" style="text-decoration:none">${t('fbViewIssue')}</a>
        <button class="btn-primary" onclick="closeFeedbackModal()">OK</button>
      </div>`;
  } catch (err) {
    errEl.textContent = `${t('fbErrorPrefix')} ${err.message}`;
    submitBtn.disabled = false;
    submitBtn.textContent = t('fbSubmit');
  }
}

function refreshFeedbackLabel() {
  const el = document.getElementById('feedback-fab-label');
  if (el) el.textContent = t('fbButton');
}

// ─── Utils ────────────────────────────────────────────────────────────────────

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/\n/g, '<br>');
}

// ─── User session (auth) ──────────────────────────────────────────────────────

let CURRENT_USER = null;   // { id, email, role, unlocks: [...] } when logged in
let EXTRA_LEVELS = [];     // [{level_num, name, week_count, built_in:false}, ...] from /api/levels

async function fetchAllLevels() {
  try {
    const res = await fetch('/api/levels', { credentials: 'same-origin' });
    if (!res.ok) return;
    const data = await res.json();
    EXTRA_LEVELS = (data.levels || []).filter(l => !l.built_in);
  } catch {}
}

// Synthetic LEVELS for extra (admin-defined) levels — empty lesson shells.
function extraLevelToObj(lvl) {
  return {
    id: `level${lvl.level_num}`,
    levelNum: lvl.level_num,
    title: {
      en: lvl.name,
      tr: lvl.name_tr || lvl.name,
      ar: lvl.name_ar || lvl.name,
    },
    desc: { en: '', tr: '', ar: '' },
    extraLevel: true,
    weekCount: lvl.week_count,
    lessons: Array.from({ length: lvl.week_count }, (_, i) => ({
      week: i + 1,
      pdf: null,
      title: { en: `Week ${i + 1}`, tr: `Hafta ${i + 1}`, ar: `الأسبوع ${i + 1}` },
      questions: [],
    })),
  };
}

function getDisplayLevels() {
  return [...LEVELS, ...EXTRA_LEVELS.map(extraLevelToObj)];
}

// Modules (REFERENCE_TOPICS feature areas) an admin has deactivated. A
// deactivated module is hidden from the sidebar and cannot be opened.
let INACTIVE_MODULES = new Set();

function isModuleActive(id) { return !INACTIVE_MODULES.has(id); }

async function fetchModuleStates() {
  try {
    const res = await fetch('/api/modules', { credentials: 'same-origin' });
    if (!res.ok) return;
    const data = await res.json();
    INACTIVE_MODULES = new Set(data.inactive || []);
  } catch { /* on failure, leave all modules visible */ }
}

async function fetchCurrentUser() {
  try {
    const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
    if (!res.ok) return null;
    const data = await res.json();
    CURRENT_USER = data.authenticated ? data.user : null;
    return CURRENT_USER;
  } catch {
    CURRENT_USER = null;
    return null;
  }
}

function renderUserChip() {
  const el = document.getElementById('user-chip');
  if (!el) return;
  if (!CURRENT_USER) { el.innerHTML = ''; return; }
  const labels = {
    tr: { logout: 'Çıkış', admin: 'Yönetici' },
    en: { logout: 'Logout', admin: 'Admin' },
    ar: { logout: 'خروج',  admin: 'إدارة' },

  el.innerHTML = `
    <span class="user-email">${escapeHtml(CURRENT_USER.email)}</span>

function isLessonUnlocked(level, lesson) {
  if (!CURRENT_USER) return false;
  if (CURRENT_USER.role === 'admin') return true;
  const levelNum = level.levelNum || (LEVELS.indexOf(level) + 1);
  return CURRENT_USER.unlocks.includes(`L${levelNum}W${lesson.week}`);
}

async function attemptLogin() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    if (!res.ok) {
      renderLoginScreen('err');
      return;
    }
    // Refresh: simplest way to re-init the SPA with the new session
    window.location.reload();
  } catch {
    renderLoginScreen('err');
  }
}

async function logout() {
  try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch {}
  window.location.reload();
}

function _weekCountFor(levelNum) {
  if (levelNum <= 3) return 14;
  const found = EXTRA_LEVELS.find(l => l.level_num === levelNum);
  return found ? found.week_count : 14;
}


// Set of classroom IDs whose student cards are currently expanded.
const expandedClassrooms = new Set();

function adminToggleClassroom(cid) {
  if (expandedClassrooms.has(cid)) expandedClassrooms.delete(cid);
  else expandedClassrooms.add(cid);
  openAdminPanel();
}

async function openAdminPanel() {
  if (!CURRENT_USER || CURRENT_USER.role !== 'admin') return;
  currentView = { type: 'admin' };   // mark so renderSidebar deselects everything
  expandedLevel = null;
  renderSidebar();
  const main = document.getElementById('main');
  main.innerHTML = `<div class="topic-header"><h2>${t('admHeader')}</h2><p>${t('quizLoading') || '…'}</p></div>`;
  try {
    const [u, c, lvl, m] = await Promise.all([
      fetch('/api/admin/users', { credentials: 'same-origin' }).then(r => r.json()),
      fetch('/api/admin/classrooms', { credentials: 'same-origin' }).then(r => r.json()),
      fetch('/api/levels', { credentials: 'same-origin' }).then(r => r.json()),
      fetch('/api/admin/modules', { credentials: 'same-origin' }).then(r => r.json()),
    ]);
    renderAdminPanel(u.users, u.all_lessons, c.classrooms, (lvl.levels || []), (m && m.states) || {});
  } catch (e) {
    main.innerHTML = `<div class="topic-header"><h2>Admin</h2><p style="color:#991b1b">Error: ${escapeHtml(e.message)}</p></div>`;
  }
}

function renderAdminPanel(users, allLessons, classrooms, allLevels, moduleStates) {
  const main = document.getElementById('main');
  classrooms = classrooms || [];
  allLevels = allLevels || [];
  moduleStates = moduleStates || {};

  // Module activation cards — one per REFERENCE_TOPICS entry. A module is
  // active unless an explicit `false` state has been stored for it.
  const moduleCards = REFERENCE_TOPICS.map(m => {
    const active = moduleStates[m.id] !== false;
    return `
      <div class="ad-module ${active ? '' : 'off'}">
        <div class="ad-module-icon">${m.icon}</div>
        <div class="ad-module-info">
          <div class="ad-module-name">${escapeHtml(m.title[lang] || m.title.en)}</div>
          <div class="ad-module-tag">${active ? t('admModuleActiveTag') : t('admModuleInactiveTag')}</div>
        </div>
        <label class="ad-switch" title="${active ? t('admModuleOn') : t('admModuleOff')}">
          <input type="checkbox" ${active ? 'checked' : ''}
                 onchange="adminToggleModule('${m.id}', this.checked, this)" />
          <span class="ad-switch-track"><span class="ad-switch-thumb"></span></span>
        </label>
      </div>`;
  }).join('');
  // Group lesson IDs by level for compact rendering — supports any level number
  const byLevel = {};
  for (const l of allLevels) byLevel[l.level_num] = [];
  for (const lid of allLessons) {
    const m = lid.match(/^L(\d+)W(\d+)$/);
    if (m && byLevel[+m[1]]) byLevel[+m[1]].push(+m[2]);
  }
  const levelOrder = allLevels.map(l => l.level_num);

  // ── Classroom cards ──
  const renderUnlockGrid = (scope, ownerId, unlockSet, toggleFn, levelAllFn) =>
    levelOrder.map(L => {
      const cells = byLevel[L].map(W => {
        const id = `L${L}W${W}`;
        const checked = unlockSet.has(id);
        return `<label class="ad-cell ${checked ? 'on' : ''}"><input type="checkbox" data-${scope}="${ownerId}" data-lid="${id}" ${checked ? 'checked' : ''} onchange="${toggleFn}(${ownerId})"/><span>${W}</span></label>`;
      }).join('');
      return `<div class="ad-level"><div class="ad-level-head">L${L}<button class="ad-level-all" onclick="${levelAllFn}(${ownerId}, ${L})">${t('admUnlockAll')}</button></div><div class="ad-cells">${cells}</div></div>`;
    }).join('');

  // (chip strip is no longer needed — members render as full cards inside their classroom)

  // ── User rows (with classroom dropdown) ──
  const classroomOptions = (selected) =>
    `<option value="">${escapeHtml(t('admNoClassroom'))}</option>` +
    classrooms.map(c => `<option value="${c.id}" ${selected === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('');

  // Map classroom_id → its unlock set so we can mark inheritance per user.
  const classroomUnlockSet = {};
  for (const c of classrooms) classroomUnlockSet[c.id] = new Set(c.unlocks);

  function buildUserRow(u) {
    // Visual rule:
    //   - covered by classroom → striped (inherit)
    //   - personal extra NOT in classroom → solid (on)
    //   - else → empty
    const personalSet = new Set(u.personal_unlocks);
    const inheritedSet = u.classroom_id && classroomUnlockSet[u.classroom_id]
      ? classroomUnlockSet[u.classroom_id]
      : new Set();
    const grids = levelOrder.map(L => {
      const cells = byLevel[L].map(W => {
        const id = `L${L}W${W}`;
        const personalChecked = personalSet.has(id);
        const inherited = inheritedSet.has(id);
        // Striped wins over solid: if classroom covers it, the personal toggle is redundant
        const cls = inherited ? 'inherit' : (personalChecked ? 'on' : '');
        const title = inherited
          ? (personalChecked ? t('admInheritedRedundant') : t('admInherited'))
          : (personalChecked ? t('admPersonalExtra') : '');
        return `<label class="ad-cell ${cls}" title="${title}"><input type="checkbox" data-uid="${u.id}" data-lid="${id}" ${personalChecked ? 'checked' : ''} onchange="adminToggleUnlock(${u.id})"/><span>${W}</span></label>`;
      }).join('');
      return `<div class="ad-level"><div class="ad-level-head">L${L}<button class="ad-level-all" onclick="adminUnlockLevel(${u.id}, ${L})">${t('admUnlockAll')}</button></div><div class="ad-cells">${cells}</div></div>`;
    }).join('');

    const isSelf = CURRENT_USER && CURRENT_USER.id === u.id;
    return `
      <div class="ad-user">
        <div class="ad-user-head">
          <div>
            <span class="ad-email">${escapeHtml(u.display_name)}</span>
            ${u.display_name !== u.email ? `<span class="ad-meta">&lt;${escapeHtml(u.email)}&gt;</span>` : ''}
            <span class="ad-role role-${u.role}">${u.role}</span>
            ${u.last_login ? `<span class="ad-meta">${t('admMetaLast')} ${escapeHtml(u.last_login.slice(0,16).replace('T',' '))}</span>` : `<span class="ad-meta">${escapeHtml(t('admMetaNever'))}</span>`}
            <button class="btn-secondary" onclick="adminEditName(${u.id}, '${(u.first_name || '').replace(/'/g, '&#39;')}', '${(u.last_name || '').replace(/'/g, '&#39;')}')" style="padding:2px 8px; font-size:0.72rem; margin-left:6px;">✏ name</button>
          </div>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <label style="font-size:0.74rem;color:var(--muted);">${t('admRole')}:</label>
            <select onchange="adminSetRole(${u.id}, this.value)" ${isSelf ? `disabled title="${t('admCannotChangeOwnRole')}"` : ''} style="padding:5px 10px; border:1.5px solid var(--border); border-radius:6px; font-family:inherit; font-size:0.82rem;">
              <option value="user" ${u.role === 'user' ? 'selected' : ''}>${t('admRoleUser')}</option>
              <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>${t('admRoleAdmin')}</option>
            </select>
            <label style="font-size:0.74rem;color:var(--muted);">${t('admClassroom')}:</label>
            <select onchange="adminAssignClassroom(${u.id}, this.value)" style="padding:5px 10px; border:1.5px solid var(--border); border-radius:6px; font-family:inherit; font-size:0.82rem;">${classroomOptions(u.classroom_id)}</select>
            <button class="btn-secondary" onclick="adminResetPassword(${u.id}, '${escapeHtml(u.email).replace(/'/g, '&#39;')}')" style="padding:5px 12px; font-size:0.78rem;">${t('admResetPw')}</button>
            ${isSelf ? '' : `<button class="btn-secondary" onclick="adminDeleteUser(${u.id}, '${escapeHtml(u.email).replace(/'/g, '&#39;')}')" style="padding:5px 12px; font-size:0.78rem; color:#991b1b; border-color:#fecaca;">${t('admDelete')}</button>`}
          </div>
        </div>
        <div class="ad-hint">${escapeHtml(t('admStudentHint'))}</div>
        <div class="ad-grids">${grids}</div>
      </div>`;
  }

  // ── Group users for the new layout ──
  const adminUsers = users.filter(u => u.role === 'admin');
  const studentsByClassroom = {};
  const unassignedStudents = [];

function adminSwitchCreateTab(which) {
  ['user','classroom','level'].forEach(k => {
    const tab = document.getElementById(`ad-tab-${k}`);
    const body = document.getElementById(`ad-tab-body-${k}`);
    if (tab) tab.classList.toggle('active', k === which);
    if (body) body.style.display = (k === which) ? '' : 'none';
  });
}

async function adminCreateLevel() {
  const name = document.getElementById('ad-new-level-name').value.trim();
  const name_tr = document.getElementById('ad-new-level-name-tr').value.trim();
  const name_ar = document.getElementById('ad-new-level-name-ar').value.trim();
  const weeks = parseInt(document.getElementById('ad-new-level-weeks').value) || 14;
  if (!name) { alert(t('admLevelName') || 'Level name (EN) is required'); return; }
  const res = await fetch('/api/admin/levels', {
    method: 'POST', credentials: 'same-origin',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name, name_tr, name_ar, week_count: weeks }),
  });
  const data = await res.json();
  if (!res.ok) { alert((t('admErrCreate') || 'Error:') + ' ' + (data.error || res.status)); return; }
  ['ad-new-level-name','ad-new-level-name-tr','ad-new-level-name-ar'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('ad-new-level-weeks').value = '14';
  await fetchAllLevels();
  openAdminPanel();
}
async function adminRenameLevel(levelNum, currentName, currentTr, currentAr) {
  const en = prompt(t('admPromptNewName') || 'Name (EN):', currentName || '');
  if (en === null) return;
  const tr = prompt(t('admPromptNewNameTr') || 'Name (TR, optional):', currentTr || '');
  if (tr === null) return;
  const ar = prompt(t('admPromptNewNameAr') || 'Name (AR, optional):', currentAr || '');
  if (ar === null) return;
  const body = { name: en.trim(), name_tr: tr.trim(), name_ar: ar.trim() };
  const res = await fetch(`/api/admin/levels/${levelNum}`, {
    method: 'PATCH', credentials: 'same-origin',
    headers: {'Content-Type':'application/json'}, body: JSON.stringify(body),
  });
  if (res.ok) { await fetchAllLevels(); openAdminPanel(); }
}
async function adminEditLevelWeeks(levelNum, currentWeeks) {
  const ws = prompt(t('admEditWeeksPrompt') || 'Weeks (1-52):', String(currentWeeks));
  if (!ws) return;
  const n = parseInt(ws);
  if (!(n >= 1 && n <= 52)) { alert('1-52'); return; }
  const res = await fetch(`/api/admin/levels/${levelNum}`, {
    method: 'PATCH', credentials: 'same-origin',
    headers: {'Content-Type':'application/json'}, body: JSON.stringify({ week_count: n }),
  });
  if (res.ok) { await fetchAllLevels(); openAdminPanel(); }
}
async function adminDeleteLevel(levelNum, name) {
  if (!confirm((t('admConfirmDeleteLevel') || 'Delete level') + ` "${name}"? ` + (t('admDeleteLevelTail') || 'All its resources and unlocks will be removed.'))) return;
  const res = await fetch(`/api/admin/levels/${levelNum}`, { method: 'DELETE', credentials: 'same-origin' });
  if (res.ok) { await fetchAllLevels(); openAdminPanel(); }
}

async function adminToggleModule(moduleId, active, inputEl) {
  const res = await fetch('/api/admin/modules', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ module_id: moduleId, active }),
  });
  if (!res.ok) {
    alert(t('admErrFailed') + ' ' + res.status);
    if (inputEl) inputEl.checked = !active;   // revert the toggle
    return;
  }
  // Update the card in place + keep the live sidebar state in sync.
  const card = inputEl ? inputEl.closest('.ad-module') : null;
  if (card) {
    card.classList.toggle('off', !active);
    const tag = card.querySelector('.ad-module-tag');
    if (tag) tag.textContent = active ? t('admModuleActiveTag') : t('admModuleInactiveTag');
  }
  if (active) INACTIVE_MODULES.delete(moduleId);
  else INACTIVE_MODULES.add(moduleId);
  renderSidebar();
}

async function adminToggleUnlock(userId) {
  const checks = document.querySelectorAll(`.ad-cell input[data-uid="${userId}"]`);
  const ids = [...checks].filter(c => c.checked).map(c => c.dataset.lid);
  const res = await fetch(`/api/admin/users/${userId}/unlocks`, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lesson_ids: ids }),
  });
  if (res.ok) {
    // Update visuals: toggle .on class on each cell
    checks.forEach(c => c.closest('.ad-cell').classList.toggle('on', c.checked));
  }
}

async function adminUnlockLevel(userId, level) {
  const checks = document.querySelectorAll(`.ad-cell input[data-uid="${userId}"]`);
  // Collect existing checked + add all 14 of this level
  const ids = new Set([...checks].filter(c => c.checked).map(c => c.dataset.lid));
  for (let w = 1; w <= _weekCountFor(level); w++) ids.add(`L${level}W${w}`);
  const res = await fetch(`/api/admin/users/${userId}/unlocks`, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lesson_ids: [...ids] }),
  });
  if (res.ok) openAdminPanel();
}

  const role = document.getElementById('ad-new-role').value;
  const first_name = document.getElementById('ad-new-first').value.trim();
  const last_name = document.getElementById('ad-new-last').value.trim();
  const classroomVal = document.getElementById('ad-new-classroom').value;
  const classroom_id = classroomVal ? parseInt(classroomVal) : null;
  if (!email || !password) { alert(t('admErrEmailPw')); return; }
  const res = await fetch('/api/admin/users', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, role, first_name, last_name, classroom_id }),
  });
  const data = await res.json();
  if (!res.ok) { alert(t('admErrCreate') + ' ' + (data.error || res.status)); return; }
  ['ad-new-email','ad-new-password','ad-new-first','ad-new-last'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('ad-new-classroom').value = '';
  openAdminPanel();
}

async function adminEditName(userId, currentFirst, currentLast) {
  const f = prompt(t('admPromptFirst'), currentFirst);
  if (f === null) return;
  const l = prompt(t('admPromptLast'), currentLast);
  if (l === null) return;
  const res = await fetch(`/api/admin/users/${userId}/name`, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ first_name: f.trim(), last_name: l.trim() }),
  });
  if (res.ok) openAdminPanel(); else alert(t('admErrFailed') + ' ' + res.status);
}

async function adminDeleteUser(userId, email) {
  if (!confirm(t('admConfirmDeleteUser') + ' ' + email + t('admConfirmDeletePermanent'))) return;
  const res = await fetch(`/api/admin/users/${userId}`, { method: 'DELETE', credentials: 'same-origin' });
  if (res.ok) openAdminPanel();
  else alert(t('admErrFailed') + ' ' + res.status);
}

async function adminCreateClassroom() {
  const el = document.getElementById('ad-new-classroom-name');
  const name = el.value.trim();
  if (!name) { alert(t('admErrClassroomName')); return; }
  const res = await fetch('/api/admin/classrooms', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name }),
  });
  const data = await res.json();
  if (!res.ok) { alert(t('admErrCreate') + ' ' + (data.error || res.status)); return; }
  el.value = '';
  openAdminPanel();
}

// Inline classroom rename: clicking the ✏ pencil swaps the name for a text
// input. Enter or focus-loss saves; Escape cancels.
function adminStartRenameClassroom(cid) {
  const wrap = document.getElementById('cr-name-wrap-' + cid);
  if (!wrap || wrap.querySelector('input')) return;   // already editing
  const span = document.getElementById('cr-name-' + cid);
  const current = span ? span.dataset.name : '';
  wrap.innerHTML = `<input class="cr-name-input" type="text" value="${escapeHtml(current)}" data-cid="${cid}" data-orig="${escapeHtml(current)}" />`;
  const input = wrap.querySelector('input');
  input.focus();
  input.select();
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); adminCommitRenameClassroom(input); }
    else if (e.key === 'Escape') { e.preventDefault(); input.dataset.done = '1'; openAdminPanel(); }
  });
  input.addEventListener('blur', () => adminCommitRenameClassroom(input));
}

async function adminCommitRenameClassroom(input) {
  if (!input || input.dataset.done) return;   // run once (guards Enter+blur)
  input.dataset.done = '1';
  const cid = input.dataset.cid;
  const name = (input.value || '').trim();
  const original = input.dataset.orig;
  if (!name || name === original) { openAdminPanel(); return; }   // no change
  const res = await fetch(`/api/admin/classrooms/${cid}/rename`, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name }),
  });
  if (!res.ok) alert(t('admErrFailed') + ' ' + res.status);
  openAdminPanel();
}

async function adminDeleteClassroom(cid, name) {
  if (!confirm(t('admConfirmDeleteClassroom') + ' "' + name + '"' + t('admConfirmDeleteClassroomTail'))) return;
  const res = await fetch(`/api/admin/classrooms/${cid}`, { method: 'DELETE', credentials: 'same-origin' });
  if (res.ok) openAdminPanel(); else alert(t('admErrFailed') + ' ' + res.status);
}

async function adminToggleClassroomUnlock(cid) {
  const checks = document.querySelectorAll(`.ad-cell input[data-cid="${cid}"]`);
  const ids = [...checks].filter(c => c.checked).map(c => c.dataset.lid);
  const res = await fetch(`/api/admin/classrooms/${cid}/unlocks`, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lesson_ids: ids }),
  });
  if (res.ok) {
    checks.forEach(c => c.closest('.ad-cell').classList.toggle('on', c.checked));
    // Reload to update inherited indicators on user rows
    setTimeout(openAdminPanel, 250);
  }
}

async function adminUnlockClassroomLevel(cid, level) {
  const checks = document.querySelectorAll(`.ad-cell input[data-cid="${cid}"]`);
  const ids = new Set([...checks].filter(c => c.checked).map(c => c.dataset.lid));
  for (let w = 1; w <= _weekCountFor(level); w++) ids.add(`L${level}W${w}`);
  const res = await fetch(`/api/admin/classrooms/${cid}/unlocks`, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lesson_ids: [...ids] }),
  });
  if (res.ok) openAdminPanel();
}

async function adminSetRole(userId, role) {
  const res = await fetch(`/api/admin/users/${userId}/role`, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ role }),
  });
  const data = await res.json();
  if (res.ok) openAdminPanel();
  else { alert(t('admErrFailed') + ' ' + (data.error || res.status)); openAdminPanel(); }
}

async function adminAssignClassroom(userId, cidStr) {
  const cid = cidStr ? parseInt(cidStr) : null;
  const res = await fetch(`/api/admin/users/${userId}/classroom`, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ classroom_id: cid }),
  });
  if (res.ok) openAdminPanel(); else alert(t('admErrFailed') + ' ' + res.status);
}

async function adminResetPassword(userId, email) {
  const pw = prompt(t('admPromptNewPw') + ' ' + email + ':');
  if (!pw || pw.length < 6) { if (pw !== null) alert(t('admPwTooShort')); return; }
  const res = await fetch(`/api/admin/users/${userId}/password`, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw }),
  });
  if (res.ok) alert(t('admPwResetOk'));
  else alert(t('admErrFailed') + ' ' + res.status);
}

// ─── Init ─────────────────────────────────────────────────────────────────────

(async function bootstrap() {
  await fetchCurrentUser();
  if (!CURRENT_USER) {
    renderLoginScreen();
    return;
  }
  await Promise.all([
    fetchModuleStates(),
    fetchAllLevels(),   // populate EXTRA_LEVELS so sidebar can render dynamic levels
  ]);
  setLang(lang);   // applies the default language (TR) to body class, sidebar, welcome text, etc.

  // Keep the FAB clearance accurate as the viewport resizes.
  window.addEventListener('resize', () => {
    const f = document.getElementById('site-footer');
    if (f) document.documentElement.style.setProperty('--footer-h', f.offsetHeight + 'px');
  });
  ensureLecturesLoaded().then(() => {
    if (searchQuery.trim()) renderSearchResultsMain(searchQuery.trim());
  });
})();
