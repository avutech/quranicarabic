            <span style="font-size:0.78rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;">${t('scComplexity')}</span>
            <div class="complexity-toggle">
              <button id="sc-cmplx-simple" class="${scComplexity === 'simple' ? 'active' : ''}" onclick="scSetComplexity('simple')">${t('scComplexitySimple')}</button>
              <button id="sc-cmplx-complex" class="${scComplexity === 'complex' ? 'active' : ''}" onclick="scSetComplexity('complex')">${t('scComplexityComplex')}</button>
            </div>
          </div>
          <button class="btn-secondary" id="sc-fill" onclick="scSelfFill()">${t('scSelfFill')}</button>
          <button class="btn-primary" id="sc-go" onclick="scAnalyze()" disabled>${t('scAnalyze')}</button>
        </div>
      </div>

      <div id="sc-fill-area">${scLastResult ? renderScWordCards(scLastResult) : ''}</div>
      <div id="sc-result-area">${scLastResult ? renderScOverall(scLastResult) : ''}</div>
    </div>`;

  // Re-populate the surah dropdown (reuses cached chapters)
  scPopulateSurahDropdown();
}

async function scPopulateSurahDropdown() {
  const sel = document.getElementById('sc-surah');
  if (!sel) return;
  try {
    const chapters = await fetchChapters();
    const opts = ['<option value="">—</option>'];
    for (const c of chapters) {
      const tname = c.translated_name && c.translated_name.name ? ` — ${c.translated_name.name}` : '';
      opts.push(`<option value="${c.id}" data-verses="${c.verses_count}">${c.id}. ${escapeHtml(c.name_simple)}${escapeHtml(tname)}</option>`);
    }
    sel.innerHTML = opts.join('');
    sel.disabled = false;
    if (scState.surah) {
      sel.value = scState.surah;
      onScSurahChange();
      if (scState.ayah) {
        document.getElementById('sc-ayah').value = scState.ayah;
        document.getElementById('sc-load').disabled = false;
        scRefreshStepButtons();
      }
    }
  } catch (e) {
    sel.innerHTML = `<option value="">Failed to load: ${escapeHtml(e.message)}</option>`;
  }
}

function onScSurahChange() {
  const sSel = document.getElementById('sc-surah');
  const aSel = document.getElementById('sc-ayah');
  const loadBtn = document.getElementById('sc-load');
  scState.surah = sSel.value;
  scState.ayah = '';
  scRefreshStepButtons();
  if (!sSel.value) {
    aSel.disabled = true;
    aSel.innerHTML = '<option value="">—</option>';
    loadBtn.disabled = true;
    return;
  }
  const opt = sSel.options[sSel.selectedIndex];
  const versesCount = parseInt(opt.dataset.verses) || 0;
  const opts = ['<option value="">—</option>'];
  for (let i = 1; i <= versesCount; i++) opts.push(`<option value="${i}">${i}</option>`);
  aSel.innerHTML = opts.join('');
  aSel.disabled = false;
  aSel.onchange = () => {
    scState.ayah = aSel.value;
    loadBtn.disabled = !aSel.value;
    scRefreshStepButtons();
  };
}

function scRefreshStepButtons() {
  const prev = document.getElementById('sc-prev');
  const next = document.getElementById('sc-next');
  if (!prev || !next) return;
  const s = parseInt(scState.surah);
  const a = parseInt(scState.ayah);
  const has = !!(s && a);
  let dPrev = !has, dNext = !has;
  if (has) {
    if (s === 1 && a === 1) dPrev = true;
    if (quranChapters && s === quranChapters.length) {
      const last = quranChapters[quranChapters.length - 1];
      if (a >= (last.verses_count || 0)) dNext = true;
    }
  }
  prev.disabled = dPrev;
  next.disabled = dNext;
}

async function scLoadVerse() {
  const sSel = document.getElementById('sc-surah');
  const aSel = document.getElementById('sc-ayah');
  const loadBtn = document.getElementById('sc-load');
  if (!sSel.value || !aSel.value) return;
  loadBtn.disabled = true;
  loadBtn.textContent = t('irabPickLoading');
  try {
    const res = await fetch(`https://api.quran.com/api/v4/verses/by_key/${sSel.value}:${aSel.value}?fields=text_uthmani,text_imlaei`);
    const data = await res.json();
    const verseText = (data.verse && (data.verse.text_uthmani || data.verse.text_imlaei)) || '';
    if (!verseText) throw new Error('No verse text returned');
    document.getElementById('sc-input').value = verseText;
    document.getElementById('sc-fill-area').innerHTML = '';
    document.getElementById('sc-result-area').innerHTML = '';
    document.getElementById('sc-go').disabled = true;
    scWords = [];
    scLastResult = null;
  } catch (e) {
    document.getElementById('sc-result-area').innerHTML =
      `<div class="feedback-box error">Failed: ${escapeHtml(e.message)}</div>`;
  } finally {
    loadBtn.disabled = false;
    loadBtn.textContent = t('irabPickLoad');
  }
}

async function scStepVerse(direction) {
  if (!quranChapters) return;
  let s = parseInt(scState.surah);
  let a = parseInt(scState.ayah);
  if (!s || !a) return;
  if (direction > 0) {
    const cur = quranChapters.find(c => c.id === s);
    if (a < cur.verses_count) a += 1;
    else if (s < quranChapters.length) { s += 1; a = 1; }
    else return;
  } else {
    if (a > 1) a -= 1;
    else if (s > 1) { s -= 1; a = quranChapters.find(c => c.id === s).verses_count; }
    else return;
  }
  const sSel = document.getElementById('sc-surah');
  const aSel = document.getElementById('sc-ayah');
  if (parseInt(sSel.value) !== s) {
    sSel.value = String(s);
    onScSurahChange();
  }
  aSel.value = String(a);
  scState.ayah = String(a);
  document.getElementById('sc-load').disabled = false;
  scRefreshStepButtons();
  await scLoadVerse();
}

function scClear() {
  document.getElementById('sc-input').value = '';
  document.getElementById('sc-fill-area').innerHTML = '';
  document.getElementById('sc-result-area').innerHTML = '';
  document.getElementById('sc-go').disabled = true;
  scWords = [];
  scLastResult = null;
}

function scSetComplexity(mode) {
  scComplexity = mode;
  localStorage.setItem('sc_complexity', mode);
  const a = document.getElementById('sc-cmplx-simple');
  const b = document.getElementById('sc-cmplx-complex');
  if (a) a.classList.toggle('active', mode === 'simple');
  if (b) b.classList.toggle('active', mode === 'complex');
}

// Splits the verse on whitespace into "words" — same coarse split the user
// will fill out. Keeps Arabic punctuation attached. Treats the textarea as
// the source of truth so the user can edit the verse before splitting.
function scSplitVerse(verse) {
  // Strip Arabic verse-end markers and stray control chars
  const cleaned = verse.replace(/[​-‏⁠-⁯﻿]/g, '').trim();
  return cleaned.split(/\s+/).filter(w => w.length > 0);
}

function scSelfFill() {
  const verse = document.getElementById('sc-input').value.trim();
  if (!verse) {
    document.getElementById('sc-result-area').innerHTML =
      `<div class="feedback-box error">${t('scNeedVerse')}</div>`;
    return;
  }
  const tokens = scSplitVerse(verse);
  scWords = tokens.map(w => ({ arabic: w, meaning: '', role: '', notes: '' }));
  document.getElementById('sc-result-area').innerHTML = '';
  scLastResult = null;
  scRenderFillCards();
  document.getElementById('sc-go').disabled = false;
}

function scRenderFillCards() {
  const html = `
    <div class="sc-fill-grid">
      ${scWords.map((w, i) => `
        <div class="sc-fill-card">
          <div class="sc-fill-arabic">${escapeHtml(w.arabic)}</div>
          <div class="sc-fill-row">
            <label>${t('scYourMeaning')}</label>
            <input type="text" id="sc-meaning-${i}" value="${escapeHtml(w.meaning)}"
                   oninput="scWords[${i}].meaning = this.value" />
          </div>
          <div class="sc-fill-row">
            <label>${t('scYourRole')}</label>
            <input type="text" id="sc-role-${i}" value="${escapeHtml(w.role)}"
                   oninput="scWords[${i}].role = this.value" />
          </div>
          <div class="sc-fill-row">
            <label>${t('scYourNotes')}</label>
            <textarea id="sc-notes-${i}" rows="2"
                      oninput="scWords[${i}].notes = this.value">${escapeHtml(w.notes)}</textarea>
          </div>
        </div>
      `).join('')}
    </div>`;
  document.getElementById('sc-fill-area').innerHTML = html;
}

async function scAnalyze() {
  const verse = document.getElementById('sc-input').value.trim();
  if (!verse) {
    document.getElementById('sc-result-area').innerHTML =
      `<div class="feedback-box error">${t('scNeedVerse')}</div>`;
    return;
  }
  if (!scWords.length) {
    document.getElementById('sc-result-area').innerHTML =
      `<div class="feedback-box error">${t('scSelfFillFirst')}</div>`;
    return;
  }
  const btn = document.getElementById('sc-go');
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = t('scAnalyzing');
  document.getElementById('sc-result-area').innerHTML =
    `<div class="ld-empty">${t('scAnalyzing')} <span class="spinner"></span></div>`;

  try {
    const res = await fetch('/api/self-check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ verse, language: lang, user_answers: scWords, complexity: scComplexity }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    scLastResult = data;
    // Replace the editable fill cards in-place with the graded result cards
    // and put only the overall feedback in the result-area below.
    document.getElementById('sc-fill-area').innerHTML = renderScWordCards(data);
    document.getElementById('sc-result-area').innerHTML = renderScOverall(data);
  } catch (err) {
    document.getElementById('sc-result-area').innerHTML =
      `<div class="feedback-box error" style="white-space:pre-wrap">${linkify(escapeHtml(err.message))}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

function renderScWordCards(data) {
  const legend = `
    <div class="sc-legend">
      <span>${t('scLegendCorrect')}</span>
      <span>${t('scLegendPartial')}</span>
      <span>${t('scLegendIncorrect')}</span>
      <span>${t('scLegendMissing')}</span>
    </div>`;

  const cards = (data.words || []).map(w => {
    const overallBadge = scOverallBadge(w.scores || {});
    const fields = [
      ['scYourMeaning', 'meaning'],
      ['scYourRole', 'role'],
      ['scYourNotes', 'notes'],
    ].map(([labelKey, field]) => {
      const score = (w.scores || {})[field] || 'missing';
      const userVal = (w.user || {})[field] || '';
      const correctVal = (w.correct || {})[field] || '';
      return `
        <div class="sc-field-row">
          <div class="sc-field-label">${t(labelKey)}<br><span class="sc-badge ${score}">${scBadgeLabel(score)}</span></div>
          <div class="sc-your ${userVal ? '' : 'empty'}">
            <strong>${t('scYour')}:</strong> ${userVal ? escapeHtml(userVal) : '—'}
          </div>
          <div class="sc-correct"><strong>${t('scCorrect')}:</strong> ${escapeHtml(correctVal)}</div>
        </div>`;
    }).join('');

    return `
      <div class="sc-result-card">
        <div class="sc-result-head">
          <span class="sc-arabic" dir="rtl">${escapeHtml(w.arabic || '')}</span>
          ${overallBadge}
        </div>
        ${fields}
        ${w.feedback ? `<div class="sc-feedback">${escapeHtml(w.feedback)}</div>` : ''}
      </div>`;
  }).join('');

  return legend + cards;
}

function renderScOverall(data) {
  return data.overall_feedback
    ? `<div class="sc-overall"><strong>${t('scOverall')}:</strong> ${escapeHtml(data.overall_feedback)}</div>`
    : '';
}

function scBadgeLabel(score) {
  switch (score) {
    case 'correct':   return t('scLegendCorrect');
    case 'partial':   return t('scLegendPartial');
    case 'incorrect': return t('scLegendIncorrect');
    default:          return t('scLegendMissing');
  }
}

function scOverallBadge(scores) {
  const vals = Object.values(scores);
  if (!vals.length) return '';
  if (vals.every(v => v === 'correct')) return `<span class="sc-badge correct">${t('scLegendCorrect')}</span>`;
  if (vals.some(v => v === 'incorrect')) return `<span class="sc-badge incorrect">${t('scLegendIncorrect')}</span>`;
  if (vals.some(v => v === 'partial'))   return `<span class="sc-badge partial">${t('scLegendPartial')}</span>`;
  return `<span class="sc-badge missing">${t('scLegendMissing')}</span>`;
}

// ─── Verse Analysis (I'rab) ───────────────────────────────────────────────────

let lastIrabResult = null;
let quranChapters = null; // cached array of {id, name_simple, name_arabic, translated_name, verses_count}
let pickerState = { surah: '', ayah: '' };

async function fetchChapters() {
  const apiLang = lang === 'tr' ? 'tr' : (lang === 'ar' ? 'ar' : 'en');
  const cacheKey = `quran_chapters_v1_${apiLang}`;
  if (quranChapters && quranChapters.__lang === apiLang) return quranChapters;
  const cached = localStorage.getItem(cacheKey);
  if (cached) {
    try {
      quranChapters = JSON.parse(cached);
      quranChapters.__lang = apiLang;
      return quranChapters;
    } catch (e) {}
  }
  const res = await fetch(`https://api.quran.com/api/v4/chapters?language=${apiLang}`);
  const data = await res.json();
  quranChapters = data.chapters || [];
  quranChapters.__lang = apiLang;
  localStorage.setItem(cacheKey, JSON.stringify(quranChapters));
  return quranChapters;
}

function renderIrab(ref) {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="topic-header">
      <h2>${ref.title[lang]}</h2>
      <p>${ref.desc[lang]}</p>
    </div>
    <div class="section">
      <div class="irab-picker">
        <div class="irab-picker-field">
          <label>${t('irabPickSurah')}</label>
          <select id="picker-surah" onchange="onSurahChange()" disabled>
            <option value="">${t('irabPickLoading')}</option>
          </select>
        </div>
        <div class="irab-picker-field" style="max-width: 130px">
          <label>${t('irabPickAyah')}</label>
          <select id="picker-ayah" disabled><option value="">—</option></select>
        </div>
        <div class="irab-picker-field" style="flex: 0; min-width: 130px">
          <label>&nbsp;</label>
          <button class="btn-primary" id="picker-load" onclick="loadVerse()" disabled style="padding:9px 18px">${t('irabPickLoad')}</button>
        </div>

          <label>&nbsp;</label>
          <div style="display:flex; gap:6px;">
            <button class="btn-secondary" id="picker-prev" onclick="stepVerse(-1)" disabled
                    title="${t('irabPickPrev')}" style="padding:9px 12px; font-weight:700;">◀</button>
            <button class="btn-secondary" id="picker-next" onclick="stepVerse(1)" disabled
                    title="${t('irabPickNext')}" style="padding:9px 12px; font-weight:700;">▶</button>
          </div>
        </div>
      </div>
      <div class="irab-input">
        <div style="font-size:0.78rem; color:var(--muted); margin-bottom:6px;">${t('irabOrPaste')}</div>
        <textarea class="irab-textarea" id="irab-input"
          placeholder="${escapeHtml(t('irabPlaceholder'))}"></textarea>
        <div class="irab-actions">
          <button class="btn-secondary" onclick="document.getElementById('irab-input').value=''; document.getElementById('irab-results').innerHTML=''; lastIrabResult=null">${t('irabClear')}</button>
          <span class="spacer"></span>
          <button class="btn-primary" id="irab-go" onclick="analyzeVerse()">${t('irabAnalyze')}</button>
        </div>

    </div>`;

    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) analyzeVerse();
  });

async function populateSurahDropdown() {
  const sel = document.getElementById('picker-surah');
  if (!sel) return;
  try {
    const chapters = await fetchChapters();
    const opts = ['<option value="">—</option>'];
    for (const c of chapters) {
      const tname = c.translated_name && c.translated_name.name ? ` — ${c.translated_name.name}` : '';
      opts.push(`<option value="${c.id}" data-verses="${c.verses_count}">${c.id}. ${escapeHtml(c.name_simple)}${escapeHtml(tname)}</option>`);
    }
    sel.innerHTML = opts.join('');
    sel.disabled = false;
    if (pickerState.surah) {
      sel.value = pickerState.surah;
      onSurahChange();
    }
  } catch (e) {
    sel.innerHTML = `<option value="">Failed to load: ${escapeHtml(e.message)}</option>`;
  }
}

function onSurahChange() {
  const sSel = document.getElementById('picker-surah');
  const aSel = document.getElementById('picker-ayah');
  const loadBtn = document.getElementById('picker-load');
  pickerState.surah = sSel.value;
  pickerState.ayah = '';
  refreshStepButtons();
  if (!sSel.value) {
    aSel.disabled = true;
    aSel.innerHTML = '<option value="">—</option>';
    loadBtn.disabled = true;
    return;
  }
  const opt = sSel.options[sSel.selectedIndex];
  const versesCount = parseInt(opt.dataset.verses) || 0;
  const opts = ['<option value="">—</option>'];
  for (let i = 1; i <= versesCount; i++) opts.push(`<option value="${i}">${i}</option>`);
  aSel.innerHTML = opts.join('');
  aSel.disabled = false;
  aSel.onchange = () => {
    pickerState.ayah = aSel.value;
    loadBtn.disabled = !aSel.value;
    refreshStepButtons();
  };
}

function refreshStepButtons() {
  const prev = document.getElementById('picker-prev');
  const next = document.getElementById('picker-next');
  if (!prev || !next) return;
  const s = parseInt(pickerState.surah);
  const a = parseInt(pickerState.ayah);
  const hasSelection = !!(s && a);
  // Disable Prev at 1:1 and Next at 114:last
  let disablePrev = !hasSelection;
  let disableNext = !hasSelection;
  if (hasSelection) {
    if (s === 1 && a === 1) disablePrev = true;
    if (quranChapters && s === quranChapters.length) {
      const lastSurah = quranChapters[quranChapters.length - 1];
      if (a >= (lastSurah.verses_count || 0)) disableNext = true;
    }
  }
  prev.disabled = disablePrev;
  next.disabled = disableNext;
}

async function stepVerse(direction) {
  if (!quranChapters) return;
  let s = parseInt(pickerState.surah);
  let a = parseInt(pickerState.ayah);
  if (!s || !a) return;

  if (direction > 0) {
    const cur = quranChapters.find(c => c.id === s);
    if (a < cur.verses_count) {
      a += 1;
    } else if (s < quranChapters.length) {
      s += 1;
      a = 1;
    } else {
      return; // already at 114:last
    }
  } else {
    if (a > 1) {
      a -= 1;
    } else if (s > 1) {
      s -= 1;
      a = quranChapters.find(c => c.id === s).verses_count;
    } else {
      return; // already at 1:1
    }
  }

  // Apply to dropdowns
  const sSel = document.getElementById('picker-surah');
  const aSel = document.getElementById('picker-ayah');
  if (parseInt(sSel.value) !== s) {
    sSel.value = String(s);
    onSurahChange();   // rebuilds the ayah dropdown
  }
  aSel.value = String(a);
  pickerState.ayah = String(a);
  document.getElementById('picker-load').disabled = false;
  refreshStepButtons();

  await loadVerse();
}

async function loadVerse() {
  const sSel = document.getElementById('picker-surah');
  const aSel = document.getElementById('picker-ayah');
  const loadBtn = document.getElementById('picker-load');
  if (!sSel.value || !aSel.value) return;
  const verseKey = `${sSel.value}:${aSel.value}`;

  loadBtn.disabled = true;
  loadBtn.textContent = t('irabPickLoading');

  try {
    const res = await fetch(`https://api.quran.com/api/v4/verses/by_key/${verseKey}?fields=text_uthmani,text_imlaei`);
    const data = await res.json();
    const verseText = (data.verse && (data.verse.text_uthmani || data.verse.text_imlaei)) || '';
    if (!verseText) throw new Error('No verse text returned');
    const ta = document.getElementById('irab-input');
    ta.value = verseText;
    ta.focus();
  } catch (e) {
    document.getElementById('irab-results').innerHTML =
      `<div class="feedback-box error">Failed to load verse ${verseKey}: ${escapeHtml(e.message)}</div>`;
  } finally {
    loadBtn.disabled = false;
    loadBtn.textContent = t('irabPickLoad');
  }
}

async function analyzeVerse() {
  const input = document.getElementById('irab-input');
  const verse = input.value.trim();
  if (!verse) { input.focus(); return; }

  const btn = document.getElementById('irab-go');
  const results = document.getElementById('irab-results');
  btn.disabled = true;
  btn.textContent = t('irabAnalyzing');
  results.innerHTML = `<div class="feedback-box loading"><span class="spinner"></span> ${t('irabAnalyzing')}</div>`;

  try {
    const res = await fetch('/api/irab', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ verse, language: lang }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    lastIrabResult = data;
    results.innerHTML = renderIrabResult(data);
  } catch (err) {
    results.innerHTML = `<div class="feedback-box error" style="white-space:pre-wrap">${linkify(escapeHtml(err.message))}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = t('irabAnalyze');
  }
}

function linkify(html) {
  // Convert https://... URLs (already escaped) to clickable anchors
  return html.replace(/(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">$1</a>');
}

function renderIrabResult(data) {
  const words = data.words || [];
  const wordsHtml = words.map(w => {
    // Schema supports both new ("word") and legacy ("ar") field names
    const arabic = w.word || w.ar || '';
    const refs = (w.lesson_refs || []).map(r => {
      const idx = LESSON_INDEX && LESSON_INDEX[r.lesson_id];
      const title = idx ? (idx.verified_title[lang] || idx.verified_title.en) : r.lesson_id;
      const tooltip = `${r.lesson_id} — ${title}\n${r.reason || ''}`;
      return `<button class="irab-ref-chip" title="${escapeHtml(tooltip)}" onclick="jumpToLesson('${r.lesson_id}')">${escapeHtml(r.lesson_id)} · ${escapeHtml((title || '').slice(0, 28))}${title && title.length > 28 ? '…' : ''}</button>`;
    }).join('');

    const grammarRows = [];
    if (w.type) grammarRows.push([t('irabType'), w.type]);
    if (w.root) grammarRows.push([t('irabRoot'), w.root]);
    if (w.form) grammarRows.push([t('irabForm'), w.form]);
    if (w.case_mood) grammarRows.push([t('irabCase'), w.case_mood]);
    if (w.role) grammarRows.push([t('irabRole'), w.role]);
    const grammarHtml = grammarRows.map(([k, v]) =>
      `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`).join('');

    const notesHtml = w.notes
      ? `<div class="irab-word-notes"><strong>${t('irabNotes')}:</strong> ${escapeHtml(w.notes)}</div>`
      : '';

    return `<div class="irab-word">
      <div class="irab-word-ar">${escapeHtml(arabic)}</div>
      ${w.transliteration ? `<div class="irab-word-translit">${escapeHtml(w.transliteration)}</div>` : ''}
      ${w.meaning ? `<div class="irab-word-meaning">${escapeHtml(w.meaning)}</div>` : ''}
      ${grammarHtml ? `<dl class="irab-word-grammar">${grammarHtml}</dl>` : ''}
      ${notesHtml}
      <div class="irab-refs">
        ${refs || `<span style="color:var(--muted);font-size:0.78rem">${t('irabNoLessons')}</span>`}
      </div>
    </div>`;
  }).join('');

  return `
    ${data.translation ? `<div class="irab-translation"><strong>${t('irabTranslation')}:</strong> ${escapeHtml(data.translation)}</div>` : ''}
    <div class="irab-words">${wordsHtml}</div>
    ${data.overall_notes ? `<div class="irab-notes">${escapeHtml(data.overall_notes)}</div>` : ''}
  `;
}

function jumpToLesson(lessonId) {
  // lessonId looks like "L1W4" → level=1, week=4 → idx=3
  const m = /^L(\d)W(\d+)$/.exec(lessonId);
  if (!m) return;
  const levelId = `level${m[1]}`;
  const weekIdx = parseInt(m[2]) - 1;
  if (LEVELS.find(l => l.id === levelId)?.lessons[weekIdx]) {
    clickLesson(levelId, weekIdx);
  }
}

function openFeedbackModal() {

}

function setupFeedbackDnD() {
  const dz = document.getElementById('fb-dropzone');
  if (!dz) return;
  ['dragenter', 'dragover'].forEach(evt =>
    dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.add('dragging'); }));
  ['dragleave', 'drop'].forEach(evt =>
    dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.remove('dragging'); }));
  dz.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) onFeedbackFile(file);
  });
  // Paste image from clipboard while modal is open
  document.addEventListener('paste', handleFeedbackPaste);
}

function handleFeedbackPaste(e) {
  if (!document.getElementById('fb-card')) {
    document.removeEventListener('paste', handleFeedbackPaste);
    return;
  }
  const items = (e.clipboardData || {}).items || [];
  for (const it of items) {
    if (it.type && it.type.startsWith('image/')) {
      const file = it.getAsFile();
      if (file) { onFeedbackFile(file); break; }
    }
  }
}

function onFeedbackFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  // Resize/compress if larger than ~1MB so the GitHub upload is reasonable
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1600;
      let { width, height } = img;
      if (width > MAX || height > MAX) {
        const scale = MAX / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      feedbackScreenshot = canvas.toDataURL('image/png');
      renderFeedbackThumb();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderFeedbackThumb() {
  const t_el = document.getElementById('fb-thumb');
  if (!t_el) return;
  if (!feedbackScreenshot) { t_el.innerHTML = ''; return; }
  t_el.innerHTML = `
    <div class="modal-thumb-wrap">
      <img class="modal-thumb" src="${feedbackScreenshot}" />
      <button class="modal-thumb-remove" onclick="removeFeedbackScreenshot()" title="${t('fbScreenshotRemove')}">×</button>
    </div>`;
}

function removeFeedbackScreenshot() {
  feedbackScreenshot = null;
  document.getElementById('fb-file').value = '';
  renderFeedbackThumb();
}

function closeFeedbackModal() {
  document.getElementById('feedback-modal-root').innerHTML = '';
  feedbackScreenshot = null;
  document.removeEventListener('paste', handleFeedbackPaste);
}

function setFeedbackType(type) {
  feedbackType = type;
  document.getElementById('fb-type-bug').classList.toggle('active', type === 'bug');
  document.getElementById('fb-type-enh').classList.toggle('active', type === 'enhancement');
  const titleInput = document.getElementById('fb-title');
  if (titleInput && !titleInput.value) {
    titleInput.placeholder = type === 'bug' ? t('fbTitleBugPlaceholder') : t('fbTitleEnhPlaceholder');
  }
}

async function submitFeedback() {
  const titleField = document.getElementById('fb-title');
  const descField = document.getElementById('fb-desc');
  const errEl = document.getElementById('fb-error');
  const submitBtn = document.getElementById('fb-submit-btn');
  const title = titleField.value.trim();
  const desc = descField.value.trim();
  if (!title) { titleField.focus(); return; }

  errEl.textContent = '';
  submitBtn.disabled = true;
  submitBtn.textContent = t('fbSubmitting');

  // Build context-rich body
  const ctx = [];
  if (currentView) {
    if (currentView.type === 'lesson' && currentView.lesson) {
      ctx.push(`- Page: Lesson "${currentView.level.title.en}" / Week ${currentView.lesson.week} — ${currentView.lesson.title.en}`);
    } else if (currentView.type === 'level' && currentView.level) {
      ctx.push(`- Page: Level overview — ${currentView.level.title.en}`);
    } else if (currentView.type === 'reference' && currentView.ref) {
      ctx.push(`- Page: Reference — ${currentView.ref.title.en}`);
    }
  } else {
    ctx.push('- Page: Welcome screen');
  }
  ctx.push(`- UI language: ${lang.toUpperCase()}`);
  ctx.push(`- Browser: ${navigator.userAgent.slice(0, 120)}`);
  ctx.push(`- Time: ${new Date().toISOString()}`);

  const body = (feedbackType === 'bug'
    ? `**What happened:**\n${desc || '(no description)'}\n\n**Context (auto-captured):**\n${ctx.join('\n')}`
    : `**What you'd like:**\n${desc || '(no description)'}\n\n**Context (auto-captured):**\n${ctx.join('\n')}`
  );

  try {
    const res = await fetch('/api/feedback-issue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: feedbackType,
        title,
        body,
        screenshot: feedbackScreenshot,
      }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);

    // Show success card inside the modal
    document.getElementById('fb-card').innerHTML = `
      <h3>${t('fbTitle')}</h3>
      <div class="modal-success">
        ${t('fbSuccess')} <strong>#${data.issue_number}</strong>.
      </div>
      <div class="modal-actions">
        <a href="${data.issue_url}" target="_blank" rel="noopener" class="btn-secondary" style="text-decoration:none">${t('fbViewIssue')}</a>
        <button class="btn-primary" onclick="closeFeedbackModal()">OK</button>
      </div>`;
  } catch (err) {
    errEl.textContent = `${t('fbErrorPrefix')} ${err.message}`;
    submitBtn.disabled = false;
    submitBtn.textContent = t('fbSubmit');
  }
}

// ─── Utils ────────────────────────────────────────────────────────────────────

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/\n/g, '<br>');
}

async function attemptLogin() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    if (!res.ok) {
      renderLoginScreen('err');
      return;
    }
    // Refresh: simplest way to re-init the SPA with the new session
    window.location.reload();
  } catch {
    renderLoginScreen('err');
  }
}

async function logout() {
  try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch {}
  window.location.reload();
}

// ─── Admin panel ──────────────────────────────────────────────────────────────

// Set of classroom IDs whose student cards are currently expanded.
const expandedClassrooms = new Set();

function adminToggleClassroom(cid) {
  if (expandedClassrooms.has(cid)) expandedClassrooms.delete(cid);
  else expandedClassrooms.add(cid);
  openAdminPanel();
}

async function openAdminPanel() {
  if (!CURRENT_USER || CURRENT_USER.role !== 'admin') return;
  currentView = { type: 'admin' };   // mark so renderSidebar deselects everything
  expandedLevel = null;
  renderSidebar();
  const main = document.getElementById('main');
  main.innerHTML = `<div class="topic-header"><h2>${t('admHeader')}</h2><p>${t('quizLoading') || '…'}</p></div>`;
  try {
    const [u, c, m] = await Promise.all([
      fetch('/api/admin/users', { credentials: 'same-origin' }).then(r => r.json()),
      fetch('/api/admin/classrooms', { credentials: 'same-origin' }).then(r => r.json()),
      fetch('/api/admin/modules', { credentials: 'same-origin' }).then(r => r.json()),
    ]);
    renderAdminPanel(u.users, u.all_lessons, c.classrooms, (m && m.states) || {});
  } catch (e) {
    main.innerHTML = `<div class="topic-header"><h2>Admin</h2><p style="color:#991b1b">Error: ${escapeHtml(e.message)}</p></div>`;
  }
}

function renderAdminPanel(users, allLessons, classrooms, moduleStates) {
  const main = document.getElementById('main');
  classrooms = classrooms || [];
  moduleStates = moduleStates || {};

  // Module activation cards — one per REFERENCE_TOPICS entry. A module is
  // active unless an explicit `false` state has been stored for it.
  const moduleCards = REFERENCE_TOPICS.map(m => {
    const active = moduleStates[m.id] !== false;
    return `
      <div class="ad-module ${active ? '' : 'off'}">
        <div class="ad-module-icon">${m.icon}</div>
        <div class="ad-module-info">
          <div class="ad-module-name">${escapeHtml(m.title[lang] || m.title.en)}</div>
          <div class="ad-module-tag">${active ? t('admModuleActiveTag') : t('admModuleInactiveTag')}</div>
        </div>
        <label class="ad-switch" title="${active ? t('admModuleOn') : t('admModuleOff')}">
          <input type="checkbox" ${active ? 'checked' : ''}
                 onchange="adminToggleModule('${m.id}', this.checked, this)" />
          <span class="ad-switch-track"><span class="ad-switch-thumb"></span></span>
        </label>
      </div>`;
  }).join('');
  // Group lesson IDs by level for compact rendering
  const byLevel = {1:[], 2:[], 3:[]};
  for (const lid of allLessons) {
    const m = lid.match(/^L(\d)W(\d+)$/);
    if (m) byLevel[+m[1]].push(+m[2]);
  }

  // ── Classroom cards ──
  const renderUnlockGrid = (scope, ownerId, unlockSet, toggleFn, levelAllFn) =>
    [1,2,3].map(L => {
      const cells = byLevel[L].map(W => {
        const id = `L${L}W${W}`;
        const checked = unlockSet.has(id);
        return `<label class="ad-cell ${checked ? 'on' : ''}"><input type="checkbox" data-${scope}="${ownerId}" data-lid="${id}" ${checked ? 'checked' : ''} onchange="${toggleFn}(${ownerId})"/><span>${W}</span></label>`;
      }).join('');
      return `<div class="ad-level"><div class="ad-level-head">L${L}<button class="ad-level-all" onclick="${levelAllFn}(${ownerId}, ${L})">${t('admUnlockAll')}</button></div><div class="ad-cells">${cells}</div></div>`;
    }).join('');

  // (chip strip is no longer needed — members render as full cards inside their classroom)

  // ── User rows (with classroom dropdown) ──
  const classroomOptions = (selected) =>
    `<option value="">${escapeHtml(t('admNoClassroom'))}</option>` +
    classrooms.map(c => `<option value="${c.id}" ${selected === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('');

  // Map classroom_id → its unlock set so we can mark inheritance per user.
  const classroomUnlockSet = {};
  for (const c of classrooms) classroomUnlockSet[c.id] = new Set(c.unlocks);

  function buildUserRow(u) {
    // Visual rule:
    //   - covered by classroom → striped (inherit)
    //   - personal extra NOT in classroom → solid (on)
    //   - else → empty
    const personalSet = new Set(u.personal_unlocks);
    const inheritedSet = u.classroom_id && classroomUnlockSet[u.classroom_id]
      ? classroomUnlockSet[u.classroom_id]
      : new Set();
    const grids = [1,2,3].map(L => {
      const cells = byLevel[L].map(W => {
        const id = `L${L}W${W}`;
        const personalChecked = personalSet.has(id);
        const inherited = inheritedSet.has(id);
        // Striped wins over solid: if classroom covers it, the personal toggle is redundant
        const cls = inherited ? 'inherit' : (personalChecked ? 'on' : '');
        const title = inherited
          ? (personalChecked ? t('admInheritedRedundant') : t('admInherited'))
          : (personalChecked ? t('admPersonalExtra') : '');
        return `<label class="ad-cell ${cls}" title="${title}"><input type="checkbox" data-uid="${u.id}" data-lid="${id}" ${personalChecked ? 'checked' : ''} onchange="adminToggleUnlock(${u.id})"/><span>${W}</span></label>`;
      }).join('');
      return `<div class="ad-level"><div class="ad-level-head">L${L}<button class="ad-level-all" onclick="adminUnlockLevel(${u.id}, ${L})">${t('admUnlockAll')}</button></div><div class="ad-cells">${cells}</div></div>`;
    }).join('');

    const isSelf = CURRENT_USER && CURRENT_USER.id === u.id;
    return `
      <div class="ad-user">
        <div class="ad-user-head">
          <div>
            <span class="ad-email">${escapeHtml(u.display_name)}</span>

              <option value="user" ${u.role === 'user' ? 'selected' : ''}>${t('admRoleUser')}</option>
              <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>${t('admRoleAdmin')}</option>
            </select>
            <label style="font-size:0.74rem;color:var(--muted);">${t('admClassroom')}:</label>

            ${isSelf ? '' : `<button class="btn-secondary" onclick="adminDeleteUser(${u.id}, '${escapeHtml(u.email).replace(/'/g, '&#39;')}')" style="padding:5px 12px; font-size:0.78rem; color:#991b1b; border-color:#fecaca;">${t('admDelete')}</button>`}
          </div>
        </div>
        <div class="ad-hint">${escapeHtml(t('admStudentHint'))}</div>
        <div class="ad-grids">${grids}</div>
      </div>`;
  }

  // ── Group users for the new layout ──
  const adminUsers = users.filter(u => u.role === 'admin');
  const studentsByClassroom = {};
  const unassignedStudents = [];
  for (const u of users) {
    if (u.role === 'admin') continue;
    if (u.classroom_id && classroomUnlockSet[u.classroom_id]) {
      (studentsByClassroom[u.classroom_id] = studentsByClassroom[u.classroom_id] || []).push(u);
    } else {
      unassignedStudents.push(u);
    }
  }

  // Build the classroom shells (each contains its students)
  const classroomBlocks = classrooms.map(c => {
    const set = new Set(c.unlocks);
    const members = studentsByClassroom[c.id] || [];
    const isExpanded = expandedClassrooms.has(c.id);
    const memberCards = members.length
      ? members.map(buildUserRow).join('')
      : `<div class="cr-empty">${escapeHtml(t('admEmptyMembers'))}</div>`;
    const toggleLabel = isExpanded ? t('admCollapse') : t('admExpand');
    return `
      <div class="cr-shell ${isExpanded ? '' : 'collapsed'}">
        <div class="cr-head">
          <div>
            <span class="cr-icon">🏫</span>
            <span class="cr-name-wrap" id="cr-name-wrap-${c.id}">

              <button class="cr-name-edit" title="${t('admRename')}" onclick="adminStartRenameClassroom(${c.id})">✏</button>
            </span>
            <span class="cr-meta">${members.length} ${t('admMembers')} · ${set.size} ${t('admUnlocks')}</span>
          </div>
          <div style="display:flex; gap:8px;">
            ${members.length ? `<button class="btn-secondary cr-expand-btn" onclick="adminToggleClassroom(${c.id})" style="padding:5px 12px; font-size:0.78rem;">${toggleLabel}</button>` : ''}

          </div>
        </div>
        <div class="cr-grid-label">${escapeHtml(t('admClassroomUnlocksLabel'))}</div>
        <div class="ad-grids">${renderUnlockGrid('cid', c.id, set, 'adminToggleClassroomUnlock', 'adminUnlockClassroomLevel')}</div>
        <div class="cr-students-head">${t('admStudents')} <span class="cr-meta">(${members.length})</span></div>
        <div class="cr-students">${memberCards}</div>
      </div>`;
  }).join('');

  const adminCards = adminUsers.map(buildUserRow).join('');
  const unassignedCards = unassignedStudents.map(buildUserRow).join('');

      .ad-level-all { background: transparent; border: 1px solid var(--green); color: var(--green); border-radius: 12px; padding: 2px 10px; font-size: 0.72rem; cursor: pointer; }
      .ad-level-all:hover { background: var(--green-pale); }

      .ad-cell { display: flex; align-items: center; justify-content: center; padding: 5px; background: #f9fafb; border-radius: 4px; font-size: 0.82rem; cursor: pointer; border: 1.5px solid transparent; }

function adminSwitchCreateTab(which) {
  document.getElementById('ad-tab-user').classList.toggle('active', which === 'user');
  document.getElementById('ad-tab-classroom').classList.toggle('active', which === 'classroom');
  document.getElementById('ad-tab-body-user').style.display = which === 'user' ? '' : 'none';
  document.getElementById('ad-tab-body-classroom').style.display = which === 'classroom' ? '' : 'none';
}

async function adminToggleModule(moduleId, active, inputEl) {
  const res = await fetch('/api/admin/modules', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ module_id: moduleId, active }),
  });
  if (!res.ok) {
    alert(t('admErrFailed') + ' ' + res.status);
    if (inputEl) inputEl.checked = !active;   // revert the toggle
    return;
  }
  // Update the card in place + keep the live sidebar state in sync.
  const card = inputEl ? inputEl.closest('.ad-module') : null;
  if (card) {
    card.classList.toggle('off', !active);
    const tag = card.querySelector('.ad-module-tag');
    if (tag) tag.textContent = active ? t('admModuleActiveTag') : t('admModuleInactiveTag');
  }
  if (active) INACTIVE_MODULES.delete(moduleId);
  else INACTIVE_MODULES.add(moduleId);
  renderSidebar();
}

async function adminToggleUnlock(userId) {
  const checks = document.querySelectorAll(`.ad-cell input[data-uid="${userId}"]`);
  const ids = [...checks].filter(c => c.checked).map(c => c.dataset.lid);
  const res = await fetch(`/api/admin/users/${userId}/unlocks`, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lesson_ids: ids }),
  });
  if (res.ok) {
    // Update visuals: toggle .on class on each cell
    checks.forEach(c => c.closest('.ad-cell').classList.toggle('on', c.checked));
  }
}

async function adminUnlockLevel(userId, level) {
  const checks = document.querySelectorAll(`.ad-cell input[data-uid="${userId}"]`);
  // Collect existing checked + add all 14 of this level
  const ids = new Set([...checks].filter(c => c.checked).map(c => c.dataset.lid));
  for (let w = 1; w <= 14; w++) ids.add(`L${level}W${w}`);
  const res = await fetch(`/api/admin/users/${userId}/unlocks`, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lesson_ids: [...ids] }),
  });
  if (res.ok) openAdminPanel();
}

async function adminCreateUser() {
  const email = document.getElementById('ad-new-email').value.trim();
  const password = document.getElementById('ad-new-password').value;
  const role = document.getElementById('ad-new-role').value;
  const first_name = document.getElementById('ad-new-first').value.trim();
  const last_name = document.getElementById('ad-new-last').value.trim();
  const classroomVal = document.getElementById('ad-new-classroom').value;
  const classroom_id = classroomVal ? parseInt(classroomVal) : null;
  if (!email || !password) { alert(t('admErrEmailPw')); return; }
  const res = await fetch('/api/admin/users', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, role, first_name, last_name, classroom_id }),
  });
  const data = await res.json();
  if (!res.ok) { alert(t('admErrCreate') + ' ' + (data.error || res.status)); return; }
  ['ad-new-email','ad-new-password','ad-new-first','ad-new-last'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('ad-new-classroom').value = '';
  openAdminPanel();
}

async function adminDeleteUser(userId, email) {

async function adminCreateClassroom() {
  const el = document.getElementById('ad-new-classroom-name');
  const name = el.value.trim();

  const res = await fetch('/api/admin/classrooms', {

// Inline classroom rename: clicking the ✏ pencil swaps the name for a text
// input. Enter or focus-loss saves; Escape cancels.
function adminStartRenameClassroom(cid) {
  const wrap = document.getElementById('cr-name-wrap-' + cid);
  if (!wrap || wrap.querySelector('input')) return;   // already editing
  const span = document.getElementById('cr-name-' + cid);
  const current = span ? span.dataset.name : '';
  wrap.innerHTML = `<input class="cr-name-input" type="text" value="${escapeHtml(current)}" data-cid="${cid}" data-orig="${escapeHtml(current)}" />`;
  const input = wrap.querySelector('input');
  input.focus();
  input.select();
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); adminCommitRenameClassroom(input); }
    else if (e.key === 'Escape') { e.preventDefault(); input.dataset.done = '1'; openAdminPanel(); }
  });
  input.addEventListener('blur', () => adminCommitRenameClassroom(input));
}

async function adminCommitRenameClassroom(input) {
  if (!input || input.dataset.done) return;   // run once (guards Enter+blur)
  input.dataset.done = '1';
  const cid = input.dataset.cid;
  const name = (input.value || '').trim();
  const original = input.dataset.orig;
  if (!name || name === original) { openAdminPanel(); return; }   // no change
  const res = await fetch(`/api/admin/classrooms/${cid}/rename`, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name }),
  });
  if (!res.ok) alert(t('admErrFailed') + ' ' + res.status);
  openAdminPanel();
}

    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw }),
  });
  if (res.ok) alert(t('admPwResetOk'));
  else alert(t('admErrFailed') + ' ' + res.status);
}
